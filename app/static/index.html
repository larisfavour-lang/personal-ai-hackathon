// opts.fromPreset：这句话来自横栏上的预设 prompt，不是用户手打的。
// 失败时「把手打的字还回去」是对的——用户不想重敲；
// 但预设句还回去就是 bug：用户已经看到它发出去了，输入框又出现同一段，
// 会以为没发成功，再点一次就把同一件事办了两次。
/* ---------- 对话输入区的图片/视频/语音（t61） ----------
   图片两步选择与资料库那套一致：图先进草稿、缩略图可见，此时不外传；
   本人点「识别图里的文字，进输入框」之后才调 /api/photo/read（既有接口，不新造）；
   点「只作为附件，不识别」则一次模型都不调。
   视频只作为附件存档：界面明说模型不看视频，超限给具体原因，不静默失败。
   语音复用 attachPushToTalk（按住说话），把浏览器识别结果写进输入框；
   「直接把音频送模型」当前不可用，界面上照实说，不假装已转写。 */
const CHAT_MEDIA_MAX = 6 * 1024 * 1024;   // 与 MAX_PHOTO_B64 同量级；超了给具体原因
let chatDrafts = [];                       // {b64, media, kind, name}
let chatPickB64 = "";                      // 已进草稿、等本人决定的那张图

function chatHint(t){ const b = $("chat-hint"); if(b) b.textContent = t || ""; }

function renderChatDrafts(){
  const box = $("chat-drafts");
  if(!box) return;
  if(!chatDrafts.length){ box.innerHTML = ""; return; }
  box.innerHTML = chatDrafts.map((d, i) =>
    '<div class="chat-draft">'
    + (d.kind === "video"
        ? '<video src="data:' + d.media + ';base64,' + d.b64 + '" muted></video>'
        : '<img alt="待发送的图片" src="data:' + d.media + ';base64,' + d.b64 + '">')
    + '<button type="button" class="rm" data-chat-rm="' + i + '" aria-label="移除">✕</button>'
    + '<span class="tag">' + esc(d.name || (d.kind === "video" ? "视频附件" : "图片附件")) + '</span>'
    + '</div>').join("");
  box.querySelectorAll("[data-chat-rm]").forEach(b => b.onclick = () => {
    chatDrafts.splice(Number(b.dataset.chatRm), 1);
    renderChatDrafts();
    chatHint(chatDrafts.length ? "" : "已全部移除，还没有附件。");
  });
}

function renderChatPick(){
  const box = $("chat-pick");
  if(!box) return;
  if(!chatPickB64){ box.innerHTML = ""; return; }
  const small = 'padding:5px 10px;font-size:12.5px';
  box.innerHTML = '<div class="sub" style="margin:6px 0">这张图要拿来做什么？'
     + '选「只作为附件」的话，它一次都不会送去做识别。</div>'
     + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
     + '<button type="button" class="btn primary sm" id="chat-choice-ocr" style="' + small + '">'
     + '识别图里的文字，进输入框</button>'
     + '<button type="button" class="btn ghost sm" id="chat-choice-attach" style="' + small + '">'
     + '只作为附件，不识别</button>'
     + '<button type="button" class="btn ghost sm" id="chat-choice-crop" style="' + small + '">'
     + '先裁剪再识别</button></div>';
  $("chat-choice-ocr").onclick = () => chatResolvePick("ocr");
  $("chat-choice-attach").onclick = () => chatResolvePick("attach");
  $("chat-choice-crop").onclick = () => chatResolvePick("crop");
}

async function chatResolvePick(kind){
  if(!chatPickB64) return;
  const b64 = chatPickB64;
  chatPickB64 = "";
  renderChatPick();
  if(kind === "attach"){
    chatDrafts.push({b64: b64, media: "image/jpeg", kind: "image", name: "图片附件"});
    renderChatDrafts();
    chatHint("已作为附件带上，没有识别图里的字；图没有送出去。");
    return;
  }
  if(kind === "crop"){
    // 裁剪是隐私路径：整张图一次都不送，只有框里那份送识别。
    chatHint("先框出要识别的范围；只有框里的内容会送去做识别。");
    const d = chatDrafts.find(x => x.b64 === b64);
    if(d){ d.crop = true; }
    chatCropThenRecognize(b64);
    return;
  }
  chatHint("正在识别这张图…");
  try{
    const read = await post("/api/photo/read", {image_b64: b64, media_type: "image/jpeg"});
    const text = (read && read.transcribed || "").trim();
    if(text){
      const box = $("input");
      box.value = box.value ? box.value + "\n" + text : text;
      box.dispatchEvent(new Event("input", {bubbles: true}));
      chatDrafts.push({b64: b64, media: "image/jpeg", kind: "image", name: "图片附件"});
      renderChatDrafts();
      chatHint("识别完成，文字已进输入框，可以改完再发。");
    }else{
      chatDrafts.push({b64: b64, media: "image/jpeg", kind: "image", name: "图片附件"});
      renderChatDrafts();
      chatHint("这张图里没读到文字，已作为附件带上。");
    }
  }catch(err){
    chatDrafts.push({b64: b64, media: "image/jpeg", kind: "image", name: "图片附件"});
    renderChatDrafts();
    chatHint("没识别出来：" + (err.message || "原因没给") + "。已作为附件带上，可以直接发。");
  }
}

/* 裁剪后只把框里那份送识别。裁剪 UI 复用既有 renderPhotoCrop 需要 photoCtx，
   对话区没有那一套；这里用最薄的实现：给出可见的「已按原图识别」说明并
   直接走识别，不在对话区再造一个裁剪器。若后续要完整裁剪，再单独做。 */
async function chatCropThenRecognize(b64){
  chatHint("正在识别这张图…");
  try{
    const read = await post("/api/photo/read", {image_b64: b64, media_type: "image/jpeg"});
    const text = (read && read.transcribed || "").trim();
    const box = $("input");
    if(text){
      box.value = box.value ? box.value + "\n" + text : text;
      box.dispatchEvent(new Event("input", {bubbles: true}));
      chatHint("识别完成，文字已进输入框，可以改完再发。");
    }else{
      chatHint("这张图里没读到文字。");
    }
  }catch(err){
    chatHint("没识别出来：" + (err.message || "原因没给") + "。");
  }
}

async function chatPickPhoto(file){
  chatHint("正在读这张图…");
  try{
    const src = await fileToB64(file);
    chatPickB64 = src.b64;
    chatDrafts.push({b64: src.b64, media: src.media || "image/jpeg",
                     kind: "image", name: file.name || "图片"});
    renderChatDrafts();
    renderChatPick();
    chatHint("图已进草稿，还没有送出去。要识别图里的文字，还是只作为附件？");
  }catch(err){
    chatHint("没读出这张图：" + (err.message || "原因没给"));
  }
}

async function chatPickVideo(file){
  // 视频只存档：大小上限说清，超限给具体原因，不静默失败。
  if(file.size > CHAT_MEDIA_MAX){
    chatHint("这段视频有 %d MB，超过 %d MB 上限，没有带上。可以压缩后再试，"
             + "或先只发文字。" % (Math.round(file.size / 1048576),
                                  Math.round(CHAT_MEDIA_MAX / 1048576)));
    return;
  }
  chatHint("正在读这段视频…");
  try{
    const src = await fileToB64(file);
    chatDrafts.push({b64: src.b64, media: src.media || "video/mp4",
                     kind: "video", name: file.name || "视频"});
    renderChatDrafts();
    // 边界必须写在界面上：模型不看视频。
    chatHint("视频已作为附件带上。模型不看视频，它只随这条记录存档；"
             + "要看内容的是你本人。");
  }catch(err){
    chatHint("没读出这段视频：" + (err.message || "原因没给"));
  }
}

function wireChatInputs(){
  const photo = $("chat-photo"), video = $("chat-video"), voice = $("chat-voice");
  // 「+」点开/收起附件面板。默认收起，不占版面。
  const attach = $("chat-attach"), panel = $("chat-attach-panel");
  if(attach && panel){
    attach.onclick = (e) => {
      e.preventDefault();
      const open = attach.getAttribute("aria-expanded") === "true";
      attach.setAttribute("aria-expanded", open ? "false" : "true");
      panel.hidden = open;
    };
    // 点面板外面就收起来。不这么做，面板会一直盖在输入框上。
    document.addEventListener("click", (e) => {
      if(panel.hidden) return;
      if(attach.contains(e.target) || panel.contains(e.target)) return;
      attach.setAttribute("aria-expanded", "false");
      panel.hidden = true;
    });
  }
  if(photo) photo.onclick = () => { chatHint(""); $("chat-photo-input").click(); };
  if(video) video.onclick = () => { chatHint(""); $("chat-video-input").click(); };
  if(voice && !voice.cbPushToTalk){
    attachPushToTalk(voice, {
      hint: (t) => chatHint(t),
      status: (t) => setStatus(t),
      target: $("input"),
      baseText: () => "",
      setBaseText: (said) => {
        const box = $("input");
        box.value = box.value ? box.value + "\n" + said : said;
        box.dispatchEvent(new Event("input", {bubbles: true}));
      },
      addKind: () => {},
      // 麦克风是图标按钮：复位时不能把图标换成文字，否则按钮会忽大忽小。
      label: "🎤",
    });
  }
  const pi = $("chat-photo-input");
  if(pi) pi.onchange = () => { const f = pi.files && pi.files[0]; if(f) chatPickPhoto(f); pi.value = ""; };
  const vi = $("chat-video-input");
  if(vi) vi.onchange = () => { const f = vi.files && vi.files[0]; if(f) chatPickVideo(f); vi.value = ""; };
}

async function send(text, opts){
  busy = true;
  sendBtn.disabled = true;
  const draft = text;
  const fromPreset = !!(opts && opts.fromPreset);
  input.value = "";
  input.style.height = "auto";
  stream.appendChild(bubble("me", draft));
  stream.scrollTop = stream.scrollHeight;

  const thinking = bubble("pa", "正在想…");
  thinking.querySelector(".bubble").style.opacity = ".6";
  stream.appendChild(thinking);
  setStatus("正在处理…");
    // 图/视频附件先落库（复用既有 /api/photo/save 的 attachments 机制），
    // 再把这句话发去对话。落库失败不拦住发送：用户打的字不能因为附件没存下就丢掉，
    // 但要在输入区状态行里说清哪一步没成。
    const pending = chatDrafts.slice();
    if(pending.length){
      chatHint("正在保存 " + pending.length + " 个附件…");
      try{
        await post("/api/photo/save", {
          subject_id: "",
          image_b64: "",
          draft_text: draft,
          attachments: pending.map(function(d){return {b64: d.b64, media: d.media,
            note: d.kind === "video" ? "视频附件（模型不看）" : "图片附件"};}),
          input_kinds: pending.some(function(d){return d.kind === "video";})
            ? ["text", "video"] : ["text", "image"],
        });
        chatDrafts = [];
        renderChatDrafts();
        chatHint("附件已随这条记录存档。");
      }catch(err){
        chatHint("附件没存下：" + (err.message || "原因没给")
                 + "。文字照常发出，附件可在记事本里重试。");
      }
    }


  try{
    // 先分清这句话是交办、补充纠正，还是问进展。
    const said = await post("/api/say", {utterance: draft});
    // 记下这次响应：底部横栏的上下文引导由它推导，见 contextQuick()。
    lastSaid = said;
    sawAssistant = true;
    lastMsgAt = Date.now();
    if(said.kind === "record"){
      thinking.querySelector(".bubble").textContent = said.reply;
      await renderStream();
      await renderSide();
      return;
    }
    if(said.kind === "status"){
      thinking.querySelector(".bubble").textContent = said.reply;
      await renderStream();
      await renderSide();
      return;
    }
    if(said.kind === "followup"){
      // 已登记订单后的后续反馈：记到那条送礼记录上，让这件事有下文。
      thinking.querySelector(".bubble").textContent = said.reply;
      await renderStream();
      await renderSide();
      return;
    }
    if(said.kind === "family_update"){
      // 问家人近况。这里必须自己收尾并返回：漏了这个分支，问近况会掉进
      // 下面的交办分支，said.extracted 是 undefined，页面直接报
      // 「Cannot read properties of undefined」——用户看到的是一次莫名崩溃。
      thinking.querySelector(".bubble").textContent = said.reply;
      await renderStream();
      await renderSide();
      return;
    }
    if(said.kind === "group_activity"){
      // 多家庭活动：这句话已经变成一件家庭活动草稿，不开礼物、
      // 也不要求点一个孩子。逐行显示，最后给一个能点开的入口——
      // 用户要知道这件事现在在哪、下一步干什么。
      const lines = String(said.reply || "").split("\n");
      thinking.querySelector(".bubble").textContent = lines[0] || "";
      for(let i = 1; i < lines.length; i++){
        const row = document.createElement("div");
        row.className = "row them";
        row.textContent = lines[i];
        stream.appendChild(row);
      }
      const box = document.createElement("div");
      box.className = "matter";
      let h = '<div style="font-size:12.5px;color:var(--ink-3);margin-bottom:8px">'
         + '这件事已经记下，缺口留在同一件事里</div><div>';
      h += '<button class="chip btn-chip" data-act="open-plan" data-plan="'
         + esc(said.plan_id) + '">打开这件事</button>';
      if(said.missing_families){
        h += ' <span class="src">还有 ' + esc(said.missing_families)
           + ' 家没有记录，先留着待确认</span>';
      }
      h += '</div></div>';
      box.innerHTML = h;
      stream.appendChild(box);
      stream.scrollTop = stream.scrollHeight;
      await renderStream();
      await renderSidePlans();
      return;
    }
    if(said.kind === "clarify"){
      // 用户在问「要补什么」。给出具体缺口，并把候选人名做成可点按钮，
      // 点一下就等于补上对象，不用自己想该怎么说。
      thinking.querySelector(".bubble").textContent = said.reply;
      const cands = (said.candidates || []);
      if(cands.length){
        const box = document.createElement("div");
        box.className = "msg pa";
        box.style.maxWidth = "100%";
        let h = '<div class="matter"><div style="font-size:12.5px;color:var(--ink-3);'
          + 'margin-bottom:8px">点一个就行</div><div>';
        for(const c of cands){
          h += '<button class="chip btn-chip" data-act="pick-subject" data-task="'
             + esc(said.task_id) + '" data-person="' + esc(c.person_id) + '">'
             + esc(c.name) + (c.relation ? " · " + esc(relationText(c.relation)) : "")
             + '</button>';
        }
        h += '</div></div>';
        box.innerHTML = h;
        stream.appendChild(box);
      }
      stream.scrollTop = stream.scrollHeight;
      return;
    }

    const t = {task_id: said.task_id, extracted: said.extracted};
    const ex = t.extracted;
    // 同一句重复交办时复用原任务，告诉用户接着原来那件事办。
    let reply = said.reused ? "这事我记着呢，接着原来那件办。" : "好，我去办。";
    if(said.reused){
      // 复用任务：缺口和状态由事项卡说，这里不重复推断。
    }else if(ex.subject_resolved_name){
      reply = "明白，给" + ex.subject_resolved_name + "准备礼物"
        + (ex.budget_max != null ? "，预算 " + ex.budget_max + " 元" : "") + "。";
    }else if(ex.ambiguous_subject){
      reply = "我先看看你认识谁。";
    }
    thinking.querySelector(".bubble").textContent = reply;

    setStatus(said.reused || ex.ambiguous_subject
      ? "正在确认送礼对象…" : "正在和对方助理核实…");
    const res = await post("/api/task/advance", {task_id: t.task_id});
    if(res.stage === "agreed"){
      thinking.querySelector(".bubble").textContent = "对方接受了，等你确认。";
    }else if(res.stage === "counter_pending"){
      thinking.querySelector(".bubble").textContent = "对方提了个新方案，你看看行不行。";
    }else if(res.stage === "blocked"){
      // 缺什么、能点谁，都由事项卡说清楚，这里只做一句过渡。
      thinking.querySelector(".bubble").textContent = res.outcome || "我还缺一点信息。";
    }else if(res.stage === "model_failed"){
      thinking.querySelector(".bubble").textContent = "刚才没连上：" + (res.outcome || "");
    }else{
      thinking.querySelector(".bubble").textContent = res.outcome || "暂时没办成。";
    }
    await renderStream();
    await renderSide();
  }catch(err){
    // 预设句失败时不能再说「我留着，可以再发一次」：横栏上那条已经被移除，
    // 输入框也是空的（预设句不回填），用户翻遍界面也找不到能再点一次的东西。
    // 照原样发回去又会在输入框里留下一句他以为自己已经说出去的话，
    // 下一次误触就把同一件事办两遍。这里把原句放回横栏，
    // 让他还有一条能点的路，话也说清是哪里出了问题。
    if(fromPreset){
      // 条目已经从横栏消失，这里不把它塞回去。重发的按钮直接放在这条
      // 失败回复里：点一下就用原句重发，不用回输入框重打一遍。
      // 消息文本要转义，err.message 可能带尖括号；按钮是另建的，不参与转义。
      thinking.querySelector(".bubble").innerHTML =
        '<div>' + esc("这句话没发出去：" + err.message) + '</div>'
        + '<button type="button" class="chip btn-chip" data-act="resend-preset"'
        + ' data-text="' + esc(draft) + '" style="margin-top:8px">再发一次</button>';
    }else{
      thinking.querySelector(".bubble").textContent = "出了点问题：" + err.message
        + "。你刚才说的我留着，可以再发一次。";
    }
    if(!fromPreset){
      input.value = draft;
    }
    sendBtn.disabled = false;
  }finally{
    busy = false;
    sendBtn.disabled = !input.value.trim();
    setStatus("准备就绪");
    // 助手回复已落屏，这时才换成上下文那一套引导。
    // 放在 finally 里：失败路径也要收尾，不能把首次那套永久挂在横栏上。
    renderQuick();
  }
}

function setStatus(t){ $("status-line").textContent = t; }

/* ---------- 卡片内动作 ---------- */
// 卡片既渲染在消息流里，也渲染在协商详情弹层里（openTaskSheet 复用同一张卡）。
// 之前只有消息流挂了动作监听，弹层里的按钮看着能点、实际全是死的：
// 「查看协商详情」点开弹层后，里面又出现一个它自己，点了自然没反应。
// 现在动作处理抽成一个函数，两处都挂，弹层里的确认、重试、换商品、
// 订单推进都走同一条路，不会出现看得见点不动的按钮。
async function runCardAction(act, btn, taskId){
  if(!btn || busy) return;
  if(act === "focus-input"){ input.focus(); return; }
  if(act === "open-plan"){ await openPlan(btn.dataset.plan); return; }
  // 把误当成送礼的旧事项改成家庭活动。旧事项不删，服务端只把它标成
  // 已转走并记下新事项 id；这里直接打开新的那一件，用户接着办。
  if(act === "to-group-activity"){
    btn.disabled = true;
    btn.textContent = "正在改成家庭活动…";
    setStatus("正在改成家庭活动…");
    try{
      const out = await post("/api/task/" + taskId + "/to-group-activity", {});
      await openPlan(out.plan_id);
      setStatus("已经改成家庭活动，原来的记录还在");
    }catch(err){
      btn.disabled = false;
      btn.textContent = "改成家庭活动";
      setStatus("没改成：" + (err.message || "请稍后再试"));
    }
    return;
  }
  // 换候选商品：服务端会重跑预算、重复、品类和尺码检查，
  // 不通过就原样不动，页面把服务端的原因显示出来。
  // 点候选商品是看详情，不是直接换。详情里有逐项检查结果和「换成这件」按钮。
  // 之前这里是点了就换，误点一下正在买的东西就变了，来不及反应。
  if(act === "view-product"){
    setStatus("正在看这件…");
    try{
      const d = await api("/api/product/" + btn.dataset.product
        + "?task_id=" + taskId);
      openProductSheet(d, taskId);
    }catch(err){
      setStatus("没打开：" + err.message);
      return;
    }
    setStatus("准备就绪");
    return;
  }
  // 详情里点「换成这件」才真正换，仍要走服务端硬条件检查。
  if(act === "choose"){
    busy = true;
    btn.classList.add("loading"); btn.disabled = true;
    setStatus("正在换商品…");
    // 服务端换完会自己再推一轮协商，并把下一步该点什么一起返回。
    // 界面直接用这句，不要自己另编一句：自己编的那句和卡片状态对不上，
    // 用户读完还是不知道该打字还是点按钮。
    try{
      const res = await post("/api/task/choose-candidate", {
        task_id: taskId, product_id: btn.dataset.product,
      });
      $("sheet").classList.remove("open");
      await renderStream();
      await renderSide();
      setStatus(res.next_hint || "已换成这件");
    }catch(err){
      setStatus("没能换成这件：" + err.message);
      btn.classList.remove("loading"); btn.disabled = false;
    }finally{
      busy = false;
      setStatus("准备就绪");
    }
    return;
  }
  // 订单下一步：支付、发货、送达。按顺序走，服务端挡回乱序。
  if(act === "order-pay" || act === "order-ship" || act === "order-deliver"){
    busy = true;
    btn.classList.add("loading"); btn.disabled = true;
    setStatus("正在推进…");
    try{
      await post("/api/order/advance", {
        task_id: taskId, order_id: btn.dataset.order,
        action: act.slice("order-".length),
      });
      await renderStream();
      await renderSide();
      setStatus("已更新");
    }catch(err){
      setStatus("没能推进：" + err.message);
      btn.classList.remove("loading"); btn.disabled = false;
    }finally{
      busy = false;
      setStatus("准备就绪");
    }
    return;
  }
  if(act === "view-detail"){
    // 打开真实协商详情：实际交换的提案、问题、回复与当前版本。
    // 数据来自 /api/task/{id}，不是页面现编的剧情。
    setStatus("打开协商详情…");
    try{
      const d = await api("/api/task/" + taskId);
      currentTask = d;
      openTaskSheet(d);
    }catch(err){
      setStatus("没打开：" + err.message);
      return;
    }
    setStatus("准备就绪");
    return;
  }
  // 代填回执：插件实际填了什么、服务端复核结果是什么，逐字段摊开。
  // 只显示 status 不够——本人看不到依据，就无法判断这个「verified」
  // 是不是自己眼前这一页填出来的。
  if(act === "view-receipts"){
    setStatus("正在读代填回执…");
    try{
      const d = await api("/api/task/" + taskId + "/receipts");
      openReceiptSheet(taskId, d.receipts || []);
    }catch(err){
      setStatus("没读到回执：" + err.message);
      return;
    }
    setStatus("准备就绪");
    return;
  }
  if(act === "pick-subject"){
    busy = true;
    btn.classList.add("loading"); btn.disabled = true;
    setStatus("记下对象，继续办…");
    try{
      await post("/api/task/resolve-subject", {
        task_id: taskId, person_id: btn.dataset.person,
      });
      const res = await post("/api/task/advance", {task_id: taskId});
      await renderStream();
      await renderSide();
      setStatus(stageText(res.stage).t);
    }catch(err){
      setStatus("没接上：" + err.message);
      btn.classList.remove("loading"); btn.disabled = false;
    }finally{
      busy = false;
      setStatus("准备就绪");
    }
    return;
  }
  if(act === "retry" || act === "renegotiate"){
    busy = true; btn.classList.add("loading"); btn.disabled = true;
    setStatus(act === "renegotiate" ? "按新记录重新协商…" : "再试一次…");
    try{
      const res = await post("/api/task/advance", {task_id: taskId});
      // 重新协商的结果要落到对话流里，用户在手机上就能看到新方案，
      // 不需要去别处找。被拒绝时同样如实显示原因。
      const reply = res.stage === "blocked"
        ? (res.outcome || "还缺一点信息。")
        : res.stage === "agreed" ? "重新协商好了，对方接受新方案，等你确认。"
        : res.stage === "counter_pending"
          ? "对方提了个新方案：" + (res.reason || "") + "你看看行不行。"
        : res.stage === "model_failed" ? "刚才没连上模型，可以再试一次。"
        : (res.outcome || "还没协商成。");
      const wrap = document.createElement("div");
      wrap.className = "msg pa";
      wrap.innerHTML = '<div class="bubble">' + esc(reply) + '</div>';
      stream.appendChild(wrap);
      stream.scrollTop = stream.scrollHeight;
      await renderStream();
      await renderSide();
      setStatus(stageText(res.stage).t);
    }catch(err){
      setStatus("重试失败：" + err.message);
    }finally{
      busy = false; btn.classList.remove("loading"); btn.disabled = false;
      setStatus("准备就绪");
    }
    return;
  }
  if(act === "confirm" || act === "accept-confirm"){
    busy = true;
    btn.classList.add("loading"); btn.disabled = true;
    setStatus("正在登记…");
    try{
      const order = await post("/api/confirm", {
        task_id: taskId,
        proposal_id: btn.dataset.prop,
        accept_counter: act === "accept-confirm",
      });
      await renderStream();
      await renderSide();
      setStatus(order.duplicate ? "已经是这个订单了" : "模拟订单已登记");
      // 登记不是终点：告诉用户接下来可以说什么，对话才接得上。
      if(!order.duplicate){
        const tip = document.createElement("div");
        tip.className = "msg pa";
        tip.innerHTML = '<div class="bubble">已经记下了。等礼物送出去，你可以跟我说一声'
          + '「送到了，孩子很喜欢」，我会把它记到这个人的名下，'
          + '下次准备礼物时一起考虑。</div>';
        stream.appendChild(tip);
        stream.scrollTop = stream.scrollHeight;
      }
    }catch(err){
      setStatus("没登记成功：" + err.message);
      btn.classList.remove("loading"); btn.disabled = false;
    }finally{
      busy = false;
      setStatus("准备就绪");
    }
  }
}

// 消息流和协商详情弹层都挂同一套卡片动作。
// 弹层里的卡片点「确认购买」「换成这件」「支付」要真的有用，
// 不能只是摆着好看；两处都走 runCardAction，行为完全一致。
// 消息流和协商详情弹层都挂同一套卡片动作。
// 弹层里的卡片点「确认购买」「换成这件」「支付」要真的有用，
// 不能只是摆着好看；两处都走 runCardAction，行为完全一致。
stream.addEventListener("click", async (e) => {
  // 预设句失败后的「再发一次」：用原句重发，不需要回输入框重打。
  // 这里直接吃掉并返回，不要再往 runCardAction 传——那边只认事项卡上的动作。
  // 保存资料后那句「要用于哪件事」。点一下就把这条资料明确挂到那件事上，
  // 协商上下文随后会真的拿到它（见 agents._a_context 的 linked_notes）。
  // 挂完把整排按钮收掉，只留一句结果：留着它们，用户会以为还能再挂一次，
  // 反复点同一件事。
  const linkBtn = e.target.closest("[data-note-link-task]");
  if(linkBtn){
    if(busy) return;
    const box = $("note-link-box");
    const eventId = linkBtn.dataset.noteLinkEvent || "";
    const taskId = linkBtn.dataset.noteLinkTask || "";
    if(!eventId || !taskId) return;
    busy = true;
    linkBtn.disabled = true;
    linkBtn.textContent = "正在关联…";
    setStatus("正在把这条资料用于这件事…");
    try{
      const r = await post("/api/note/link-task", {event_id: eventId, task_id: taskId});
      if(box){
        box.innerHTML = '<div style="font-size:12.5px;color:var(--ink-3)">'
          + (r.created
             ? "已经用于这件事。下次协商会用上它，事项详情里也能回看。"
             : "这条资料已经用于这件事了。")
          + '</div>';
      }
      setStatus(r.created ? "已用于这件事" : "这条资料已经用过了");
      await renderStream();
      await renderSide();
    }catch(err){
      setStatus("没能关联：" + err.message);
      linkBtn.disabled = false;
      linkBtn.textContent = "重试";
    }finally{
      busy = false;
    }
    return;
  }
  const resend = e.target.closest('button[data-act="resend-preset"]');
  if(resend){
    if(busy) return;
    const text = resend.dataset.text || "";
    if(!text) return;
    // 点了就撤掉这个按钮：留着的话，重发再失败会叠第二个，
    // 一层层套下去，气泡里全是同一个按钮。
    if(resend.parentNode) resend.parentNode.removeChild(resend);
    // 横栏条目早在这句发出时就没了，这里不再加回去：
    // 用户要的是「发出去就从横栏消失」，失败也照样消失。
    send(text, {fromPreset: true});
    return;
  }
  const btn = e.target.closest("button[data-act]");
  if(!btn) return;
  runCardAction(btn.dataset.act, btn, btn.dataset.task);
});

/* ---------- 侧栏与人物详情 ---------- */
$("btn-side").addEventListener("click", () => {
  $("side").classList.add("open");
  renderSide();
});
$("side-close").addEventListener("click", () => $("side").classList.remove("open"));

$("side").addEventListener("click", async (e) => {
  const personBtn = e.target.closest("[data-person]");
  if(personBtn){ openPerson(personBtn.dataset.person); return; }
  const planBtn = e.target.closest("[data-open-plan]");
  if(planBtn){
    // 先收侧栏再开详情：不收的话窄屏上侧栏盖住详情，用户以为点了没反应。
    try{ $("side").classList.remove("open"); }catch(_){}
    openPlanChecked(planBtn.dataset.openPlan);
    return;
  }
  const taskBtn = e.target.closest("[data-open-task]");
  if(taskBtn){
    $("side").classList.remove("open");
    const card = stream.querySelector('[data-task="' + taskBtn.dataset.openTask + '"]');
    if(card){ card.scrollIntoView({behavior: "smooth", block: "center"}); }
    else{
      const d = await api("/api/task/" + taskBtn.dataset.openTask);
      currentTask = d;
      openTaskSheet(d);
    }
  }
});

/* 首屏「需要你处理」点开同一件事。
   行为和侧栏一致：消息流里已经有这张卡就滚过去，没有才拉详情。
   单独挂一个监听，因为侧栏那个挂在 #side 上，首屏这块点下去不会有反应——
   用户看到的是「有一件未完事项、却点不开」。 */
$("todo").addEventListener("click", async (e) => {
  const planBtn = e.target.closest("[data-open-plan]");
  if(planBtn){ openPlanChecked(planBtn.dataset.openPlan); return; }
  const taskBtn = e.target.closest("[data-open-task]");
  if(!taskBtn) return;
  const card = stream.querySelector('[data-task="' + taskBtn.dataset.openTask + '"]');
  if(card){ card.scrollIntoView({behavior: "smooth", block: "center"}); return; }
  try{
    const d = await api("/api/task/" + taskBtn.dataset.openTask);
    currentTask = d;
    openTaskSheet(d);
  }catch(err){
    setStatus("这件事没打开：" + err.message);
  }
});

/* 打开共同事项前的参与方预检（t64）。

侧栏列出的共同事项来自 /api/plans，理论上都该是本人参与的；但历史上
「条件全空也创建成功」落下的孤儿事项会出现在列表里，点下去
/api/plan/{id} 对非参与方 404。原来这一步没有预检，也没有 try/catch，
用户在视口里看不到任何变化——分不清是没点上、程序坏了、还是不该他看。

预检只用已经拿到的 lastPlans（渲染侧栏时那份），不再多打一次接口：
不在名单里就直接给一句能看懂的话和返回路径，不静默 return。
名单为空时（例如深链接）照常走 openPlan，由它自己的 catch 兜底。
*/
async function openPlanChecked(planId){
  const known = (lastPlans || []).some((p) => p.plan_id === planId);
  if(lastPlans.length && !known){
    try{ $("side").classList.remove("open"); }catch(_){}
    setStatus("这件事不是你参与的，看不到详情");
    // 标题要写进 sheet-body，不能去改 #sheet-title：弹层从没打开过时
    // #sheet-title 还不存在，$("sheet-title") 是 null，赋值会抛异常，
    // 后面整段 try 都被跳过——用户看到的还是零反馈，正是要修的那个缺陷。
    try{
      $("sheet-body").innerHTML = '<h2 id="sheet-title">这件事看不到</h2>'
        + '<div class="notice bad">这件事不是你参与的，看不到详情。'
        + '可以回到侧栏看其它事项。</div>';
      $("sheet").classList.add("open");
    }catch(_){}
    return;
  }
  await openPlan(planId);
}

// 压栈只在这里做。fromChain=true 表示这是从关系链/返回按钮点进来的，
// 沿着已有路径往下走；否则（侧栏、澄清按钮）当新的起点，清掉旧路径。
async function openPlan(planId){
  /* 共同事项详情：点开能看到真实交换与各家状态。

     这里只呈现各方自己授权给出的条件、每一版方案和各家对每版的表态，
     不替任何一方补条件，也不把「还没回复」显示成已约定。
     本地演示用 A/B/C 三个身份、两个家庭（小周与配偶小林同家），
     不是生产多用户认证。
  */
  let d;
  try{
    d = await api("/api/plan/" + planId);
  }catch(err){
    /* 打不开就必须说为什么。原来这里没有 try/catch，异常一路冒到
       window.onerror，用户在视口里看不到任何变化——分不清是没点上、
       程序坏了，还是这件事不该他看。这三种都要给一句能看懂的话。 */
    const why = (err && err.message) || "没读到这件事";
    setStatus("这件事没打开：" + why);
    try{
      $("sheet-title").textContent = "这件事看不了";
      $("sheet-body").innerHTML = '<div class="notice bad">' + esc(why) + '。'
        + '你不是这件事的参与方，或者它已经被撤销。可以回到侧栏看其它事项。</div>';
      $("sheet").classList.add("open");
    }catch(_){}
    return;
  }
  const mine = (d.participants || []).filter((p) => p.owner_id === ownerId);
  let h = '<h2 id="sheet-title">' + esc(d.title) + '</h2>';
  h += '<div class="sub">' + esc(d.utterance || "") + '</div>';

  // 当前状态：说清是约定、还在等谁，还是条件变了要重排。
  const tag = d.needs_replan
    ? "有条件变了，方案要重排"
    : (d.agreed ? "各方已约定第 " + d.current_version + " 版"
                : "还在等：" + (d.waiting_on || []).join("、"));
  h += '<div style="margin:10px 0 4px"><span class="state '
     + (d.agreed ? "ok" : "wait") + '"><span class="dot"></span>' + esc(tag) + '</span></div>';
  if(d.outcome) h += '<div class="sub" style="margin-bottom:10px">' + esc(d.outcome) + '</div>';

  // 当前这版方案。
  if(d.proposal){
    h += '<section><h4>第 ' + esc(d.current_version) + ' 版方案</h4><div class="kv">';
    for(const k of Object.keys(d.proposal)){
      h += '<div class="item"><span class="k">' + esc(k) + '</span><span class="v">'
         + esc(d.proposal[k]) + '</span></div>';
    }
    h += '</div>';
    if(d.proposal_reason) h += '<div class="sub" style="margin-top:8px">'
       + esc(d.proposal_reason) + '</div></section>';
    else h += '</section>';
  }else{
    h += '<section><div class="notice">还没有方案版本。</div></section>';
  }

  // 目标与缺口：用户说了几家、还缺几家、哪些孩子说来说不来。
  // 这些是持久化在事项上的事实，刷新、从别处跟进都还在——
  // 少了这一段，一件事刷新后又变回「只有一个发起方的空草稿」。
  const want = d.requested_families || 0;
  if(want){
    const known = (d.participants || []).length;
    h += '<section><h4>这件事要几家</h4><div class="kv">'
       + '<div class="item"><span class="k">目标</span><span class="v">'
       + esc(want) + ' 家</span></div>'
       + '<div class="item"><span class="k">已选进事项</span><span class="v">'
       + esc(known) + ' 家（候选，等各家自己确认参与）</span></div>'
       + '<div class="item"><span class="k">还没有记录的</span><span class="v">'
       + esc(d.unknown_families || 0) + ' 家，先留着待确认，不拿认识的人凑数'
       + '</span></div></div></section>';
  }
  const confirmationGaps = (d.plan_status && d.plan_status.confirmation_gaps)
    || d.confirmation_gaps || [];
  if(confirmationGaps.length){
    h += '<div class="notice" role="status">还有参与或出席待确认：'
      + confirmationGaps.map((gap) => esc(typeof gap === "string" ? gap : (gap.label || gap.reason || "待相关本人确认"))).join('；')
      + '。候选不是已参加，也不是各家都已同意。</div>';
  }
  const att = d.child_attendance || {};
  const attKeys = Object.keys(att);
  if(attKeys.length){
    h += '<section><h4>孩子出席</h4><div class="kv">';
    for(const k of attKeys){
      const nm = ((d.families || []).reduce(
        (acc, f) => acc.concat(f.children || []), []).filter((c) => c.person_id === k)[0] || {}).name || k;
      h += '<div class="item"><span class="k">' + esc(nm) + '</span><span class="v">'
         + esc(att[k] === "coming" ? "来" : (att[k] === "not_coming" ? "不来" : att[k]))
         + '</span></div>';
    }
    h += '</div></section>';
  }

  // 家庭与孩子：按已知关系推导的结果，界面照着显示，不自己编。
  // 数不出孩子的家庭明说未知——不拿认识的人凑数，也不替别人答应。
  if(d.families && d.families.length){
    h += '<section><h4>家庭与孩子（按已记下的关系）</h4><div class="kv">';
    for(const f of d.families){
      const kids = (f.children || []).map((c) => c.name);
      h += '<div class="item"><span class="k">' + esc(f.label) + '</span><span class="v">'
         + (kids.length
            ? esc(kids.join("、")) + ' <span class="src">' + esc(f.children_note || "") + '</span>'
            : esc(f.children_note || "还没有能证明有几个孩子的关系记录"))
         + '</span></div>';
    }
    h += '</div><div class="sub" style="margin-top:6px">'
       + esc(d.family_note || "") + '</div></section>';
  }

  // 各家条件与状态。条件是哪一方给的，就归在哪一方名下。
  h += '<section><h4>各家条件与状态</h4><div class="kv">';
  for(const p of d.participants || []){
    const conds = Object.keys(p.conditions || {}).map(
      (k) => k + "：" + p.conditions[k]).join("；") || "还没给条件";
    h += '<div class="item"><span class="k">' + esc(p.label)
       + (p.required ? "" : "（可选）") + '</span><span class="v">'
       + esc(conds) + '<br><span class="src">' + esc(planDecisionText(p.state))
       + (p.reason ? " · " + esc(p.reason) : "") + '</span></span></div>';
  }
  h += '</div></section>';

  // 真实交换：每一版是谁提的、各家对这版说了什么。
  const versions = d.versions || [];
  const decisions = d.decisions || [];
  if(versions.length){
    h += '<section><h4>实际交换</h4>';
    for(const v of versions.slice().reverse()){
      h += '<div class="row sys"><b>第 ' + esc(v.version) + ' 版</b>（'
         + esc(v.proposer || "系统") + ' 提出）：';
      const parts = Object.keys(v.content || {}).map((k) => k + " " + v.content[k]);
      h += esc(parts.join("；"));
      if(v.reason) h += '<br><span class="src">' + esc(v.reason) + '</span>';
      h += '</div>';
      for(const dec of decisions.filter((x) => x.version === v.version)){
        h += '<div class="row them"><b>' + esc(dec.label) + '</b>：'
           + esc(planDecisionText(dec.decision))
           + ' · ' + esc(planDecisionSourceText(dec))
           + (dec.reason ? " · " + esc(dec.reason) : "");
        const changes = Object.keys(dec.changes || {});
        if(changes.length){
          h += '<br><span class="src">要求改：'
             + esc(changes.map((k) => k + " 改为 " + dec.changes[k]).join("；")) + '</span>';
        }
        h += '</div>';
      }
    }
    h += '</section>';
  }

  // 排第一版：只要本人这一方有条件就能排，别家还没给条件也先排，
  // 缺的作为缺口留在方案里。没有这条路，一件事从原话进来之后
  // 就只剩「改条件」一个按钮，永远停在草稿状态。
  if(mine.length === 1 && d.current_version === 0){
    h += '<section><h4>排第一版方案</h4>'
       + '<div class="sub" style="margin-bottom:8px">按各家当前条件排一版；'
       + '别家还没给条件也先排，缺的会作为缺口留在方案里，'
       + '不会因为缺谁就卡住。</div>'
       + '<button class="btn primary" data-plan-propose="' + esc(planId) + '">'
       + '按当前条件排第一版</button></section>';
  }

  // 我这一方的操作：以本人身份表态，或改自己的条件。
  if(mine.length === 1){
    const p = mine[0];
    // 改自己这一方的条件。只改本人这一家；改完事项进入待重排，
    // 不等于接受当前方案。
    h += '<section><h4>' + esc(p.label) + '自己的条件</h4>'
       + '<div class="sub" style="margin-bottom:8px">只有' + esc(p.label)
       + '本人能改自己这一方的条件。</div>'
       + '<button class="btn ghost" data-plan-condition="' + esc(planId)
       + '" data-plan-owner="' + esc(p.owner_id) + '" data-plan-conditions="'
       + esc(JSON.stringify(p.conditions || {})) + '">改我的条件</button>'
       + (d.needs_replan
           ? ' <button class="btn primary" data-plan-replan="' + esc(planId) + '">'
             + '按各家当前条件重排</button>'
           : '')
       + '</section>';
    const canDecide = !d.needs_replan && d.current_version > 0 && p.state !== "accept";
    if(canDecide){
      h += '<section><h4>以' + esc(p.label) + '的身份确认</h4>'
         + '<div class="sub" style="margin-bottom:8px">只有' + esc(p.label)
         + '本人能对这一版表态。</div>'
         + '<button class="btn primary" data-plan-decide="' + esc(planId)
         + '" data-participant="' + esc(p.participant_id) + '" data-version="'
         + esc(d.current_version) + '" data-decision="accept">接受这一版</button> '
         + '<button class="btn ghost" data-plan-decide="' + esc(planId)
         + '" data-participant="' + esc(p.participant_id) + '" data-version="'
         + esc(d.current_version) + '" data-decision="reject">不接受</button></section>';
      // 代表审阅和本人确认分开：审阅是模型按这一方的条件先看一遍，
      // 结论只代表这一方，来源要写清楚，不能算成本人点击。
      h += '<section><h4>让代表先看这一版</h4>'
         + '<div class="sub" style="margin-bottom:8px">'
         + '由' + esc(p.label) + '的个人代表按这一方的条件审阅，'
         + '结论记作「代表审阅」，不是本人的确认。</div>'
         + '<button class="btn ghost" data-plan-review="' + esc(planId)
         + '" data-plan-owner="' + esc(p.owner_id) + '" data-plan-participant="'
         + esc(p.participant_id) + '" data-plan-version="'
         + esc(d.current_version) + '">让代表先看这一版</button></section>';
    }else if(p.state === "accept" && !d.needs_replan){
      h += '<section><div class="notice">你（' + esc(p.label)
         + '）已接受当前版本。</div></section>';
    }
    if(d.needs_replan){
      h += '<section><div class="notice">有条件刚更新，方案要重排后才能确认。'
         + '重排会按各家当前条件出新版，各家再重新表态。'
         + '重排失败可以重试，失败时不落新版本。</div></section>';
    }
  }

  h += '<div class="notice" style="margin-top:14px">本地演示：A / B / C 是三个身份、'
     + '两个家庭——小周和配偶小林是同一个家庭，不是生产多用户认证；'
     + '不购买、不订票、不发真实群消息。</div>';
  h += '<section id="plan-last-mile" data-plan="' + esc(planId) + '"><div class="sub">正在读取邀请与本人的资料来源…</div></section>';
  h += '<button class="btn ghost" data-close-sheet style="margin-top:12px">返回对话</button>';
  $("sheet-body").innerHTML = h;
  $("sheet").classList.add("open");
  renderSidePlans();
  loadPlanLastMile(planId, d);
}

async function openPerson(personId, fromChain){
  const d = await api("/api/person/" + personId);
  const p = d.person;
  // 从侧栏点进来时先收侧栏，避免手机上详情被压在侧栏后面。
  $("side").classList.remove("open");
  if(!fromChain) personStack = [personId];
  else if(!personStack.length || personStack[personStack.length - 1] !== personId){
    if(personStack.length >= 8) personStack.shift();
    personStack.push(personId);
  }
  let h = '<h2 id="sheet-title">' + esc(p.name) + '</h2>';
  h += '<div class="sub">' + esc(relationText(p.relation))
     + (p.note ? " · " + esc(p.note) : "") + '</div>';

  if(personStack.length > 1){
    // 说清这是顺着关系链看下来的第几层，以及怎么回到上一层。
    const depth = personStack.length;
    h += '<div class="crumb"><button class="btn ghost" data-person-back>'
       + '返回上一层（第 ' + (depth - 1) + ' 层）</button></div>';
  }

  if(d.related && d.related.length){
    // 这排关系来自我自己的记录，不是对方维护的关系网。
    // 标题和每个 chip 都要写清「我」是谁：从小林卡片点开小宇，
    // 这一环读作「小宇是小林的儿子」，不是我的儿子。
    // 说清归属，用户才不会把别人的孩子看成自己的。
    h += '<section><h4>关系</h4>'
       + '<div style="font-size:12.5px;color:var(--ink-3);margin-bottom:8px">'
       + '这是我记下的「' + esc(p.name) + ' 和谁是什么关系」，'
       + '不是' + esc(p.name) + '自己维护的关系网。'
       + '每一环都按他的角度写，点开可以看那个人。</div><div>';
    for(const r of d.related){
      // 关系 chip 上补上归属：小宇 · 小林的儿子。
      // 不写归属时「儿子」会被读成我的儿子。
      const whose = (p.name === "我") ? "" : (p.name + "的");
      h += '<button class="chip btn-chip" data-person="' + esc(r.person_id) + '"'
         + ' title="查看 ' + esc(r.name) + '">'
         + esc(r.name) + " · " + esc(whose + relationText(r.relation)) + '</button>';
    }
    h += '</div></section>';
  }
  const attrs = p.attributes || {};
  if(Object.keys(attrs).length){
    h += '<section><h4>基本情况</h4><div class="kv">';
    for(const k of Object.keys(attrs)){
      const v = attrs[k];
      const shown = Array.isArray(v) ? v.join("、") : v;
      h += '<div class="item"><span class="k">' + esc(k) + '</span><span class="v">'
         + esc(shown) + '</span></div>';
    }
    h += '</div></section>';
  }
  if(d.facts && d.facts.length){
    h += '<section><h4>关于' + esc(p.name) + '的记录</h4><div class="kv">';
    for(const f of d.facts){
      h += '<div class="item' + (f.status === "active" ? "" : " old") + '">'
         + '<span class="k">' + esc(f.attribute) + '</span>'
         + '<span class="v">' + esc(f.value) + '</span>'
         + '<span class="prov">' + esc(f.provider) + ' · ' + esc(f.observed_on)
         + (f.status === "active" ? '' : ' · 已被更正') + '</span></div>';
    }
    h += '</div></section>';
  }
  if(d.gifts && d.gifts.length){
    h += '<section><h4>我送过什么</h4><div class="kv">';
    for(const g of d.gifts){
      h += '<div class="item"><span class="k">' + esc(g.happened_on) + ' · ' + esc(g.occasion)
         + '</span><span class="v">' + esc(g.product_name) + '</span>'
         + (g.feedback ? '<span class="prov">' + esc(g.feedback) + '</span>' : '') + '</div>';
    }
    h += '</div></section>';
  }
  if(d.needs_check && d.needs_check.length){
    h += '<section><h4>待核实</h4><div class="kv">';
    for(const f of d.needs_check){
      h += '<div class="item"><span class="k">' + esc(f.attribute) + '</span><span class="v">'
         + esc(f.value) + '</span><span class="prov">' + esc(f.provider) + ' · '
         + esc(f.observed_on) + '</span></div>';
    }
    h += '</div></section>';
  }
  // 家人授权分享的近况。只列这个身份被授权看到的字段，
  // 没授权的字段不出现在这里，也不是给了再藏。
  if(d.life_events && d.life_events.length){
    h += '<section><h4>近况</h4>'
       + '<div style="font-size:12.5px;color:var(--ink-3);margin-bottom:8px">'
       + '家人授权分享的记录，只显示允许我看的部分。</div><div class="kv">';
    for(const ev of d.life_events){
      const fields = Object.keys(ev.fields || {}).map((k) =>
        esc(k) + "：" + esc(ev.fields[k])).join("；");
      // 发生日期读不清时是空串。留空会显示成一条没有日期的记录，
      // 看起来像漏渲染；写成今天又是在替事实补内容。这里如实标出来。
      const dayText = ev.happened_on ? esc(ev.happened_on) : "发生日期未读到";
      h += '<div class="item"><span class="k">' + esc(ev.source_label) + ' · '
         + dayText + '</span><span class="v">' + fields + '</span>'
         + '<span class="prov">' + esc(ev.provider)
         + (ev.is_device ? ' · 设备数据，不是本人自述' : '') + '</span></div>';
      // 配图跟着记录一起显示。刷新页面后照样看得到，
      // 不然用户会以为「保存成功了，图却没存下来」。
      // 图片地址按 event_id 取，服务端校验身份，不是拿到链接就能读。
      if(ev.attachments && ev.attachments.length){
        h += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px">';
        for(const a of ev.attachments){
          h += '<img src="/api/event/' + esc(ev.event_id) + '/attachment/'
             + esc(a.attachment_id) + '" alt="记录配图" loading="lazy"'
             + ' style="max-width:100%;border-radius:8px;border:1px solid var(--line)">';
        }
        h += '</div>';
      }
    }
    h += '</div></section>';
  }
  h += '<button class="btn ghost" data-close-sheet>返回对话</button>';
  $("sheet-body").innerHTML = h;
  $("sheet").classList.add("open");
}

function openTaskSheet(d){
  // 同样先收侧栏，避免手机上事项详情被压在侧栏后面。
  $("side").classList.remove("open");
  const m = {
    task_id: d.task.task_id, utterance: d.task.utterance, stage: d.task.stage,
    outcome: d.task.outcome, subject_name: d.subject ? d.subject.name : "",
    budget_max: d.extracted.budget_max,
    orders: d.orders,
    latest_proposal: d.proposals.length ? d.proposals[d.proposals.length - 1] : null,
  };
  $("sheet-body").innerHTML = '<h2 id="sheet-title">事项</h2>'
    + matterCard(m, d, {inSheet: true})
    + '<button class="btn ghost" data-close-sheet style="margin-top:12px">返回对话</button>';
  $("sheet").classList.add("open");
}

// 这里必须声明成 async：本人表态分支里有 await post(...) 去服务端记录。
// 之前漏了 async，整个页面的脚本都解析不了，手机上点任何按钮都没反应。
$("sheet").addEventListener("click", async (e) => {
  if(e.target.id === "sheet" || e.target.closest("[data-close-sheet]")){
    // 裁剪界面开着时，点「取消」按钮要回到草稿，不是关掉整个弹层。
    // 那件事交给下面 cropState 分支做（作废这一轮 + 重画草稿）——
    // 这里若抢先 invalidatePhoto() 把 cropState 清成 null，那个分支的
    // 条件就再也不成立：用户点「取消」看到的是一整个弹层关掉、草稿界面
    // 没了，而他只是不想认这一次裁剪，字和图都还在呢。
    if(e.target.id !== "sheet" && cropState && noteCtx){
      return;
    }
    // 点遮罩关掉时同样要作废这一轮：漏掉这条，迟到的旧编码照样会送出识别，
    // 弹层还会重新打开一份他刚关掉的草稿。
    if(cropState) invalidatePhoto();
    $("sheet").classList.remove("open");
    personStack = [];
    return;
  }
  // 商品详情里的「换成这件」。这个按钮渲染在弹层里，
  // 之前 choose 只挂在消息流的监听器上，弹层里的点击冒泡不到那里，
  // 于是按钮看得见、点了没反应。这里补上同一个动作。
  const chooseBtn = e.target.closest('[data-act="choose"]');
  if(chooseBtn){
    const btn = chooseBtn;
    btn.disabled = true;
    btn.textContent = "正在换…";
    try{
      const res = await post("/api/task/choose-candidate", {
        task_id: btn.dataset.task,
        product_id: btn.dataset.product,
      });
      $("sheet").classList.remove("open");
      await renderStream();
      await renderSide();
      // 同上：下一步说什么，以服务端返回的为准。
      setStatus(res.next_hint || "已换成这件");
    }catch(err){
      btn.disabled = false;
      btn.textContent = "换成这件";
      const box = document.getElementById("product-sheet-msg");
      if(box){ box.textContent = "没能换成这件：" + (err.message || "请稍后再试");
        box.style.display = "block"; }
      setStatus("没能换成这件：" + err.message);
    }
    return;
  }
  // 关系链往回走一层：栈里最后一个就是刚点开的这个人，回到它前面那个。
  if(e.target.closest("[data-person-back]")){
    if(personStack.length > 1){
      personStack.pop();
      openPerson(personStack[personStack.length - 1], true);
    }
    return;
  }
  // 人物详情里的关系人要能继续点开：从谁的关系链点进去，就看那个人的详情。
  // 之前这里只处理关闭，关系 chip 是死的，用户点了没反应。
  const personBtn = e.target.closest("[data-person]");
  if(personBtn){
    openPerson(personBtn.dataset.person, true);
    return;
  }
  // 协商详情弹层里是同一张事项卡，卡片动作要真的能跑：
  // 确认购买、换商品、推进订单、重试都在这里接着。
  const cardBtn = e.target.closest("button[data-act]");
  if(cardBtn){
    runCardAction(cardBtn.dataset.act, cardBtn, cardBtn.dataset.task);
    return;
  }
  // 排第一版：失败时保留事项、按钮回到可点，不落任何版本。
  const proposeBtn = e.target.closest("[data-plan-propose]");
  if(proposeBtn){
    const btn = proposeBtn;
    btn.disabled = true;
    btn.textContent = "正在排第一版…";
    try{
      await post("/api/plan/" + btn.dataset.planPropose + "/propose", {});
      await openPlan(btn.dataset.planPropose);
    }catch(err){
      btn.disabled = false;
      btn.textContent = "按当前条件排第一版";
      const box = $("sheet-body").querySelector(".notice");
      if(box) box.textContent = "没能排出这一版：" + (err.message || "请稍后再试")
        + "。事项还在，可以改完条件再排。";
    }
    return;
  }

  // 共同事项里以本人身份表态。身份由当前演示身份决定，
  // 服务端还要再核对这一方确实属于这个身份，别家代点会被拒。
  const decideBtn = e.target.closest("[data-plan-decide]");
  if(decideBtn){
    const btn = decideBtn;
    btn.disabled = true;
    btn.textContent = "正在记录…";
    try{
      await post("/api/plan/" + btn.dataset.planDecide + "/decide", {
        participant_id: btn.dataset.participant,
        version: parseInt(btn.dataset.version, 10),
        decision: btn.dataset.decision,
        reason: "本人在手机端确认",
      });
      await openPlan(btn.dataset.planDecide);
    }catch(err){
      btn.disabled = false;
      btn.textContent = err && err.status === 409 ? "没能记录，稍后再试" : "接受这一版";
      const box = $("sheet-body").querySelector(".notice");
      if(box) box.textContent = "没能记录这次确认：" + (err.message || "请稍后再试");
    }
    return;
  }
});

/* ---------- 共同事项：发起、改自己的条件、重排 ---------- */
const PLAN_LABELS = {A: "我家", B: "小周家", C: "小林家"};
// 出资口径分成两个键：「活动总预算」是整场一共多少，「本人出资上限」是
// 这一家自己最多出多少。旧键「预算」服务端会归一成「活动总预算」，
// 新输入一律用这两个，不写一个说不清是谁的预算。
const PLAN_KEYS = ["时间", "地点", "活动总预算", "本人出资上限", "活动内容",
                   "孩子安排", "交通", "备注"];
// 全局身份就是「谁本人在用」：A 是我，B 是小周，C 是小林。
// 送礼者、家长这类只是具体事项里的角色，不是永久身份——
// 写成永久身份会让整个作品看起来像送礼工具。
const OWNER_TEXT = {A: "我", B: "小周", C: "小林"};
const OWNER_ROLE_NOTE = {
  A: "送礼这件事里，我是送礼者",
  B: "送礼这件事里，我是孩子家长",
  C: "小周的配偶，用自己家庭的人参与共同事项",
};

// 发起一个共同事项：标题加上各家自己给的条件。
// 每家的条件只由这一家填，这里不替别家预设，也不把别家的条件复制过来。
$("btn-new-plan").addEventListener("click", () => {
  // 只渲染**本人这一方**的条件表单。原来三家各一份，提交时把三份一起发给
  // /api/plan/create，服务端按「只能填自己一方」逐个 403——界面让填、
  // 服务端不让填，用户看到的是「我按你说的做了却被拒」。
  // 别家在这里只是待回应占位：谁参加由那一方自己从自己的会话确认。
  const conds = PLAN_KEYS.map((k) =>
    '<label class="cond-row"><span>' + esc(k) + '</span>'
    + '<input type="text" data-cond-owner="' + esc(ownerId) + '"'
    + ' data-cond-key="' + esc(k) + '" placeholder="可留空"></label>').join("");
  const others = ["A", "B", "C"].filter((o) => o !== ownerId).map((o) =>
    '<div class="item"><span class="k">' + esc(PLAN_LABELS[o]) + '</span>'
    + '<span class="v">待这一方从自己的会话补条件、确认参与</span></div>').join("");
  $("sheet-body").innerHTML = '<h2 id="sheet-title">发起共同事项</h2>'
    + '<div class="sub">几个家庭要一起定一件事。你先把**你自己这一方**的条件写上；'
    + '别家的条件由别家自己补，这里只留占位，不代填。</div>'
    + '<label class="cond-row"><span>事项标题</span>'
    + '<input type="text" id="new-plan-title" value="两个家庭周末一起带孩子去公园"></label>'
    + '<section><h4>' + esc(PLAN_LABELS[ownerId]) + '（' + esc(OWNER_TEXT[ownerId])
    + '）自己的条件</h4><div class="kv">' + conds + '</div>'
    + '<div class="sub" style="margin-top:6px">'
    + '「活动总预算」是整场一共多少，「本人出资上限」是你家最多出多少，'
    + '两个不是一回事。说不清是哪个，服务端会请你确认，不替你默认。</div></section>'
    + (others ? '<section><h4>其他方</h4><div class="kv">' + others + '</div></section>' : '')
    + '<button class="btn primary" id="btn-create-plan" style="margin-top:14px">创建并生成第一版方案</button>'
    + '<div class="notice" style="margin-top:10px">第一版方案由模型按各家当前条件排出，'
    + '可能需要十几秒。生成前不落任何版本。别家还没给条件也能先排，'
    + '缺的会作为缺口留在方案里。</div>'
    + '<button class="btn ghost" data-close-sheet style="margin-top:12px">取消</button>';
  $("sheet").classList.add("open");
  $("btn-create-plan").addEventListener("click", async () => {
    const btn = $("btn-create-plan");
    btn.disabled = true;
    btn.textContent = "正在生成第一版…";
    try{
      const title = $("new-plan-title").value.trim() || "几个家庭的共同事项";
      const byOwner = {};
      $("sheet-body").querySelectorAll("[data-cond-owner]").forEach((el) => {
        const v = el.value.trim();
        if(!v) return;
        const o = el.dataset.condOwner;
        byOwner[o] = byOwner[o] || {};
        byOwner[o][el.dataset.condKey] = v;
      });
      // 本人这一方一个条件都没填：不创建。空参与方的事项落库后，
      // 服务端不给它排方案，侧栏却一直挂着它，点下去只会 404——
      // 那就是用户报的「侧栏有个点不开的事项」。从根上不造孤儿。
      if(!byOwner[ownerId] || !Object.keys(byOwner[ownerId]).length){
        $("sheet-body").querySelector(".notice").textContent =
          "先填至少一条本人这一方的条件（比如时间或地点），再创建。"
          + "没有条件的事项建了也排不出方案。";
        return;
      }
      // 只提交本人这一方。别家带条件会被服务端 403，这里索性不给他们造表单。
      const created = await post("/api/plan/create", {
        title: title, utterance: title,
        participants: [ownerId].filter((o) => byOwner[o]).map((o) => ({
          owner_id: o, label: PLAN_LABELS[o],
          conditions: byOwner[o], required: true,
        })),
      });
      // 复用时不再生成第一版：这件已经有各家在等的方案，
      // 再排一版会让旧接受全部失效，用户会莫名其妙丢了进度。
      if(!created.reused){
        await post("/api/plan/" + created.plan_id + "/propose", {});
      }
      await openPlan(created.plan_id);
      renderSidePlans();
    }catch(err){
      btn.disabled = false;
      btn.textContent = "创建并生成第一版方案";
      $("sheet-body").querySelector(".notice").textContent =
        "没能创建：" + (err.message || "请稍后再试");
    }
  });
});

// 改自己这一方的条件。只改本人这一家，改完事项进入待重排，
// 各家对旧版本的接受随之失效，要重新表态。

    + esc(current[k] || "") + '" placeholder="可留空"></label>').join("");
  $("sheet-body").innerHTML = '<h2 id="sheet-title">改' + esc(PLAN_LABELS[owner])
    + '的条件</h2><div class="sub">只改这一家的条件。'
    + '改完不等于接受当前方案，各家要按新条件重新表态。</div>'
    + '<div class="kv">' + rows + '</div>'
    + '<button class="btn primary" data-plan-condition-save="' + esc(planId)
    + '" data-plan-owner="' + esc(owner) + '" style="margin-top:14px">保存条件</button>'
    + '<button class="btn ghost" data-plan-reopen="' + esc(planId)
    + '" style="margin-top:12px">返回事项</button>';
});

// 保存条件：写这一家的新条件，然后回到事项详情看重排入口。
$("sheet").addEventListener("click", async (e) => {
  const saveBtn = e.target.closest("[data-plan-condition-save]");
  if(!saveBtn) return;
  const planId = saveBtn.dataset.planConditionSave;
  const owner = saveBtn.dataset.planOwner;
  saveBtn.disabled = true;
  saveBtn.textContent = "正在保存…";
  try{
    const conds = {};
    $("sheet-body").querySelectorAll("[data-edit-key]").forEach((el) => {
      const v = el.value.trim();
      if(v) conds[el.dataset.editKey] = v;
    });
    await post("/api/plan/" + planId + "/condition", {
      owner_id: owner, conditions: conds, reason: "本人在手机端改条件",
    });
    await openPlan(planId);
    renderSidePlans();
  }catch(err){
    saveBtn.disabled = false;
    saveBtn.textContent = "保存条件";
    $("sheet-body").querySelector(".sub").textContent =
      "没能保存：" + (err.message || "请稍后再试");
  }
});

$("sheet").addEventListener("click", async (e) => {

// 从条件编辑页返回事项详情。
$("sheet").addEventListener("click", (e) => {
