/* ---------- 拍一张记录：相机 → Step 识别 → 本人核对 → 记入 ----------

   这条链刻意分成两步：先只识别并摊开给本人看，本人勾选认可的字段后才落库。
   不让「拍一下」直接变成一条事实——模型看不清时会把猜测写得像真的，
   而记录要长期被别处复用，一次误记会一直错下去。

   拍照者、记忆所有者、记录主体分开传：家长拍的孩子记录和妈妈自己报的进度
   来源不同，提供者字段里写清是谁拍的，不能混成本人自述。
*/
// photoCtx 已随记事本式录入一起退役：草稿统一走 noteCtx（见 noteDraft）。
// 留着这个空对象只会让人以为还有一条并存的旧链路。

function photoSubjects(){
  // 主体只能从当前身份认识的人里选：不能让他把记录写到别人名下的人头上。
  // 当前身份确实一个人都没有时返回空，由界面明说，不偷偷退回别人的名单。
  return (lastPersons || []).filter((p) => p.owner_id === ownerId && p.name !== "我");
}

// 小应用是另一个页面，但共用同一份记录和同一个服务端会话：
// 在那边录入的近况，这边按人回忆时照样读得到。所以这里直接跳转，
// 不再做一份入口说明——跳过去看到的就是同一批数据。
$("btn-open-apps").addEventListener("click", () => {
  location.href = "/apps";
});

$("btn-photo").addEventListener("click", () => {
  openNoteSheet();
});

/* ---------- 资料库：一份草稿，文字 / 图片都能进 ----------

   原来打开就是「拍一张记录」：先选人、再选拍不拍，用户想打一行字
   没有入口。用户要的是记事本那种——打开就能写，图是旁边的选项。

   所以这里把入口换成「资料库 / 添加资料」：
   1. 打开是一份可编辑草稿，正文框直接可写，不先逼人选人或选模式；
   2. 图片是草稿旁边的动作，同一条草稿里可以既有文字又有图；
   3. 图片给两条路——读出文字、或只作配图；识别结果照样可改；
   4. 主体、日期都在草稿里改，有内容之后再补也不迟。

   语音先说实话：当前模型接口没有可用的中文转写（见 /api/voice/transcribe
   的实测记录）。所以语音按钮点下去只说明现状、给出能用的替代，
   不假装转写，也不把一段录音说成已转写的文字。 */
function noteDraft(){
  return {
    // 正文。可能来自本人打字、语音转写、或图片识别，三者的来源分开记，
    // 回看时能分清哪句是本人写的、哪句是模型读的。
    text: "",
    fields: [],
    attachments: [],
    subjectId: "",
    day: "",
    // 这条草稿实际用了哪些输入方式，保存时随来源一起写清。
    kinds: [],
    // 最近一次成功识别的结果。没有识别过就是 null，不是空对象——
    // 空对象会被当成「识别过但没有内容」，两者不是一回事。
    read: null,
    // 每张图的识别状态，按加图顺序排，和 attachments 的下标对得上，
    // 回看时能说清第几张图读出了什么、哪一张失败了。
    // 一条：{b64, origB64, ok, text, confidence, happened_on,
    //        unclear_parts, error, appended, imageOnly}
    // b64 是送识别时压缩后的那份（保存用它），origB64 是用户选的原文件
    // （attachments 里存的那份）——两者不同，比内容去重时必须用 origB64，
    // 拿压缩后的去比会永远不相等，同一张图在草稿里躺两份。
    // appended 记这次识别插进正文的那段原文，「重新识别」时先原样撤掉。
    reads: [],
    // 正在识别中：为真时三个次要选项全部禁用，状态写「正在识别这张图…」，
    // 防止同一张图被连点送出去好几次。
    ocrBusy: false,
    // 「更多」默认收起：图片操作一组就够，不把六个按钮平铺给用户。
    showImageMore: false,
    b64: "", media: "", cropped: false, imageOnly: false,
  };
}

let noteCtx = null;

function noteKindsLabel(){
  if(!noteCtx || !noteCtx.kinds.length) return "";
  const label = {text: "文字", image: "图片", voice: "语音"};
  return noteCtx.kinds.map((k) => label[k] || k).join(" + ");
}

function noteAddKind(k){
  if(!noteCtx) return;
  if(noteCtx.kinds.indexOf(k) < 0) noteCtx.kinds.push(k);
}

function openNoteSheet(){
  noteCtx = noteDraft();
  renderNoteSheet();
}

function renderNoteSheet(){
  const d = noteCtx;
  if(!d) return;
  let h = '<h2 id="sheet-title">新建资料</h2>'
     + '<div class="sub">打字、贴图都行。先用「图片识别」或「语音输入」选一种方式；'
     + '选了图片并选定本地文件后，再决定是识别图里的文字还是只把图存进资料库。</div>';

  // 正文：打开就能写，不先逼人选人或选模式。
  h += '<section><h4>记什么</h4>'
     + '<textarea id="note-text" rows="4" style="width:100%;box-sizing:border-box;'
     + 'font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;'
     + 'background:var(--surface)" placeholder="例如：小雨今天自己拼图拼了挺久">'
     + esc(d.text) + '</textarea>'
     // 识别提示行：就在正文下面一行小字。只说他需要知道的两件事——
     // 识别把握多少、失败时为什么不成功。不在这里放可编辑的识别结果：
     // 文字已经进上面的正文框了，本人在那里直接改，再开一个框
     // 等于让他把同一段字改两遍。
     + '<div id="note-read-hint" class="sub" style="margin-top:4px"></div>'
     + '<div class="sub" style="margin-top:4px">直接打字就行。'
     + '走「图片识别」选定本地文件后，图先只留在本机草稿里；'
     + '要识别图里的文字（会送去做识别）还是只把图存进资料库，由你在这之后选；'
     + '只想认中间一块就用「先裁剪再识别」，范围外的画面不会送出去。</div></section>';

  // 图片与语音：两个一级选项，不再把四种用法平铺成四个按钮。
  // 选定本地文件之后才问「识别还是只存」——那时人已经看见图了，
  // 选择有依据；而且图在本人确认之前一次都不离开设备。
  h += '<section><h4>输入方式</h4>'
     + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
     + '<button class="btn ghost" id="note-add-photo"'
     + ' title="选一张本地图片，再决定识别图里的文字还是只存进资料库">图片识别</button>'
     // 语音用的是浏览器自带的语音识别，不经过我们的服务端、不落我们这边。
     // 不支持或不让用麦克风的浏览器，点下去会如实说明，不冒充成功。
     + '<button class="btn ghost" id="note-add-voice" '
     + 'title="用浏览器自带的语音识别，说完的话直接进正文，可以再改">语音输入</button></div>'
     // 第二步：图已进草稿、尚未送出时的明确选择（notePickMode === "ask"）。
     + '<div id="note-pick-choice" style="margin-top:10px"></div>'
     // 弹层内可见反馈。#status-line 在主页顶部，被 .sheet（fixed/inset:0/z-index:60）
     // 整个盖住，写在它里面用户在弹层里什么也看不到——这就是「只作配图没反应」
     // 的直接原因。图片/语音的每一步状态都写在这里。
     + '<div id="note-sheet-hint" class="sub" role="status" aria-live="polite" '
     + 'style="margin-top:8px;min-height:20px"></div>'
     + '<div id="note-attachments" style="display:flex;gap:8px;flex-wrap:wrap;'
     + 'margin-top:10px"></div>'
     + '<div id="note-image-acts" style="margin-top:10px"></div>'
     + '<input type="file" id="note-photo-input" accept="image/*" style="display:none">'
     + '<input type="file" id="note-attach-input" accept="image/*" style="display:none">'
     + '</section>';

  // 识别出来的内容直接进正文框（见 noteAppendText），这里不再单独开区块：
  // 同一个内容在两处都能改，用户不知道该改哪一个，改完还可能只存了一份。

  // 主体与日期：有内容之后再补也来得及，不做成进来的第一道门。
  h += '<section><h4>记在谁名下</h4><div id="note-subjects"'
     + ' style="display:flex;gap:8px;flex-wrap:wrap"></div>'
     + '<div class="sub" style="margin-top:6px">'
     + '忘了选也能先写，保存前在这里补上。</div></section>';

  h += '<section><h4>发生日期</h4>'
     + '<input type="date" id="note-day" value="' + esc(d.day) + '"'
     + ' style="width:100%;box-sizing:border-box;font:inherit;padding:8px;'
     + 'border:1px solid var(--line);border-radius:8px;background:var(--surface">'
     + '<div class="sub" style="margin-top:4px">'
     + '留空表示发生日期未知，不会算成今天发生。</div></section>';

  h += '<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">'
     + '<button class="btn primary" id="note-save">保存资料</button>'
     + '<button class="btn ghost" data-close-sheet>再想想</button></div>';

  $("sheet-body").innerHTML = h;
  $("sheet").classList.add("open");
  renderNoteAttachments();
  renderNoteSubjects();
  renderNoteImageActs();
  renderNotePickChoice();
  bindNoteVoice();
  noteSheetHint("");
}

function renderNoteAttachments(){
  const box = $("note-attachments");
  if(!box || !noteCtx) return;
  const items = noteCtx.attachments;
  if(!items.length){
    box.innerHTML = '<div class="sub" style="margin:0">还没有图片。</div>';
    return;
  }
  box.innerHTML = items.map((a, i) =>
    '<div style="position:relative;width:72px">'
    + '<img src="data:' + esc(a.media) + ';base64,' + esc(a.b64) + '"'
    + ' style="width:72px;height:72px;object-fit:cover;border-radius:8px;'
    + 'border:1px solid var(--line);display:block">'
    + '<button data-n-del="' + i + '" class="btn ghost"'
    + ' style="width:100%;margin-top:4px;padding:4px 0;font-size:12px">移除</button>'
    + '</div>').join("");
}

function renderNoteSubjects(){
  const box = $("note-subjects");
  if(!box || !noteCtx) return;
  const subs = photoSubjects();
  const cur = noteCtx.subjectId;
  if(!subs.length){
    box.innerHTML = '<div class="sub" style="margin:0">'
       + '人物名单还没取到，保存前在这里选一个。</div>';
    return;
  }
  box.innerHTML = subs.map((p) =>
    '<button type="button" class="chip btn-chip" data-n-subject="'
    + esc(p.person_id) + '" aria-pressed="' + (p.person_id === cur) + '"'
    + (p.person_id === cur ? ' data-cur="1"' : '')
    + ' style="' + (p.person_id === cur
       ? 'border-color:var(--accent);color:var(--accent);background:var(--accent-soft)'
       : '') + '">' + esc(p.name)
    + (p.relation ? " · " + esc(relationText(p.relation)) : "")
    + '</button>').join("");
}

/* 图进草稿之后的次要选项。

   一级选项只有「图片识别 / 语音输入」；选定文件后图先进草稿，本区这三个
   都不再是必经步骤，降成小号按钮，但仍然都可达：
   - 重新识别：再认一次当前这张图。先把上次插进正文的那段原样撤掉，
     不会在正文里留两遍；
   - 先选范围再识别：图上只有中间一块是要记的、边上拍到的是客厅和家人时，
     用户自己决定哪些内容离开手机。这条是隐私路径，不能因为简化就拿掉；
   - 撤掉识别文字，只留图：那张图可能根本没有文字（奖状、手工作品），
     把识别插进去的那段撤掉，图照旧存。已经送出去那一次不会撤回。

   识别期间三个全部禁用：同一张图被连点会送出去好几次，白花时间，
   回来还要抢着往正文里插字。 */
/* 图片相关操作只有这一处：按使用时机分两组，不再和选图后的三选一重复。
   第一组（当下要拿这张图做什么）在图刚进草稿时由 #note-pick-choice 出；
   本区是「图已经在草稿里之后」的收尾组：
     - 重新识别：再认一次当前这张图（先把上次插进正文的那段原样撤掉）；
     - 先选范围再识别：图上只有中间一块是要记的，边上拍到的是客厅和家人；
     - 撤掉识别文字，只留图：这段字不要了，但图还在。
   次要两个（重新识别、撤掉识别文字）默认收在「更多」里，点开不影响第一组；
   多张图时每段的来源在 #note-read-hint 里逐张列，不会混成一段。 */
function renderNoteImageActs(){
  const box = $("note-image-acts");
  if(!box) return;
  if(!noteCtx || !noteCtx.b64){ box.innerHTML = ""; renderNoteReadHint(); return; }
  const busy = !!noteCtx.ocrBusy;
  const dis = busy ? " disabled" : "";
  const small = 'padding:5px 10px;font-size:12.5px';
  const more = noteCtx.showImageMore ? "" : " hidden";
  let h = '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
     + '<button class="btn ghost" id="note-crop-first"' + dis + ' style="' + small + '">'
     + '先选范围再识别</button>'
     + '<button class="btn ghost" id="note-more-acts"' + dis + ' style="' + small + '" '
     + 'aria-expanded="' + (noteCtx.showImageMore ? "true" : "false") + '" '
     + 'aria-controls="note-more-acts-box">'
     + (noteCtx.showImageMore ? "收起" : "更多") + '</button></div>'
     + '<div id="note-more-acts-box"' + more + ' style="margin-top:8px;'
     + 'display:flex;gap:8px;flex-wrap:wrap">'
     + '<button class="btn ghost" id="note-ocr"' + dis + ' style="' + small + '">'
     + (busy ? "正在识别这张图…" : "重新识别") + '</button>'
     + '<button class="btn ghost" id="note-keep-image"' + dis + ' style="' + small + '">'
     + '撤掉识别文字，只留图</button></div>'
     + '<div class="sub" style="margin-top:6px">'
     + '只想认中间一块、或边上拍到了不想外传的内容，用「先选范围再识别」——'
     + '只有框里的那份会送出去。「撤掉识别文字，只留图」：图本身还在，'
     + '但已经送出去识别的那一次不会撤回。</div>';
  box.innerHTML = h;
  renderNoteReadHint();
}

/* 识别提示行：就在正文框下面一行小字，见 renderNoteSheet 里的注释。
   逐张图列清楚，多张图时用户知道哪段字来自哪一张。 */
function renderNoteReadHint(){
  const box = $("note-read-hint");
  if(!box) return;
  if(!noteCtx){ box.textContent = ""; return; }
  const parts = [];
  if(noteCtx.ocrBusy) parts.push("正在识别这张图…");
  noteCtx.reads.forEach((r, i) => {
    const nth = "第" + (i + 1) + "张图";
    if(r.ok && r.text){
      parts.push(nth + "识别把握：" + (r.confidence || "未给")
                 + "，文字已进上面的正文框，可以直接改");
    }else if(!r.ok){
      parts.push(nth + "没识别出来：" + (r.error || "原因没给")
                 + "。图已作为配图留下，正文不受影响");
    }
  });
  box.textContent = parts.join("；");
}

/* 图片进草稿：先解码，再直接进草稿出缩略图，不跳裁剪。
   裁剪只在本人点「先选范围再识别」时才走——见 noteCropFirst。 */
/* 读一张 base64 图的真实宽高。裁剪状态要按图的实际尺寸算比例，
   拿不到尺寸就只能拿一个猜的矩形去框，用户看到的选择区会和图对不上。 */
function imageDim(b64, media){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({w: img.naturalWidth, h: img.naturalHeight});
    // 解码失败必须 resolve(null)，不能什么都不做：那样这个 Promise 永远
    // pending，调用方的 await 挂住，按钮停在「正在识别…」再也回不来。
    img.onerror = () => resolve(null);
    img.src = "data:" + (media || "image/jpeg") + ";base64," + b64;
  });
}

/* 这次选图要走哪条路。
   ask：选定文件后先问「识别还是只存」（默认；图片在本人确认前不出设备）；
   attach：只作配图，一次模型都不调；
   crop：先框范围，只把框里的内容送去做识别。
   变量在每次选图前重置，不会把上一次的选择留到下一张图。 */
let notePickMode = "ask";

/* 弹层内可见反馈。#status-line 在主页顶部，被全屏 .sheet（fixed/inset:0/z-index:60）
   盖住，只写那里用户在弹层里看不到任何回应——「只作配图没反应」就是这么来的。
   图片/语音每一步状态都写进弹层内的 #note-sheet-hint。 */
function noteSheetHint(text){
  const box = $("note-sheet-hint");
  if(box) box.textContent = text || "";
}

async function notePickImage(inputId){
  const inp = $(inputId);
  if(!inp || !inp.files || !inp.files[0]) return;
  const mode = notePickMode;
  notePickMode = "ask";
  const f = inp.files[0];
  noteSheetHint("正在读这张图…");
  setStatus("正在读这张图…");
  try{
    const src = await fileToB64(f);
    noteAddKind("image");
    noteCtx.b64 = src.b64;
    noteCtx.media = src.media;
    noteCtx.imageOnly = false;
    noteCtx.read = null;
    // 只作配图：图进草稿，不识别、不送模型。用户明确说了不要文字，
    // 就没有任何理由把这张图送出去。
    if(mode === "attach"){
      noteCtx.attachments.push({b64: src.b64, media: src.media});
      renderNoteAttachments();
      renderNoteImageActs();
      noteSheetHint("已只把这张图存进资料库，没有识别图里的字；图没有送出去。");
      setStatus("这张图只作为配图保存，没有识别图里的字");
      return;
    }
    // 先裁剪再识别：整张图一次都不送，直接进裁剪。裁剪完只把框里的
    // 那份编码送去做识别（见裁剪收尾处的 noteRunOcr 调用）。
    if(mode === "crop"){
      // 图照样进草稿（缩略图要能看见、保存要能带上），但不识别。
      // 识别推到裁剪之后，并且只送框里那一份——整张图一次都没送出去。
      noteCtx.attachments.push({b64: src.b64, media: src.media});
      renderNoteAttachments();
      renderNoteImageActs();
      noteCropFirst();
      return;
    }
    // 加图就是加图：图直接进草稿、立刻看得见缩略图，不跳裁剪。
    // 原来这里直接 renderPhotoCrop，整块弹层被裁剪界面替掉——
    // 草稿上打的字、选的人、语音按钮全部消失，用户被留在一个
    // 他并没有要求进的界面里。裁剪改成「要识别时」那一步才走。
    noteCtx.attachments.push({b64: src.b64, media: src.media});
    renderNoteAttachments();
    renderNoteImageActs();
    // ask（默认）：图进草稿、缩略图立即可见，但先不送模型——在弹层内给出
    // 明确二选一，本人点了「识别」或「先裁剪再识别」之后图才离开设备；
    // 选「只存」则一次都不送。b64/media 在 noteResolvePick 里传死，识别函数
    // 不自己读 noteCtx.b64：连续加两张图时 noteCtx.b64 已是后一张，读它会认错图。
    renderNotePickChoice();
    noteSheetHint("图已进草稿，还没有送出去。要识别图里的文字，还是只把图存进资料库？");
    return;
  }catch(err){
    noteSheetHint("没读出这张图：" + err.message);
    setStatus("没读出这张图：" + err.message);
  }finally{
    inp.value = "";
  }
}

/* 第二步选择：图已在草稿里、尚未送出。三个选项对应三条互斥路径——
   识别进正文（送模型）、只存不识别（一次都不送）、先裁剪再识别（只送框里那份）。
   选完这一步，图才可能离开设备。 */
let notePickResolved = false;

function renderNotePickChoice(){
  const box = $("note-pick-choice");
  if(!box) return;
  if(!noteCtx || !noteCtx.b64 || notePickResolved){ box.innerHTML = ""; return; }
  const small = 'padding:5px 10px;font-size:12.5px';
  box.innerHTML = '<div class="sub" style="margin-bottom:6px">这张图要拿来做什么？'
     + '选「只把图存进资料库」的话，它一次都不会送出去。选完还能在下面改。</div>'
     + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
     + '<button class="btn primary" id="note-choice-ocr" style="' + small + '">'
     + '识别图里的文字，进正文框</button>'
     + '<button class="btn ghost" id="note-choice-keep" style="' + small + '">'
     + '只把图存进资料库，不识别</button>'
     + '<button class="btn ghost" id="note-choice-crop" style="' + small + '">'
     + '先裁剪再识别</button></div>';
}

/* 这一步选过了就收起：同一张图不需要再问第二遍。 */
async function noteResolvePick(kind){
  if(!noteCtx || !noteCtx.b64) return;
  notePickResolved = true;
  const box = $("note-pick-choice");
  if(box) box.innerHTML = "";
  if(kind === "keep"){
    noteSheetHint("已只把这张图存进资料库，没有识别图里的字；图没有送出去。");
    setStatus("这张图只作为配图保存，没有识别图里的字");
    renderNoteImageActs();
    return;
  }
  if(kind === "crop"){
    noteCropFirst();
    return;
  }
  // 识别：b64/media 由这里传死，识别函数不自己读 noteCtx.b64——连续加两张图时
  // noteCtx.b64 已经是后一张，读它会认错图。
  noteSheetHint("正在识别这张图…");
  renderNoteImageActs();
  await noteQueueOcr(noteCtx.b64, noteCtx.media);
}

/* 识别排队：一张一张来，不并发。

   并发的两个后果都不好：两张图的文字按网络返回顺序插进正文，先后会变，
   和用户加图的顺序对不上；两个请求还会互相写 noteCtx.b64，后加的那张
   可能被识别成前一张。排队之后按加图顺序依次进正文。 */
let noteOcrChain = Promise.resolve();

function noteQueueOcr(b64, media){
  noteOcrChain = noteOcrChain.then(() => noteRunOcr(b64, media, false))
                                .catch(() => {});
  return noteOcrChain;
}

/* 找某张图对应的识别状态。按压缩后的 b64 找——识别送出去的是压缩那份，
   条目里记的也是它。 */
function noteFindRead(b64){
  if(!noteCtx) return null;
  return noteCtx.reads.find((r) => r.b64 === b64) || null;
}

/* 把一段字并进正文框末尾：已打的内容留在前面，中间加一个换行分隔。
   返回真正插进去的那段（不含分隔换行），「重新识别」时按它原样撤。
   识别结果本来就是草稿，本人直接在这个框里改，所以不另开编辑区。 */
function noteAppendText(t){
  const box = $("note-text");
  if(!box || !noteCtx) return "";
  const cur = box.value || "";
  box.value = cur ? (cur + "\n" + t) : t;
  noteCtx.text = box.value;
  noteAddKind("text");
  return t;
}

/* 把上一次识别插进正文的那段字原样撤掉。

   不撤的话，点「重新识别」会把同一张图的文字在正文里留两遍，
   而用户已经说不出哪一段是哪一次识别的了。

   只认「完整一行还是那段原文」的情况。按子串找会把用户改过的那句
   劈成两半：他把「…四十分钟」改成「…四十分钟，练完自己收了琴」之后，
   子串匹配仍然命中前半段，撤完剩下一句没有主语的残句，
   比重留一遍更难收拾。所以改过就不动他的，只把新结果追加进去。 */
function noteRemoveAppended(entry){
  if(!entry || !entry.appended) return;
  const box = $("note-text");
  const gone = entry.appended;
  entry.appended = "";
  if(!box || !noteCtx) return;
  const lines = (box.value || "").split("\n");
  const at = lines.findIndex((l) => l.trim() === gone.trim());
  if(at < 0) return;
  lines.splice(at, 1);
  box.value = lines.join("\n");
  noteCtx.text = box.value;
}

/* 送一次识别，把结果并进正文框末尾。加图后自动走这条，
   「重新识别」「先选范围再识别」也走这条。

   b64/media 由调用方给死：多张图连续加时 noteCtx.b64 已经是后一张，
   识别函数自己去读它会认错图。
   reuseEntry 给「先选范围再识别」用：裁剪出来的是同一张图的另一份编码，
   必须接着原来那条识别状态写，不能新开一条——新开一条的话，
   noteRemoveAppended 撤不掉自动识别插进去的那段，正文里就留两遍。

   三条硬约束：
   1. 失败不卡死。图仍然作为配图留在草稿里，提示行说明原因，
      按钮回到「重新识别」，用户已打的正文一个字不丢，草稿照样能保存；
   2. 防重复点击。识别期间 ocrBusy 为真，三个次要选项全部禁用；
   3. 重新识别不重复插字。先把上次插进正文的那段原样撤掉再插新的。

   复用现成的 /api/photo/read 与 wholeImageB64，不新建模块、不改服务端接口。 */
async function noteRunOcr(b64, media, cropped, reuseEntry){
  if(!noteCtx) return;
  let entry = reuseEntry || noteFindRead(b64);
  if(!entry){
    entry = {b64: b64, origB64: b64, ok: false, text: "", confidence: "",
             happened_on: "", unclear_parts: [], error: "", appended: "",
             imageOnly: false};
    noteCtx.reads.push(entry);
  }
  // 本人点了「只作配图」：这一张不要文字。还在排队没跑的识别直接作废，
  // 否则用户刚撤掉那段字，排队的识别又给它插回来。
  if(entry.imageOnly) return;
  noteCtx.ocrBusy = true;
  renderNoteImageActs();
  noteSheetHint("正在识别这张图…");
  setStatus("正在识别这张图…");
  let picked;
  try{
    picked = await wholeImageB64(b64, media);
  }catch(err){
    entry.error = err.message || "这张图转不成能识别的格式";
    noteCtx.ocrBusy = false;
    renderNoteImageActs();
    noteSheetHint("识别失败：" + entry.error
              + "。图已作为配图留下，可以点「重新识别」再试，正文不受影响");
    setStatus("这张图没能识别：" + entry.error
              + "。图已作为配图留下，可以点「重新识别」再试，正文不受影响");
    return;
  }
  if(!noteCtx) return;
  // 压缩后的图作为这条草稿的主图送保存，和原来 note-ocr 的行为一致。
  noteCtx.b64 = picked.b64;
  noteCtx.media = picked.media;
  noteCtx.cropped = !!cropped;
  noteCtx.imageOnly = false;
  // 条目改按压缩后的 b64 记：下次「重新识别」要能找回到这一条。
  // origB64 不动，去重时还要靠它比 attachments 里那份原始图。
  entry.b64 = picked.b64;
  let read;
  try{
    read = await post("/api/photo/read",
      {image_b64: picked.b64, media_type: picked.media});
  }catch(err){
    entry.error = err.message || "识别没返回结果";
    noteCtx.ocrBusy = false;
    renderNoteImageActs();
    noteSheetHint("识别失败：" + entry.error
              + "。图已作为配图留下，可以点「重新识别」再试，正文不受影响");
    setStatus("这张图没能识别：" + entry.error
              + "。图已作为配图留下，可以点「重新识别」再试，正文不受影响");
    return;
  }
  // 识别回来的路上草稿可能已经关了。迟到的结果不写进任何地方。
  if(!noteCtx) return;
  entry.ok = true;
  entry.error = "";
  entry.text = read.transcribed || "";
  entry.confidence = read.confidence || "";
  entry.happened_on = read.happened_on || "";
  entry.unclear_parts = read.unclear_parts || [];
  noteCtx.read = read;
  // 图上读到日期就填进草稿：用户还要自己去找那个日期框、再手打一遍，
  // 那是白交代一次。读不到就留空——留空表示未知，不拿今天冒充。
  if(!noteCtx.day && entry.happened_on) noteCtx.day = entry.happened_on;
  // 输入框也要跟着填：noteSave 是从 DOM 取最终值的，只在 noteCtx 上改、
  // 不写回输入框的话，保存时那一眼看到的日期又被空值盖掉。
  const dayBox = $("note-day");
  if(dayBox && noteCtx.day && !dayBox.value) dayBox.value = noteCtx.day;
  // 文字进正文框。先撤掉上次这一段插进去的，再插新的。
  noteRemoveAppended(entry);
  if(entry.text) entry.appended = noteAppendText(entry.text);
  noteCtx.ocrBusy = false;
  renderNoteImageActs();
  if(entry.text){
    noteSheetHint("识别完成，文字已进上面的正文框，可以直接改");
    setStatus("读完了，文字已经进正文框，可以直接改");
  }else{
    // 模型没读到字也是正常结果（那张图可能真的没有文字）。
    // 不能说成失败——用户会以为自己哪里做错了。
    noteSheetHint("这张图里没读到文字。图已作为配图留下，正文不受影响");
    setStatus("这张图里没读到文字。图已作为配图留下，正文不受影响");
  }
}

/* 记事本草稿里的所有点击。

   这里不再有「选人才能继续」这道门：草稿打开就能写，主体、日期都是
   草稿里的字段，有内容之后再补。图片和语音是旁边两个动作，
   同一条草稿可以同时有文字和图片。 */
$("sheet").addEventListener("click", async (e) => {
  if(!noteCtx) return;
  const d = noteCtx;

  if(e.target.id === "note-add-photo"){
    notePickMode = "ask";
    notePickResolved = false;
    renderNotePickChoice();
    noteSheetHint("");
    $("note-photo-input").click();
    return;
  }
  // 第二步的三个互斥选项：识别进正文（送模型）/ 只存不识别（一次都不送）/
  // 先裁剪再识别（只送框里那一份）。见图进入草稿后 notePickImage 的 ask 分支。
  if(e.target.id === "note-more-acts"){
    noteCtx.showImageMore = !noteCtx.showImageMore;
    renderNoteImageActs();
    return;
  }
  if(e.target.id === "note-choice-ocr"){ noteResolvePick("ocr"); return; }
  if(e.target.id === "note-choice-keep"){ noteResolvePick("keep"); return; }
  if(e.target.id === "note-choice-crop"){ noteResolvePick("crop"); return; }

  const openPlanBtn = e.target.closest('[data-act="open-plan"]');
  if(openPlanBtn){
    await openPlan(openPlanBtn.dataset.plan);
    return;
  }

  if(e.target.id === "note-add-voice"){
    noteVoice(e.target);
    return;
  }

  // 加图之后的三条次要路径，见 renderNoteImageActs 的注释。
  // 识别已经不是这里的必经步骤了——加图时就自动识别过。
  if(e.target.id === "note-ocr"){
    // 重新识别：先撤掉上次插进正文的那段再认，不会留两遍。
    if(!d.b64){ setStatus("先选一张图"); noteSheetHint("先选一张图"); return; }
    if(d.ocrBusy) return;
    noteQueueOcr(d.b64, d.media);
    return;
  }

  if(e.target.id === "note-crop-first"){
    noteCropFirst();
    return;
  }

  if(e.target.id === "note-keep-image"){
    // 只作配图：不要文字。把自动识别插进去的那段原样撤掉，
    // 图照旧作为配图留在草稿里。
    noteRemoveAppended(noteFindRead(d.b64));
    const cur = noteFindRead(d.b64);
    if(cur) cur.imageOnly = true;
    d.imageOnly = true;
    d.read = null;
    // 同一张图不要出现两遍：indexOf 比的是对象引用，两个内容一样的
    // 字面量对象永远不相等，那行判断恒为真，加图时压过的那张又压一次，
    // 草稿里躺着两张一模一样的配图，用户得自己删。按内容比——
    // 而且必须拿原始文件那份（origB64）比，不能拿压缩后的 noteCtx.b64：
    // 识别之后 noteCtx.b64 已经是压缩图，attachments 里存的是原图，
    // 两者永远不相等，同一个 bug 会以另一种形式留下来。
    const orig = (cur && cur.origB64) || d.b64;
    const same = d.attachments.some((a) => a.b64 === orig);
    if(!same) d.attachments.push({b64: orig, media: d.media});
    renderNoteAttachments();
    renderNoteImageActs();
    setStatus("这张图会作为配图保存，识别出的文字已从正文撤掉");
    return;
  }

  // 换主体：只改草稿，还没保存，所以不会写错人。
  const subBtn = e.target.closest("[data-n-subject]");
  if(subBtn){
    d.subjectId = subBtn.dataset.nSubject;
    renderNoteSubjects();
    return;
  }

  const del = e.target.closest("[data-n-del]");
  if(del){
    d.attachments.splice(Number(del.dataset.nDel), 1);
    renderNoteAttachments();
    return;
  }

  if(e.target.id === "note-save"){
    noteSave(e.target);
    return;
  }
});

/* 草稿输入：正文打字即标记这条用了文字。不要求先选人再打字。 */
$("sheet").addEventListener("input", (e) => {
  if(!noteCtx) return;
  if(e.target.id === "note-text"){
    noteCtx.text = e.target.value;
    if(e.target.value.trim()) noteAddKind("text");
    return;
  }
  if(e.target.id === "note-day"){
    noteCtx.day = e.target.value;
    return;
  }
});

$("sheet").addEventListener("change", (e) => {
  if(!noteCtx) return;
  if(e.target.id === "note-photo-input"){ notePickImage("note-photo-input"); return; }
  if(e.target.id === "note-attach-input"){ noteAttachExtra("note-attach-input"); return; }
});

/* 再加一张纯配图：不裁剪、不识别，它就是要跟着记录存的图。 */
async function noteAttachExtra(inputId){
  const inp = $(inputId);
  if(!inp || !inp.files || !inp.files[0]) return;
  const f = inp.files[0];
  try{
    const src = await fileToB64(f);
    noteAddKind("image");
    noteCtx.attachments.push({b64: src.b64, media: src.media});
    renderNoteAttachments();
    setStatus("这张图会作为配图保存");
  }catch(err){
    setStatus("这张图没读出来：" + err.message);
  }finally{
    inp.value = "";
  }
}

/* 先圈范围再识别：可选的那条。图上只有中间一块是要记的、
   边上拍到的是客厅和家人时，用户需要自己决定哪些内容离开手机。 */
function noteCropFirst(){
  if(!noteCtx || !noteCtx.b64){ setStatus("先选一张图"); noteSheetHint("先选一张图"); return; }
  const dim0 = imageDim(noteCtx.b64, noteCtx.media);
  dim0.then((dim) => {
    if(!dim || !noteCtx){ setStatus("这张图读不出来，换一张试试"); return; }
    photoSeq += 1;
    cropState = {b64: noteCtx.b64, media: noteCtx.media,
                 w: dim.w, h: dim.h, rect: {x: 0.08, y: 0.08, w: 0.84, h: 0.84}};
    renderPhotoCrop(noteCtx.b64, noteCtx.media);
    setStatus("选好要识别的范围，只框里的内容会送去做识别");
  });
}

/* 语音输入：用浏览器自带的 SpeechRecognition，边说边出字。

   这条路和服务端模型接口无关：识别在浏览器里完成，音频不送到我们的服务，
   也不进我们的库。所以它不依赖那个没有中文转写能力的模型代理——
   之前标注「暂不可用」，是因为只看了服务端一条路，漏了浏览器本来就有这个能力。
   实测当前页面（http://127.0.0.1:8000，localhost 属安全上下文）
   可以构造 SpeechRecognition，getUserMedia 也可用。

   三条老规矩不变：识别结果本人可以改；不说做不到的事；
   浏览器不支持或用户不让用麦克风时如实说明，不假装成功。 */

function speechSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

/* ---------- 按住说话（t58）：资料弹层与对话输入区共用同一套实现 ----------
   交互：按下即请求麦克风权限并开始识别，松手/指针离开/取消即收尾；
   按住期间弹层内常驻「正在听，按住说话」，边说边把识别中的文字写回目标输入框；
   松开就把半句就地定稿。权限在按下那一刻就要，不等用户说了一半再要。
   反馈一律走 hint()（调用方传进来的弹层内元素），不写被 .sheet 盖住的 #status-line。
   各类失败（浏览器不支持、权限被拒、没听到声音、识别服务连不上、启动抛错）
   都在弹层内如实说明，并把按钮复位成可立即重点，不卡在禁用态。 */
function attachPushToTalk(btn, opts){
  if(!btn) return;
  const o = opts || {};
  const hint = o.hint || (() => {});
  const status = o.status || (() => {});
  const target = o.target;                 // 写字的输入框（textarea/input）
  const baseText = o.baseText || (() => "");   // 按下前已有的正文
  const setBaseText = o.setBaseText || (() => {});  // 定稿后回写正文
  const addKind = o.addKind || (() => {});
  const label = o.label || "说一段";
  let rec = null, said = "", pending = "", holding = false;

  const paint = () => {
    if(!target) return;
    const base = baseText() || "";
    target.value = (base ? base + "\n" : "") + said + pending;
  };
  const reset = () => {
    holding = false;
    btn.textContent = label;
    btn.disabled = false;
    btn.setAttribute("aria-pressed", "false");
  };
  const fail = (why) => {
    hint("语音没接上：" + why + "。可以直接打字，或用输入法的语音转文字粘贴进来");
    status("语音没接上：" + why);
    reset();
  };
  const start = async () => {
    if(holding) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      fail("这个浏览器不能语音识别");
      return;
    }
    // 按下就要权限：getUserMedia 触发一次，让系统授权框立刻出来。
    // 拿不到权限也照样进识别——权限最终由 SpeechRecognition 自己判，
    // 但先问一次能让用户在说话之前看到授权框，而不是说了一半才弹。
    try{
      if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
        await navigator.mediaDevices.getUserMedia({audio: true});
      }
    }catch(err){ /* 权限被拒下面的 onerror 会给出可读原因 */ }
    said = ""; pending = "";
    try{
      rec = new SR();
    }catch(err){
      fail(err.message || "启动失败");
      return;
    }
    rec.lang = "zh-CN";
    rec.interimResults = true;      // 边说边显示，说完就能看出对不对
    rec.continuous = false;
    holding = true;
    btn.disabled = true;            // 听的过程中不允许再按（防连点送多次）
    btn.setAttribute("aria-pressed", "true");
    btn.textContent = "正在听，松开结束…";
    hint("正在听，按住说话；松手就停");
    status("在听了，说话吧");
    rec.onresult = (e) => {
      said = ""; pending = "";
      for(let i = 0; i < e.results.length; i++){
        const piece = e.results[i][0].transcript || "";
        if(e.results[i].isFinal) said += piece;
        else pending += piece;
      }
      paint();
    };
    rec.onerror = (e) => {
      const why = {"not-allowed": "没让用麦克风", "service-not-allowed": "浏览器不让用语音识别",
                   "no-speech": "没听到声音", "audio-capture": "没有可用的麦克风",
                   "network": "识别服务没连上"}[e.error || e.code]
                  || ("出了点问题（" + (e.error || e.code) + "）");
      fail(why);
    };
    rec.onend = () => {
      // 半句没收尾的就地定稿：不丢掉，也不把没说完的话当成完整一句存起来。
      if(pending){ said += pending; pending = ""; }
      if(said){
        addKind("voice");
        setBaseText(said);
        if(target) target.value = baseText() || said;
        hint("话已转成文字，可以改完再保存");
        status("话已转成文字，可以改完再保存");
      }else if(holding){
        hint("没听到话，可以再按住说一次");
        status("没听到话");
      }
      reset();
    };
    try{
      rec.start();
    }catch(err){
      fail(err.message || "启动失败");
    }
  };
  const stop = () => {
    if(!holding){ reset(); return; }
    holding = false;
    btn.textContent = "正在收尾…";
    try{ rec && rec.stop(); }catch(err){ reset(); }
  };
  btn.addEventListener("pointerdown", (e) => { e.preventDefault(); start(); });
  btn.addEventListener("pointerup", stop);
  btn.addEventListener("pointercancel", stop);
  // 手指/指针滑出按钮区域也算松手：不然用户滑走了还在录音，自己不知道。
  btn.addEventListener("pointerleave", stop);
  btn.addEventListener("keydown", (e) => {
    if(e.key === " " || e.key === "Enter"){ e.preventDefault(); start(); }
  });
  btn.addEventListener("keyup", (e) => {
    if(e.key === " " || e.key === "Enter"){ e.preventDefault(); stop(); }
  });
  // 供测试与复用：外部也能以同样语义起停。
  btn.cbPushToTalk = {start: start, stop: stop};
}

/* 资料弹层的「语音输入」：复用上面那一套，目标框是 #note-text，
   弹层内反馈走 #note-sheet-hint。 */
function noteVoice(btn){
  if(!noteCtx) return;
  if(btn.cbPushToTalk) return;      // 已绑定过，不重复绑
  attachPushToTalk(btn, {
    hint: (t) => noteSheetHint(t),
    status: (t) => setStatus(t),
    target: $("note-text"),
    baseText: () => noteCtx.text || "",
    setBaseText: (said) => {
      noteCtx.text = (noteCtx.text ? noteCtx.text + "\n" : "") + said;
    },
    addKind: (k) => noteAddKind(k),
    label: "语音输入",
  });
}

/* 弹层一渲染出来就把按住说话的监听绑上。
   早先是在 click 里才绑，而 pointerdown 先于 click 发生——用户第一下按下去
   时监听还不存在，什么都没发生，正是「点了没反应」的原因。渲染时绑，
   第一下按下就有效。键盘/辅助技术仍走 click 分支兜底。 */
function bindNoteVoice(){
  const btn = $("note-add-voice");
  if(!btn || btn.cbPushToTalk) return;
  noteVoice(btn);
}


function speechSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

/* 保存：草稿的最终值。文字、识别并进来的内容、配图、主体、日期
   一起送。没有图也存得了——一条纯文字记录同样是要记的事。 */
async function noteSave(btn){
  if(!noteCtx) return;
  const d = noteCtx;
  const text = (($("note-text") || {}).value || "").trim();
  d.text = text;
  d.day = (($("note-day") || {}).value || "").trim();
  const hasText = !!text;
  const hasAttach = (d.attachments || []).length > 0;
  if(!hasText && !hasAttach){
    setStatus("写点什么，或者选一张图再记");
    return;
  }
  if(!d.subjectId){
    setStatus("还没选这条记在谁名下");
    return;
  }
  btn.disabled = true;
  btn.textContent = "正在保存…";
  setStatus("正在保存…");
  try{
    const res = await post("/api/photo/save", {
      subject_id: d.subjectId,
      // 没有图时传空串：原来这个字段硬性要求有内容，
      // 等于把「只打字」这条路堵死。
      image_b64: d.b64 || "",
      media_type: d.media || "image/jpeg",
      captured_by: meName,
      confirmed_fields: {},
      // 只作配图时给一份空识别结果，不给 null：传 null 服务端会当成
      // 「还没识别」，自己再调一次模型。用户点了「不识别」就是不要识别，
      // 这次调用既白花时间，还可能覆盖他刚写好的正文。
      read: d.read || {happened_on: d.day || "", items: [], note: "本条目只存图未识别"},
      draft_text: d.text,
      happened_on: d.day,
      attachments: d.attachments.map((a) => ({b64: a.b64, media: a.media})),
      input_kinds: d.kinds,
      voice_text: "",
    });
    $("sheet").classList.remove("open");
    cropState = null;
    noteCtx = null;
    await renderStream();
    await renderSide();
    setStatus(res.created ? "资料已保存" : "这条资料已经保存过了");
    // 保存成功之后问一句「这条要不要用于哪件事」。
    // 不自动挂：这条资料跟哪件事有关，只有本人知道，系统猜错比不猜更糟
    // （猜错的依据会进入协商，对方按错误信息做判断）。
    // 没有未完事项时这句话不出现——没有可挂的对象，摆一个空选择是噪音。
    let tasks = [];
    try{
      const d2 = await api("/api/note/linkable-tasks");
      tasks = (d2 && d2.tasks) || [];
    }catch(err){
      tasks = [];
    }
    const tip = document.createElement("div");
    tip.className = "msg pa";
    let h = '<div class="bubble">资料已保存。这条来源是「'
       + esc(res.provider) + '」。';
    if(tasks.length){
      h += '<div style="margin-top:8px;font-size:12.5px;color:var(--ink-3)">'
         + '这条资料要用于哪件事？点一下就行，不点也不会丢。</div><div id="note-link-box">';
      for(const t of tasks){
        h += '<button type="button" class="chip btn-chip" data-note-link-task="'
           + esc(t.task_id) + '" data-note-link-event="' + esc(res.event_id) + '">'
           + esc(t.utterance.length > 18 ? t.utterance.slice(0, 18) + "…" : t.utterance)
           + ' · ' + esc(t.stage_text) + '</button>';
      }
      h += '</div>';
    }
    h += '<div style="margin-top:10px"><button class="btn ghost" data-note-plan-event="' + esc(res.event_id) + '">用于家庭活动</button><div class="sub">先核对来源和字段；不自动公开正文或图片。</div></div>';
    h += '</div>';
    tip.innerHTML = h;
    stream.appendChild(tip);
    stream.scrollTop = stream.scrollHeight;
  }catch(err){
    setStatus("没保存：" + err.message);
  }finally{
    btn.disabled = false;
    btn.textContent = "保存资料";
  }
}

// 读原图，同时按 DataURL 里的 mime 判断真实格式。
// 只返回 base64 不够：调用方要拿它当 media_type 送服务端，而 file.type
// 有时是空串（部分安卓相册和浏览器会漏），这时把一张 PNG 按 jpeg 送，
// 服务端标签认错，识别直接失败。DataURL 的 mime 是浏览器刚解出来的，比 file.type 可靠。
function fileToB64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result || "");
      const i = s.indexOf(",");
      const m = /^data:([^;]+);/.exec(s);
      resolve({b64: i >= 0 ? s.slice(i + 1) : s,
               media: (m && m[1]) || file.type || "image/jpeg"});
    };
    r.onerror = () => reject(new Error("读取图片失败"));
    r.readAsDataURL(file);
  });
}

/* 手机相机原图动辄 3-8MB、4000×3000 以上。识别只需要看清文字，
   不需要原图：直接上传会被服务端的体积上限挡下，用户看到的是
   「没读出来」，而真实原因是文件太大——这等于让用户自己想办法
   压缩，违背「少交代」的前提。

   所以在浏览器里先降尺寸：长边压到 1600px，质量逐级降到 0.7，
   出来的图通常一两百 KB，文字仍然清楚。压不动或失败时退回原图，
   由服务端给出明确原因，不在这里假装成功。 */
const PHOTO_MAX_EDGE = 1600;

function fileToCompressedB64(file){
  // 返回 {b64, media}：压缩分支产出 jpeg，原图分支带上真实格式，
  // 调用方只消费这一个形状。失败必须 reject，让外层的 catch 说得出原因；
  // 只 resolve 的话 FileReader 出错会让这个 Promise 永远 pending，
  // 界面停在「正在读」不动，用户只能刷新页面。
  return new Promise((resolve, reject) => {
    const fail = () => fileToB64(file).then(resolve, reject);
    if(!/^image\//.test(file.type || "") || typeof createImageBitmap !== "function"){
      fail();
      return;
    }
    const toBmp = createImageBitmap(file);
    toBmp.then((bmp) => {
      const w = bmp.width, h = bmp.height;
      const scale = Math.min(1, PHOTO_MAX_EDGE / Math.max(w, h));
      if(scale >= 1 && file.size <= 1.5 * 1024 * 1024){
        bmp.close();
        fail();
        return;
      }
      const cw = Math.max(1, Math.round(w * scale));
      const ch = Math.max(1, Math.round(h * scale));
      const cv = document.createElement("canvas");
      cv.width = cw;
      cv.height = ch;
      const ctx = cv.getContext("2d");
      if(!ctx){ bmp.close(); fail(); return; }
      ctx.drawImage(bmp, 0, 0, cw, ch);
      bmp.close();
      // 压缩分支一律 jpeg：canvas 编码选的就是 image/jpeg，
      // 这里写死，和下面 toDataURL 的第一个参数保持一致。
      // 逐级降质量：先把图压到目标体积内，再交出去。
      // 下限判断用常量，不用 q <= 0.5：0.85 每级减 0.15 是浮点运算，
      // 会走到 0.3999999，等于在下限之外又白压一级，图更糊却没换来体积。
      const MIN_QUALITY = 0.5;
      const tryQuality = (q) => {
        const url = cv.toDataURL("image/jpeg", q);
        const b64 = url.slice(url.indexOf(",") + 1);
        // 4/3 是 base64 相对二进制的膨胀率，这里按 base64 长度估体积。
        if(b64.length * 0.75 <= 900 * 1024 || q <= MIN_QUALITY + 1e-9){
          resolve({b64: b64, media: "image/jpeg"});
          return;
        }
        tryQuality(Math.max(MIN_QUALITY, q - 0.15));
      };
      tryQuality(0.85);
    }).catch(() => {
      fail();
    });
  });
}

/* ---------- 拍照链第一步：本地裁剪 ----------

   选完图先只在本地里裁，不送任何请求。两个原因：
   一是范围外的画面根本不该离开手机——用户圈的是中间那张表格，
      边上拍到的是客厅和家人，送上去就是把没想给的内容交出去；
   二是识别要等模型几十秒，范围没定就送，裁错了得整张重跑。

   所以这里只解码、显示、等用户确认范围。确认之后才编码上传。
*/
/* 旧的「拍一张记录」选图回调已删除：记事本式录入有自己的输入框
   （note-photo-input / note-attach-input），走 notePickImage / noteAttachExtra。
   留着这个回调会和新的重复触发——同一次选图既进旧草稿又进新草稿，
   用户看到两份内容，而其中一份并不是他要的那条。 */


// 裁剪状态。rect 用比例（0~1）存，不存像素：
// 预览框宽度和真实图宽不一样，存像素的话一改布局选区就跑偏。
let cropState = null;   // { b64, media, w, h, rect:{x,y,w,h} }

// 这一轮拍照操作的代次。每选一张新图、每取消一次都自增。
// 裁剪要等图片解码、还要等一次 canvas 编码，这两步都是异步的。
// 没有代次的话会出现这个顺序：点了「就用这个范围」→ 编码还没回来，
// 用户等不及点了取消或重选 → 旧图的编码结果这时才回来，照原样送出识别，
// 屏幕上明明是刚取消过，识别回来的却是那张已经不要的图。
// 送出前、请求回来后各核一次，对不上就整个丢弃。
let photoSeq = 0;

// 作废当前这一轮拍照操作。所有「关闭裁剪界面」的路径都必须调它：
// 点取消按钮、点弹层外的遮罩、重拍重选、换一张图。
// 漏掉任何一条，那条路径就会变成缺口——监督实测点遮罩关闭后，
// 迟到的旧编码照样送出了 1 次识别，弹层还重新打开了一份草稿，
// 而用户明明已经关掉了这个界面。统一走一个函数就不会漏。
function invalidatePhoto(){
  cropState = null;
  photoSeq += 1;
}

function renderPhotoCrop(b64, media){
  const img = new Image();
  img.onload = () => {
    // 每张新图都是一轮新的操作。代次自增后，上一张图还在飞的
    // 编码或识别结果回来时会对不上号，被整个丢弃。
    photoSeq += 1;
    cropState = {b64: b64, media: media, w: img.naturalWidth, h: img.naturalHeight,
                 rect: {x: 0.08, y: 0.08, w: 0.84, h: 0.84}};
    let h = '<h2 id="sheet-title">选要识别的范围</h2>'
       + '<div class="sub">拖动四角调整范围，只有框里的内容会送去做识别。'
       + '不想裁就用整张。</div>'
       + '<div class="crop" id="crop-box">'
       + '<img id="crop-img" alt="待裁剪的照片">'
       + '<div class="mask" id="crop-mt"></div>'
       + '<div class="mask" id="crop-mb"></div>'
       + '<div class="mask" id="crop-ml"></div>'
       + '<div class="mask" id="crop-mr"></div>'
       + '<div class="box" id="crop-r"><i class="h tl"></i><i class="h tr"></i>'
       + '<i class="h bl"></i><i class="h br"></i></div>'
       + '</div>'
       + '<div class="sub" style="margin-top:8px" id="crop-size"></div>'
       + '<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">'
       + '<button class="btn primary" id="crop-ok">就用这个范围</button>'
       + '<button class="btn ghost" id="crop-all">用整张</button>'
       + '<button class="btn ghost" id="crop-retry">重拍 / 重选</button>'
       + '<button class="btn ghost" data-close-sheet>取消</button></div>'
       + '<div class="notice" style="margin-top:10px">图片先在本机裁剪，'
       + '确认范围后才会送去做识别。取消就不会上传，也不会记任何东西。</div>';
    $("sheet-body").innerHTML = h;
    $("sheet").classList.add("open");
    $("crop-img").src = "data:" + media + ";base64," + b64;
    drawCrop();
    bindCropDrag();
  };
  img.onerror = () => {
    // 解码失败保留预览，让用户重选，不悄悄退回上传完整原图。
    setStatus("这张图读不出来，换一张试试");
  };
  img.src = "data:" + media + ";base64," + b64;
}

function drawCrop(){
  if(!cropState) return;
  const box = $("crop-box");
  if(!box) return;
  // 每次重绘前先夹回图内：拖拽过程中可能把选区推出边界，
  // 不夹的话导出的范围和用户看到的不一致。
  const r = clampCrop(cropState.rect);
  cropState.rect = r;
  const left = r.x * 100, top = r.y * 100;
  const width = r.w * 100, height = r.h * 100;
  const right = (r.x + r.w) * 100, bottom = (r.y + r.h) * 100;
  const sel = $("crop-r");
  sel.style.left = left + "%";
  sel.style.top = top + "%";
  sel.style.width = width + "%";
  sel.style.height = height + "%";
  // 四块遮罩盖住范围外：所见即所得，用户看到的暗处就是不送的部分。
  // 四边都要盖：只盖顶部的话，选框下方和左右还是亮的，
  // 用户会以为那些画面也一起送了上去。
  const mt = $("crop-mt"), mb = $("crop-mb"), ml = $("crop-ml"), mr = $("crop-mr");
  if(mt){ mt.style.left = "0"; mt.style.right = "0"; mt.style.top = "0";
          mt.style.height = top + "%"; }
  if(mb){ mb.style.left = "0"; mb.style.right = "0"; mb.style.top = bottom + "%";
          mb.style.bottom = "0"; }
  if(ml){ ml.style.left = "0"; ml.style.top = top + "%";
          ml.style.width = left + "%"; ml.style.height = height + "%"; }
  if(mr){ mr.style.left = right + "%"; mr.style.right = "0"; mr.style.top = top + "%";
          mr.style.width = (100 - right) + "%"; mr.style.height = height + "%"; }
  // 尺寸说明按真实像素算：用户要知道送出去的是多大一张，
  // 不是预览框里看着的大小。
  const px = Math.round(cropState.w * r.w), py = Math.round(cropState.h * r.h);
  $("crop-size").textContent = "将送出 " + px + " × " + py + " 像素（原图 "
    + cropState.w + " × " + cropState.h + "）";
}

// 把选区夹回图内。最小尺寸和固定对边都要约束，否则会出现两种难看的结果：
// 一是选区跑出画面，框外的部分用户看不见却仍然被当成已选范围送上去；
// 二是拖一个角时对边跟着移动，选框像在飘，用户对不准想圈的地方。
const CROP_MIN = 0.06;

function clampCrop(r){
  const min = CROP_MIN;
  let w = Math.max(min, Math.min(1, r.w));
  let h = Math.max(min, Math.min(1, r.h));
  let x = Math.max(0, Math.min(1 - w, r.x));
  let y = Math.max(0, Math.min(1 - h, r.y));
  return {x: x, y: y, w: w, h: h};
}

function bindCropDrag(){
  const box = $("crop-box");
  if(!box) return;
  let mode = "";   // move | tl | tr | bl | br
  let start = null;

  const point = (e) => {
    const b = box.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    // 高度必须从 getBoundingClientRect() 取。写 box.height 取到的是 undefined：
    // 那个属性在 DOM 元素上不存在，除出来是 NaN。NaN 参与比较全部为 false，
    // 于是上下方向的拖动一条都不生效——用户只能左右拉，选区高度调不了，
    // 而代码看起来完全正常，因为没有任何报错。
    return {x: (t.clientX - b.left) / b.width, y: (t.clientY - b.top) / b.height};
  };

  box.addEventListener("pointerdown", (e) => {
    const h = e.target.className || "";
    mode = h.indexOf("tl") >= 0 ? "tl" : h.indexOf("tr") >= 0 ? "tr"
         : h.indexOf("bl") >= 0 ? "bl" : h.indexOf("br") >= 0 ? "br" : "move";
    start = {p: point(e), r: Object.assign({}, cropState.rect)};
    box.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  box.addEventListener("pointermove", (e) => {
    if(!mode || !start) return;
    e.preventDefault();
    const p = point(e);
    const dx = p.x - start.p.x, dy = p.y - start.p.y;
    const r = cropState.rect;
    if(mode === "move"){
      // 整体平移，不能拖出画面：范围跑出去了，框外的部分用户看不见，
      // 却仍然被当成「已选范围」送上去。
      r.x = Math.max(0, Math.min(1 - r.w, start.r.x + dx));
      r.y = Math.max(0, Math.min(1 - r.h, start.r.y + dy));
    }else{
      // 拖角改大小。对边固定，这样拖动方向和手指一致；
      // 若四角都能自由移动，用户拖右上角时左下角会跟着飘。
      const r0 = start.r;
      // 关键：动的那条边必须夹在「固定对边 − 最小尺寸」以内。
      // 反过来做（先让宽高变负，再靠 clampCrop 把整框平移回画面内）
      // 会把固定对边一起挪走——监督实测把左上角拖过原右下角时，
      // 右下从 .92 漂到 1，框整个翻到另一边，用户圈中的范围变了。
      // 这里固定对边的坐标从头到尾不参与计算，所以漂不动。
      const min = CROP_MIN;
      const edge = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      if(mode === "br"){
        // 左上固定：左边和上边原样不动。
        const nr = edge(r0.x + r0.w + dx, r0.x + min, 1);
        const nb = edge(r0.y + r0.h + dy, r0.y + min, 1);
        r.x = r0.x; r.y = r0.y; r.w = nr - r0.x; r.h = nb - r0.y;
      }else if(mode === "tr"){
        // 左下固定。
        const nr = edge(r0.x + r0.w + dx, r0.x + min, 1);
        const nb = edge(r0.y + dy, 0, r0.y + r0.h - min);
        r.x = r0.x; r.y = nb; r.w = nr - r0.x; r.h = r0.y + r0.h - nb;
      }else if(mode === "bl"){
        // 右上固定。
        const nl = edge(r0.x + dx, 0, r0.x + r0.w - min);
        const nb = edge(r0.y + r0.h + dy, r0.y + min, 1);
        r.x = nl; r.y = r0.y; r.w = r0.x + r0.w - nl; r.h = nb - r0.y;
      }else{
        // tl：右下固定。
        const nl = edge(r0.x + dx, 0, r0.x + r0.w - min);
        const nb = edge(r0.y + dy, 0, r0.y + r0.h - min);
        r.x = nl; r.y = nb; r.w = r0.x + r0.w - nl; r.h = r0.y + r0.h - nb;
      }
      // 收尾仍过一次 clampCrop：正常路径下它是空操作，
      // 但浮点误差或异常输入时兜底，保证四条边始终在画面内。
      const fin = clampCrop(r);
      r.x = fin.x; r.y = fin.y; r.w = fin.w; r.h = fin.h;
    }
    drawCrop();
  });
  const end = () => { mode = ""; start = null; };
  box.addEventListener("pointerup", end);
  box.addEventListener("pointercancel", end);
}

// 按当前范围裁出真实的图。返回 {b64, media}，失败 reject。
// 只在这里编码一次：识别、保存都用这一份，不会出现「送识别的图」
// 和「存档依据的图」不是同一张的情况。
function cropToCompressedB64(){
  return new Promise((resolve, reject) => {
    if(!cropState) { reject(new Error("没有待裁剪的图")); return; }
    const s = cropState;
    const r = s.rect;
    const sx = Math.round(s.w * r.x), sy = Math.round(s.h * r.y);
    const sw = Math.max(1, Math.round(s.w * r.w));
    const sh = Math.max(1, Math.round(s.h * r.h));
    const img = new Image();
    img.onload = () => {
      // 长边压到 1600 以内再编码：手机拍一张五六 MB 是常事，
      // 直接送既慢又可能超服务端限制。裁剪已经去掉一部分，
      // 这里再压一次，两级都按同一范围算。
      const scale = Math.min(1, PHOTO_MAX_EDGE / Math.max(sw, sh));
      const cw = Math.max(1, Math.round(sw * scale));
      const ch = Math.max(1, Math.round(sh * scale));
      const cv = document.createElement("canvas");
      cv.width = cw; cv.height = ch;
      const ctx = cv.getContext("2d");
      if(!ctx){ reject(new Error("浏览器不支持画布")); return; }
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
      const MIN_QUALITY = 0.5;
      const tryQuality = (q) => {
        const url = cv.toDataURL("image/jpeg", q);
        const b64 = url.slice(url.indexOf(",") + 1);
        if(b64.length * 0.75 <= 900 * 1024 || q <= MIN_QUALITY + 1e-9){
          resolve({b64: b64, media: "image/jpeg", w: cw, h: ch});
          return;
        }
        tryQuality(Math.max(MIN_QUALITY, q - 0.15));
      };
      tryQuality(0.85);
    };
    img.onerror = () => reject(new Error("这张图解码失败了，可以重选一张"));
    img.src = "data:" + s.media + ";base64," + s.b64;
  });
}

/* 整张图直接压缩，不裁剪。识别默认就走这条：用户点一下「读出文字」
   就该看到结果，不该先被带去裁剪。裁剪是可选的那条——图上只有中间
   一块是要记的、边上拍到的是客厅和家人时，他才需要自己圈范围。 */
function wholeImageB64(b64, media){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, PHOTO_MAX_EDGE / Math.max(w, h));
      const cw = Math.max(1, Math.round(w * scale));
      const ch = Math.max(1, Math.round(h * scale));
      const cv = document.createElement("canvas");
      cv.width = cw; cv.height = ch;
      const ctx = cv.getContext("2d");
      if(!ctx){ reject(new Error("浏览器不支持画布")); return; }
      ctx.drawImage(img, 0, 0, w, h, 0, 0, cw, ch);
      const MIN_QUALITY = 0.5;
      const tryQuality = (q) => {
        const url = cv.toDataURL("image/jpeg", q);
        const out = url.slice(url.indexOf(",") + 1);
        if(out.length * 0.75 <= 900 * 1024 || q <= MIN_QUALITY + 1e-9){
          resolve({b64: out, media: "image/jpeg"});
          return;
        }
        tryQuality(Math.max(MIN_QUALITY, q - 0.15));
      };
      tryQuality(0.85);
    };
    img.onerror = () => reject(new Error("这张图解码失败了，可以重选一张"));
    img.src = "data:" + (media || "image/jpeg") + ";base64," + b64;
  });
}

$("sheet").addEventListener("click", async (e) => {
  // 取消裁剪：不识别、不保存，也不把旧结果写到新图上。
  if(e.target.closest("[data-close-sheet]") && cropState){
    cropState = null;
    // 取消就是作废这一轮。代次自增后，任何还在飞的编码或识别结果
    // 回来时都对不上号，会被整个丢弃，不会落成一条新草稿。
    invalidatePhoto();
    // 回到草稿，不是关掉整个弹层。裁剪只是这条草稿里的一个步骤，
    // 用户可能已经打了字、选好了人，关掉就等于把这些全丢了。
    if(noteCtx){
      renderNoteSheet();
    }else{
      $("sheet").classList.remove("open");
      personStack = [];
    }
    return;
  }
  if(e.target.id === "crop-all" && cropState){
    // 用整张是一个明确动作，不是默认行为：用户得自己说「这张全都要」。
    cropState.rect = {x: 0, y: 0, w: 1, h: 1};
    drawCrop();
    return;
  }
  if(e.target.id === "crop-retry"){
    // 重拍重选同样是新的一轮：旧图不要再被送出去识别。
    invalidatePhoto();
    // 回到草稿再打开选图。原来这里点 #photo-input，那个 input 已随旧拍照流
    // 一起退役，点了没有任何反应——按钮看得见、按下去没动静。
    if(noteCtx) renderNoteSheet();
    setTimeout(() => { const i = $("note-photo-input"); if(i) i.click(); }, 60);
    return;
  }
  if(e.target.id === "crop-ok" && cropState){
    const btn = e.target;
    // 记住这一轮的代次。编码是异步的，中间用户可能取消或换图，
    // 回来后必须核对还是不是同一轮，不是就把结果丢掉。
    const mySeq = photoSeq;
    btn.disabled = true;
    btn.textContent = "正在送出…";
    setStatus("正在识别…");
    try{
      const picked = await cropToCompressedB64();
      // 编码期间取消或换图了：这一轮已经不算数，不要再往下送识别。
      // 少了这道核对，用户取消之后屏幕上会突然多出一份他不想要的草稿，
      // 而且那张图是他明确说不要的。
      if(mySeq !== photoSeq || !cropState){
        btn.disabled = false;
        btn.textContent = "就用这个范围";
        return;
      }
      // 写回记事本草稿，不是旧的 photoCtx（那个对象已经没人读了）。
      // 少了这一步，用户看到「正在送出」、也看到「读完了」，
      // 草稿里却什么内容都没有——图白选了，字白识别了。
      if(!noteCtx) return;
      // 走和加图自动识别同一条路：文字并进正文框、提示行写清把握，
      // 失败时也不卡死。两边各写一遍识别逻辑，改一处漏一处。
      // 第四参把「先选范围」这条接回原来那张图的识别状态，
      // 不让自动识别插进去的那段在正文里留两遍。
      noteCtx.cropped = true;
      await noteRunOcr(picked.b64, picked.media, true,
                       noteFindRead(noteCtx.b64));
      if(mySeq !== photoSeq || !noteCtx) return;
      // 裁剪这一轮结束了。不清掉 cropState 的话，回到草稿之后点
      // 「再想想」会被上面那个 data-close-sheet + cropState 的分支接住，
      // 只是重画一次弹层、关不掉——用户想收手的时候收不了。
      cropState = null;
      // 回到草稿：裁剪只是这条草稿里的一个步骤，不是另一个界面。
      // renderNoteSheet 用 noteCtx.day 重画输入框，日期自然带过来。
      // 原来这里整块替换弹层内容，草稿上的字、已选的图、语音按钮
      // 全部消失，用户被留在裁剪界面里，想继续写只能关掉重来。
      renderNoteSheet();
    }catch(err){
      btn.disabled = false;
      btn.textContent = "就用这个范围";
      setStatus("没读出来：" + err.message);
    }
  }
});

// 核对页：模型读到的每个字段单独一个勾选框，默认只勾它自己有把握的。
// 看不清的地方单独列出来，不让「看不清」悄悄变成一条事实。
/* ---------- 拍照链第三步：可编辑的图文草稿 ----------

   勾选框只能决定「要不要」，不能改内容。识别把「25 分钟」读成
   「2S 分钟」时，用户除了整条不勾没有别的办法——要么忍着一个错字进记忆，
   要么把对的部分也一起丢掉。所以这里改成能改的草稿。

   两条边界写死在实现里：
   1. 模型读到的原文和本人改后的内容分开存。来源写清哪些是模型读的、
      哪些是本人核对/补充的，不把改动冒记为模型原文或孩子自述；
   2. 保存时用草稿里的最终值，不能用 read.fields 反盖。
*/
/* 旧的 photoCtx 草稿（renderPhotoDraft / renderDraftFields / bindDraftInputs /
   renderDraftAttachments / renderDraftSubjects，以及挂在 #sheet 上的 draft-* 与
   photo-save 监听）已整体删除。记事本式录入用 noteCtx + note* 那一套，
   两边并存会互相覆盖：旧监听以 !photoCtx 提前 return，新的 noteCtx 流程
   根本不会触发它们，但 crop-ok 里那段仍然写 photoCtx，会把图写进一个
   已经没人读的对象，用户看到「读完了」而草稿里什么都没有。 */

/* 已配对设备列表：只看本人的，可撤销。撤销后该设备的凭证立即失效。 */
async function loadDevices(){
  const box = $("device-box");
  if(!box) return;
  box.innerHTML = '<div class="sub" data-loading="devices">正在查已连接设备…</div>';
  try{
    const d = await api("/api/extension/devices");
    if(!d.devices || !d.devices.length){
      box.innerHTML = '<div class="sub">还没有连接过设备。</div>';
      return;
    }
    let h = '<div class="sub">正在用的设备：</div>';
    // 先声明再拼：把 inactive 提示写在 let h 之前会撞上暂时性死区，
    // 有已撤销设备时整个列表直接抛错，界面上只看到「没读到设备列表」。
    if(d.inactive_count){
      h += '<div class="sub">另有 ' + d.inactive_count + ' 台已撤销或已过期的设备，不列在这里。</div>';
    }
    for(const dev of d.devices){
      h += '<div class="demo-row"><span class="lbl">'
         + esc(dev.client_name || "浏览器插件") + '</span>'
         + '<button class="btn ghost" data-revoke="' + esc(dev.client_id) + '">撤销</button></div>';
      h += '<div class="sub" style="margin-top:-6px">'
         + esc(dev.revoked_at ? "已撤销" : "有效期到 " + (dev.expires_at || "").slice(0, 16)) + '</div>';
    }
    box.innerHTML = h;
    box.querySelectorAll("[data-revoke]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try{
          await api("/api/extension/revoke", {
            method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({client_id: btn.dataset.revoke}),
          });
          await loadDevices();
        }catch(err){
          box.insertAdjacentHTML("beforeend",
            '<div class="notice">撤销失败：' + esc(err.message || "") + '</div>');
        }
      });
    });
  }catch(err){
    box.innerHTML = '<div class="notice">没读到设备列表：' + esc(err.message || "") + '</div>';
  }
}

/* ---------- 快捷示例 ---------- */
// 底部横栏两套引导，分开定义、分开判断，不再无差别展示同一组。
//
// INTRO：第一次打开、或者离开很久再回来。短，只教这个助手能干什么，
// 不一次堆六条。默认不把每句话都当成买礼物。
// CONTEXT：会话中，跟在助手回答末尾。从当前这件事的实际状态推导下一步，
// 推导不出来就少给或不给——宁可空着，也不拿猜的引导误导人。
/* A 套：首次使用或久未回来。短，教这个助手能干什么，不一次堆六七条。
   已经在聊某件事时不教「第一次可以说什么」——那会把人从手上这件事带走；
   改成贴着那件事给一两条。 */
const QUICK_INTRO = [
  "周末三家一起带孩子出去玩，我出 100 以内",
  "记一下孩子这周的情况",
  "给小周的女儿准备生日礼物，300元以内，别和我上次送的重复",
];
const QUICK_INTRO_ONGOING = [
  "现在办到哪一步了？",
  "改我的条件",
];
// 离开多久算「久未使用」。取 30 分钟：短于一次认真的家庭安排沟通，
// 长于随手回来看看。阈值只影响显示哪一套，不影响任何业务状态。
const QUICK_IDLE_MS = 30 * 60 * 1000;
let lastMsgAt = 0;        // 最近一次收发消息的时间戳
let sawAssistant = false; // 这次会话里有没有出现过助手回复
let lastSaid = null;      // 最近一次 /api/say 的响应，用来推导上下文引导

/* 上下文引导：从当前这件事的**实际状态**推，推不出依据就给空数组，不硬凑。
   依据只取 /api/say 这次响应里已经有的字段，不为出引导额外打接口：
     plan_id / missing_families / requested_families / own_cap /
     current_version / needs_replan / task_id / kind。
   - 还差几家没进事项 → 先邀请，别催着看方案；
   - 自己这一方还没给条件 → 先改我的条件；
   - 已经出方案 → 看还差谁；
   - 三条都推不出来就只给「打开这件事」，宁少勿凑。 */
function contextQuick(){
  const said = lastSaid;
  if(!said) return [];
  const out = [];
  if(said.plan_id){
    out.push("打开这件事");
    const missing = Number(said.missing_families || 0);
    if(missing > 0){
      out.push("邀请另一个家庭参与");
    }
    // 自己这一方有没有给过条件：家庭活动看出资上限，普通事项看不出资上限就不猜。
    const ownGiven = !!(said.own_cap || said.own_conditions);
    if(!ownGiven){
      out.push("改我的条件");
    }
    if(Number(said.current_version || 0) > 0 && !said.needs_replan){
      out.push("看看还差谁");
    }
  }else if(said.task_id){
    out.push("打开这件事");
    out.push("现在办到哪一步了？");
  }else if(said.kind === "family_update"){
    out.push("她最近还想画画吗");
    out.push("记错了，喜欢拼图的是哥哥，妹妹喜欢画画");
  }
  return out;
}

/* 该显示哪一套：没出现过助手回复算首次；距上一条消息超过阈值算久未使用；
   其余情况走上下文那一套。 */
function quickSet(){
  if(!sawAssistant) return QUICK_INTRO;
  if(Date.now() - lastMsgAt > QUICK_IDLE_MS){
    // 久未回来：已经在聊的事接着给两条，不从头教。
    return (lastSaid && (lastSaid.plan_id || lastSaid.task_id))
      ? QUICK_INTRO_ONGOING : QUICK_INTRO;
  }
  return contextQuick();
}

function renderQuick(){
  const box = $("quick");
  if(!box) return;
  const set = quickSet();
  box.innerHTML = set.map((q) => '<button type="button">' + esc(q) + '</button>').join("");
}
renderQuick();
wireChatInputs();
$("quick").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if(!b || busy) return;
  // 发出去的那条从横栏上消失。留着它，用户会以为没发成功、再点一次，
  // 同一件事就办了两遍；而且「换商品后重新协商」这类状态已经变了，
  // 旧的那句话还挂在横栏上会误导下一步。
  const text = b.textContent;
  // 发出去就真的从这里消失，失败也不插回来。用户明确要求「发送后从横栏
  // 消失」：失败了还挂在横栏上，他看着会以为刚才没点中，再点一次就把
  // 同一件事办两遍。重发的路给在那条失败回复里，见 send() 的 catch。
  if(b.parentNode) b.parentNode.removeChild(b);
  // 预设 prompt 点一下就整句发出。发之前先清空输入框：send() 里虽然也会清，
  // 但失败回填只覆盖手打的那份；预设句若曾被点进输入框，失败后会原样留在
  // 横栏上，看着像「又给我塞回一句」，用户会再点一次、重复发同一件事。
  input.value = "";
  input.style.height = "auto";
  sendBtn.disabled = true;
  send(text, {fromPreset: true});
});

/* ---------- 启动 ---------- */
// 先问一次「我是谁」再渲染。身份只由服务端会话给出：
// 没有这个步骤，界面上就没有本人称呼，用户也不知道这份记忆是谁的。
// 把页面里的脚本错误暴露出来。没有这个捕获器时，验收脚本只能读到
// window.__paErr 的 undefined，那是什么都证明不了的——错误发生了也看不出来。
window.__paErr = "";
window.addEventListener("error", (e) => {
  window.__paErr += "[error] " + (e.message || "") + " @"
    + (e.filename || "") + ":" + (e.lineno || 0) + "\n";
});
window.addEventListener("unhandledrejection", (e) => {
  const r = e.reason;
  window.__paErr += "[unhandled] " + ((r && r.message) ? r.message : String(r)) + "\n";
});

async function boot(){

    // 界面上也不显示一个可能不对的称呼。
    ownerId = "";
  }
  await renderStream();
  await renderSide();
}
boot();

/* ---------- 服务端换了新界面，让旧标签页自己发现 ----------

   用户在手机上开着页面时改了代码，这个标签页还是旧界面：之前修好的
   快速栏点击、报错人话全都看不到，用户看到的是「点了没反应」和
   「出了点问题：[object Object]」，然后回来报 bug。

   所以这里轮询服务端的界面版本号。发现变了不直接 reload：
   正在输入的话会丢，正在识别的图会白跑，未保存的草稿会消失。
   只在这三样都没有时才刷新，并在状态行说清「已更新」，让用户知道
   刚才那一下不是页面坏了。
*/
const UI_REVISION = (window.__paUiRevision || "");
const UI_POLL_MS = 5000;

// 有这三种情况时不刷新，让用户先把手里的事做完。
function uiBusy(){
  // 1. 正在打字或粘贴，还没发出去。
  if($("input") && $("input").value.trim()) return true;
  // 2. 正在等一个请求回来：发送中、协商中、识别中、保存中。
  if(busy) return true;
  // 3. 弹层开着，里面可能有没保存的草稿（拍照核对、改字段、发起共同事项）。
  if($("sheet") && $("sheet").classList.contains("open")) return true;
  return false;
}

function uiUpdated(){
  // 不打断用户：这次不刷，等下次轮询。中间用户自己发一句话也会带出新界面。
  if(uiBusy()) return false;
  // 弹层和输入框都空着才刷新。用 location.reload() 而不是重新渲染，
  // 因为新界面可能改了结构，只换数据的话新旧代码混在一起更难看懂。
  location.reload();
  return true;
}

setInterval(() => {
  fetch("/api/ui-revision").then((r) => r.json()).then((d) => {
    if(d && d.revision && UI_REVISION && d.revision !== UI_REVISION){
      uiUpdated();
    }
  }).catch(() => {
    // 网络断了不提示：离线时显示未连接比弹一个更新横幅好。
  });
}, UI_POLL_MS);

/* ---------- 手机入口：注册离线外壳，支持加到主屏 ----------
   只缓存界面骨架，不缓存任何 /api/ 业务数据：手机从主屏点开要立刻有界面，
   但不能因此看到过期的事项。注册失败（无 HTTPS、浏览器不支持）时静默跳过，
   普通网页访问不受影响——这条链本来就要在没有 HTTPS 的局域网上也能用。 */
if("serviceWorker" in navigator && window.isSecureContext !== false){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/static/sw.js").catch(() => {});
    // 离线外壳换了版本就重新加载页面。没有这一步时，手机上那个开着的
    // 标签页会一直跑旧代码：预设 prompt 照旧把句子塞回输入框、发完还挂在
    // 横栏上，而服务端明明是新的。用户没有任何理由怀疑是缓存，
    // 只会觉得「这东西时好时坏」——正是要避免的那种体验。
    // 沿用 uiBusy 的判断：正在打字、正在等请求、弹层里有没保存的草稿时
    // 都不刷，让用户先把手里的事做完。
    navigator.serviceWorker.addEventListener("message", (e) => {
      if(!e.data || e.data.type !== "pa-sw-updated") return;
      if(uiBusy()) return;
      setStatus("界面已更新");
      location.reload();
    });
  });
}

// sent to a shared model; a second explicit action publishes reviewed conditions.
let notePlanDraft=null;
async function loadPlanLastMile(planId, plan){

  if(!box.isConnected||box.dataset.plan!==planId)return;
  let h='<h4>邀请另一个家庭参与</h4><p class="sub">生成只供你复制，不自动发送。接收者以自称家庭参与，不验证就是既有联系人；接邀请、你认可入场和接受方案分开。仅用虚构数据。</p>';
  if(results[0].status==='fulfilled'){
    h+='<label class="last-mile-field">邀请称呼（仅提示）<input id="invite-label" maxlength="40" placeholder="来宾一家"></label><button class="btn ghost" data-invite-create="'+esc(planId)+'">生成单次邀请</button><div id="invite-copy"></div>';
    const items=results[0].value.invitations||[];
    for(const i of items){const revoked=i.state==='revoked', claimed=!!i.guest_id||!!i.claimed_name;
      h+='<div class="last-mile-source"><b>'+esc(i.label||'邀请')+'</b><div class="sub">'+esc(i.state)+' · 到期 '+esc(i.expires_at)+' · 自称 '+esc(i.claimed_name||'尚未接收')+'（未核验实名）</div>';
      if(claimed&&!i.approved&&!revoked){
        h+='<label class="last-mile-field">认可的家庭槽<select data-invite-slot="'+esc(i.invitation_id)+'"><option value="">新增自称家庭，不假冒联系人</option>';
        for(const p of plan.participants||[]){if(p.owner_id!==ownerId&&Object.keys(p.conditions||{}).length===0&&['pending','invited','waiting',''].includes(p.state||''))h+='<option value="'+esc(p.participant_id)+'">明确替换候选：'+esc(p.label)+'</option>';}
        h+='</select></label><p class="sub">替换只允许无条件、无决定的候选。你认可自称家庭槽，不替对方填写条件或接受方案。</p><button class="btn ghost" data-invite-approve="'+esc(i.invitation_id)+'" data-plan="'+esc(planId)+'">认可自称家庭</button>';
      }else if(i.approved)h+='<p class="sub">已认可入场；不是实名核验，不是接受方案。</p>';
      if(!revoked)h+='<button class="btn ghost" data-invite-revoke="'+esc(i.invitation_id)+'" data-plan="'+esc(planId)+'">撤回访问</button>';
      h+='</div>';
    }
  }else h+='<p class="sub">邀请入口未读取：'+esc(results[0].reason.message)+'</p>';
  h+='<h4>本人的资料来源</h4><p class="sub">这里仅本人可看。关联不代表采用，发生日期不是活动日期；共享模型只使用你再次明确公开的本方条件。</p>';
  if(results[1].status==='fulfilled'){
    const notes=results[1].value.notes||[];
    if(!notes.length)h+='<div class="notice">还没有关联资料。保存资料后可选择「用于家庭活动」。</div>';
    for(const n of notes){h+='<div class="last-mile-source" data-link-id="'+esc(n.link_id)+'"><b>'+esc(n.source_label||n.provider||'资料')+'</b><div class="sub">发生日期：'+esc(n.happened_on||'未知')+' · 来源：'+esc(n.provider||'未知')+'</div>';
      for(const [k,v] of Object.entries(n.fields||{}))h+='<div>'+esc(k)+'：'+esc(v)+'</div>';
      h+='<p class="notice">'+esc(n.status||'linked')+' · '+(n.used?'当前版本实际采用的公开条件来源':'已关联，尚未被当前共同方案采用')+'</p>';
      if(n.replacement_event_id)h+='<button class="btn ghost" data-note-plan-event="'+esc(n.replacement_event_id)+'" data-note-plan-target="'+esc(planId)+'" data-replace-link="'+esc(n.link_id)+'">核对更正后的资料</button>';
      if(['active','linked','stale','used'].includes(n.status||'active')){
        h+='<div class="last-mile-actions"><button class="btn ghost" data-note-plan-event="'+esc(n.event_id)+'" data-note-plan-target="'+esc(planId)+'">核对并公开条件</button><button class="btn ghost" data-note-correct="'+esc(n.event_id)+'" data-plan="'+esc(planId)+'" data-link="'+esc(n.link_id)+'">更正所选字段</button><button class="btn ghost" data-note-revoke="'+esc(n.event_id)+'" data-plan="'+esc(planId)+'">撤回源资料</button><button class="btn ghost" data-note-unlink="'+esc(n.event_id)+'" data-plan="'+esc(planId)+'">解除本事项关联</button></div>';
      }h+='</div>';
    }
  }else h+='<p class="sub">资料来源未读取：'+esc(results[1].reason.message)+'</p>';
  h+='<div id="last-mile-status" class="last-mile-error" role="status" aria-live="polite"></div>';box.innerHTML=h;
}
async function openNotePlanLink(eventId, target='', replace=''){
  const [source,choices]=await Promise.all([api('/api/note/'+encodeURIComponent(eventId)+'/fields'),api('/api/note/linkable-plans')]);
  notePlanDraft={eventId,target,replace,source,choices:choices.plans||[],selected:[]};renderNotePlanLink();
}
function renderNotePlanLink(){const d=notePlanDraft,s=d.source;
  let h='<h2 id="sheet-title">资料用于家庭活动</h2><p class="sub">第一步只保存本人私有来源引用，不把正文或图片给其他家庭，不自动送共同模型。</p><p>来源：'+esc(s.provider||'未知')+' · 发生日期：'+esc(s.happened_on||'未知')+'</p><div class="notice">默认没有选字段。发生日期不是活动日期；纯图片可只关联来源，不再识别。</div>';
  for(const [k,v] of Object.entries(s.fields||{}))h+='<label class="last-mile-check"><input type="checkbox" data-note-field="'+esc(k)+'"><span><b>'+esc(k)+'</b>：'+esc(v)+'</span></label>';
  h+='<label class="last-mile-field">用于哪件家庭活动<select id="note-plan-choice"><option value="">新建家庭活动并关联</option>';
  for(const p of d.choices)h+='<option value="'+esc(p.plan_id)+'" '+(p.plan_id===d.target?'selected':'')+'>'+esc(p.title||p.utterance||'家庭活动')+'</option>';
  h+='</select></label><label class="last-mile-field" id="note-plan-new-label">新事项标题<input id="note-plan-title" value="家庭活动准备" maxlength="200"></label><div id="note-plan-error" class="last-mile-error" role="alert" aria-live="polite"></div><button class="btn primary" id="note-plan-link">关联所选资料</button><button class="btn ghost" data-close-sheet>稍后再用</button>';
  $('sheet-body').innerHTML=h;$('sheet').classList.add('open');
  const choice=$('note-plan-choice');function mode(){$('note-plan-new-label').hidden=!!choice.value;}choice.onchange=mode;mode();
  $('note-plan-link').onclick=async()=>{const b=$('note-plan-link');if(b.disabled)return;const selected=[...document.querySelectorAll('[data-note-field]:checked')].map(x=>x.dataset.noteField),planId=choice.value,title=$('note-plan-title').value.trim();if(!planId&&!title){$('note-plan-error').textContent='请给新事项写个标题；资料不用重录。';return;}b.disabled=true;b.textContent='正在关联…';try{const body={event_id:d.eventId,selected_fields:selected,public_conditions:{},publish_confirmed:false};if(d.replace)body.replace_link_id=d.replace;
    const r=await post(planId?'/api/note/link-plan':'/api/plan/create-with-note',planId?{...body,plan_id:planId}:{...body,title});d.target=planId||r.plan_id||r.plan?.plan_id;if(!d.target)throw new Error('服务没有返回同一事项编号，请核实关联结果');d.selected=selected;d.replace='';renderNotePlanPublish();renderSidePlans();
  }catch(e){$('note-plan-error').textContent='未关联：'+e.message+'。原文与选择保留，可重试。';b.disabled=false;b.textContent='关联所选资料';}};
}
function renderNotePlanPublish(){const d=notePlanDraft;
  let h='<h2 id="sheet-title">已关联，还未公开</h2><p class="notice">第二步可把你核对过的值作为本次公开条件。其他家庭可见，只公开下面明确选中的条件；不公开私有原文、图片或全部来源，不新增长期分享授权。</p><p class="sub">所选私有字段：'+esc(d.selected.join('、')||'仅来源')+'。活动日期需另核，不能套用发生日期。</p>';
  h+='<p class="sub">只能选择本次已选字段中的原值，不把正文偷偷拆改成条件。要改时间或地点，先更正源字段再重新核对。</p>';
  const values=d.selected.filter(k=>k!=='正文'&&String(d.source.fields?.[k]??'').length<=500).map(k=>({key:k,value:String(d.source.fields?.[k]??'')}));if(!values.length)h+='<div class="notice">所选只有私有正文或无短字段，不能拿全文当时间或地点。先回事项更正具体字段，再核对是否公开。</div>';
  for(const key of PLAN_KEYS){h+='<label class="last-mile-check"><input type="checkbox" data-public-key="'+esc(key)+'"><span>公开为「'+esc(key)+'」</span></label><label class="last-mile-field">选择已核对的源字段<select data-public-value="'+esc(key)+'"><option value="">不公开</option>';for(const v of values)h+='<option value="'+esc(v.value)+'">'+esc(v.key)+'：'+esc(v.value)+'</option>';h+='</select></label>';}
  h+='<label class="last-mile-check"><input type="checkbox" id="publish-confirm"><span>我已核对这些值，同意本事项其他家庭可见</span></label><div id="note-plan-error" class="last-mile-error" role="alert"></div><button class="btn primary" id="note-plan-publish">确认公开本方条件</button><button class="btn ghost" data-plan-reopen="'+esc(d.target)+'">暂不公开，回到事项</button>';
  $('sheet-body').innerHTML=h;
  $('note-plan-publish').onclick=async()=>{const conds={};document.querySelectorAll('[data-public-key]:checked').forEach(e=>{const x=[...document.querySelectorAll('[data-public-value]')].find(v=>v.dataset.publicValue===e.dataset.publicKey);if(x?.value.trim())conds[e.dataset.publicKey]=x.value.trim();});if(!Object.keys(conds).length||!$('publish-confirm').checked){$('note-plan-error').textContent='请选择具体公开条件并勾选确认；不勾选就不会公开。';return;}const b=$('note-plan-publish');b.disabled=true;b.textContent='正在保存…';try{await post('/api/note/link-plan',{event_id:d.eventId,plan_id:d.target,selected_fields:d.selected,public_conditions:conds,publish_confirmed:true});await openPlan(d.target);setStatus('本方条件已公开，是否实际采用请看当前版本来源；需要重排再重新确认。');}catch(e){$('note-plan-error').textContent=e.message+'。输入保留，可重试。';b.disabled=false;b.textContent='确认公开本方条件';}};
}
async function openNoteSourceAction(eventId,planId,linkId,kind){const s=await api('/api/note/'+encodeURIComponent(eventId)+'/fields');
  let h='<h2 id="sheet-title">'+(kind==='correct'?'更正来源字段':'撤回源资料')+'</h2><p class="notice">这会使依赖本资料的未完方案待重排、旧接受失效。已完成历史保留；不会撤销别人已导出的内容。</p>';
  if(kind==='correct'){for(const [k,v] of Object.entries(s.fields||{}))h+='<label class="last-mile-field">'+esc(k)+'<input data-source-edit="'+esc(k)+'" value="'+esc(v)+'" maxlength="2000"></label>';h+='<p class="sub">可核对补一项具体字段，不能把记录日期当活动日期；补字段后仍需重新选中并明确公开。</p><label class="last-mile-field">新增字段名称<input id="source-new-key" maxlength="60" placeholder="时间"></label><label class="last-mile-field">本人核对的值<input id="source-new-value" maxlength="2000" placeholder="周日上午"></label>';}
  h+='<label class="last-mile-check"><input type="checkbox" id="source-confirm"><span>确认'+(kind==='correct'?'保存更正，随后重新核对引用与公开条件':'撤回源资料，不再用于未完方案')+'</span></label><div id="note-plan-error" class="last-mile-error" role="alert"></div><button class="btn primary" id="source-action">确认'+(kind==='correct'?'更正':'撤回')+'</button><button class="btn ghost" data-plan-reopen="'+esc(planId)+'">返回事项</button>';$('sheet-body').innerHTML=h;$('sheet').classList.add('open');
  $('source-action').onclick=async()=>{if(!$('source-confirm').checked){$('note-plan-error').textContent='请勾选确认；未确认不改变源资料。';return;}const b=$('source-action');b.disabled=true;b.textContent='正在处理…';try{const payload={};document.querySelectorAll('[data-source-edit]').forEach(x=>payload[x.dataset.sourceEdit]=x.value);if(kind==='correct'&&$('source-new-key').value.trim()){const key=$('source-new-key').value.trim(),value=$('source-new-value').value.trim();if(!value)throw new Error('新增字段须有核对值');payload[key]=value;}const r=await post('/api/life-events/'+eventId+'/'+kind,kind==='correct'?{payload}:{ });if(kind==='correct')await openNotePlanLink(r.new_event_id,planId,linkId);else await openPlan(planId);}catch(e){$('note-plan-error').textContent=e.message;b.disabled=false;b.textContent='重试';}};
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-note-plan-event],[data-invite-create],[data-invite-approve],[data-invite-revoke],[data-note-correct],[data-note-revoke],[data-note-unlink]');if(!b||b.disabled)return;b.disabled=true;const prior=b.textContent;try{
  if(b.dataset.notePlanEvent){await openNotePlanLink(b.dataset.notePlanEvent,b.dataset.notePlanTarget||'',b.dataset.replaceLink||'');return;}
  const planId=b.dataset.plan||b.dataset.inviteCreate;
  if(b.dataset.inviteCreate){const r=await post('/api/plan/'+planId+'/invitations',{label:$('invite-label').value.trim()||'来宾一家'});const u=new URL(r.participate_url,location.origin);if(u.origin!==location.origin||u.pathname!=='/static/participate.html'||!u.hash.startsWith('#token='))throw new Error('服务返回的参与地址不符合安全格式');$('invite-copy').innerHTML='<label class="last-mile-field">单次邀请（到期 '+esc(r.expires_at)+'）<textarea id="invite-url" readonly></textarea></label><button class="btn ghost" id="copy-invite">复制邀请</button><p class="sub">只复制，不自动发出。接收后链接单用失效；请在另一个浏览器打开。</p>';$('invite-url').value=u.href;$('copy-invite').onclick=async()=>{try{await navigator.clipboard.writeText(u.href);$('copy-invite').textContent='已复制';}catch{$('invite-url').select();setStatus('浏览器不允许自动复制，请手动复制所选邀请。');}};}
  else if(b.dataset.inviteApprove){const slot=[...document.querySelectorAll('[data-invite-slot]')].find(x=>x.dataset.inviteSlot===b.dataset.inviteApprove);await post('/api/plan/'+planId+'/invitations/'+b.dataset.inviteApprove+'/approve',{replace_participant_id:slot?.value||''});await openPlan(planId);}
  else if(b.dataset.inviteRevoke){if(!confirm('撤回这次邀请及已接收者的事项访问？未完约定需重核，不能撤销已导出的内容。'))return;await post('/api/plan/'+planId+'/invitations/'+b.dataset.inviteRevoke+'/revoke',{});await openPlan(planId);}
  else if(b.dataset.noteCorrect)await openNoteSourceAction(b.dataset.noteCorrect,planId,b.dataset.link,'correct');
  else if(b.dataset.noteRevoke)await openNoteSourceAction(b.dataset.noteRevoke,planId,'','revoke');
  else if(b.dataset.noteUnlink){if(!confirm('解除这条资料与本事项的关联？方案需重排，源资料保留。'))return;await post('/api/note/unlink-plan',{event_id:b.dataset.noteUnlink,plan_id:planId});await openPlan(planId);}
}catch(err){const box=$('last-mile-status');if(box)box.textContent=err.message;setStatus('未完成：'+err.message);}finally{if(b.isConnected){b.disabled=false;b.textContent=prior;}}});
</script>
