<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小助理">
<meta name="mobile-web-app-capable" content="yes">
<title>小助理</title>
<style>
/* Hallmark · macrostructure: Conversation-first workspace · tone: quiet domestic
 * anchor hue: warm sand oklch(72% 0.03 78) · paper oklch(97% 0.008 85)
 * states: default · hover · focus-visible · active · disabled · loading · error · success
 * in-place t19 refinement; measured contrast and viewport results live in task evidence
 */
:root{
  --paper: #f7f6f3;
  --paper-2: oklch(96% 0.008 85);
  --surface: oklch(99% 0.004 85);
  --ink: oklch(24% 0.012 75);
  --ink-2: oklch(42% 0.014 75);
  --ink-3: oklch(46% 0.012 75);
  --line: oklch(90% 0.008 85);
  --line-2: oklch(86% 0.01 82);
  --accent: #34463f;
  --accent-ink: #f7f6f3;
  --me-soft: oklch(93% 0.008 85);
  --field-line: oklch(57% 0.014 85);
  --focus: oklch(43% 0.06 155);
  --overlay: oklch(24% 0.012 75 / .30);
  --accent-soft: oklch(94% 0.03 155);
  --wait: oklch(52% 0.09 60);
  --wait-soft: oklch(95% 0.04 75);
  --bad: oklch(48% 0.13 25);
  --bad-soft: oklch(95% 0.04 25);
  --sim: oklch(48% 0.08 250);
  --sim-soft: oklch(95% 0.025 250);
  --radius: 14px;
  --radius-s: 10px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 28px;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 180ms;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:clip}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* ---------- 手机优先的单栏会话 ---------- */
.app{
  max-width:520px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;background:var(--paper);
  position:relative;
}
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:var(--space-3);
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--space-4) 10px;
  background:var(--paper);
  border-bottom:1px solid var(--line);
}
.avatar{
  width:36px;height:36px;border-radius:50%;flex:none;
  background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:15px;font-weight:600;
}
.topbar .who{flex:1;min-width:0}
.topbar .who b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.topbar .who span{display:block;font-size:12px;color:var(--ink-3);line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:44px;height:44px;flex:none;border:1px solid transparent;background:transparent;
  border-radius:10px;display:grid;place-items:center;cursor:pointer;
  font-size:15px;color:var(--ink-2);transition:background var(--dur) var(--ease-out);
}
@media (hover:hover){.iconbtn:hover{background:var(--paper-2)}}
.iconbtn:active{transform:translateY(1px)}

.stream{
  flex:1;padding:20px var(--space-4) 28px;
  display:flex;flex-direction:column;gap:14px;
}
.msg{max-width:92%;min-width:0;display:flex;flex-direction:column;gap:6px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.pa{align-self:flex-start;align-items:flex-start}
.bubble{
  padding:12px 14px;border-radius:12px;font-size:16px;line-height:1.65;
  overflow-wrap:anywhere;white-space:pre-wrap;
}
.msg.me .bubble{background:var(--me-soft);color:var(--ink);border:0;border-bottom-right-radius:4px}
.msg.pa .bubble{background:transparent;color:var(--ink);border:0;padding:2px 0}
.msg .meta{font-size:12px;color:var(--ink-3);padding:0 2px}
.msg.me::before{content:"我";font-size:12px;color:var(--ink-3);padding-right:2px}
.msg.pa:has(.bubble)::before{content:"小助手";font-size:12px;color:var(--accent);font-weight:600}

.daymark{align-self:center;font-size:11.5px;color:var(--ink-3);
  background:transparent;border:0;
  padding:2px 0;border-radius:0;margin:var(--space-2) 0}

/* ---------- 事项卡：嵌入消息流 ---------- */
.matter{
  align-self:stretch;max-width:100%;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);
  padding:var(--space-4);
}
.matter h3{margin:0 0 var(--space-1);font-size:16px;font-weight:600;font-style:normal;
  display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.matter .subject{font-size:12.5px;color:var(--ink-2);margin-bottom:var(--space-3)}
.state{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;
  padding:2px 9px;border-radius:20px;white-space:nowrap}
.state.wait{background:var(--wait-soft);color:var(--wait)}
.state.ok{background:var(--accent-soft);color:var(--accent)}
.state.bad{background:var(--bad-soft);color:var(--bad)}
.state.sim{background:var(--sim-soft);color:var(--sim)}
.state.neutral{background:var(--paper-2);color:var(--ink-2)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.dot.pulse{animation:pulse 1.4s var(--ease-out) infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

.matter dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:var(--space-1) var(--space-3);
  font-size:13.5px}
.matter dt{color:var(--ink-3);white-space:nowrap}
.matter dd{margin:0;min-width:0;overflow-wrap:anywhere}

.factlist{margin:var(--space-3) 0 0;padding:0;list-style:none;display:flex;
  flex-direction:column;gap:var(--space-2)}
.factlist li{font-size:12.5px;color:var(--ink-2);padding-left:14px;position:relative;line-height:1.55}
.factlist li::before{content:"";position:absolute;left:2px;top:8px;width:4px;height:4px;
  border-radius:50%;background:var(--line-2)}
.factlist .src{color:var(--ink-3);font-size:11.5px}
.factlist .stale{color:var(--ink-3);text-decoration:line-through}

.acts{margin-top:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.btn{
  width:100%;padding:12px 16px;border-radius:var(--radius-s);border:1px solid var(--line-2);
  background:var(--surface);cursor:pointer;font-size:14.5px;font-weight:500;
  transition:background var(--dur) var(--ease-out),transform var(--dur) var(--ease-out);
  min-height:44px;
}
@media (hover:hover){.btn:hover{background:var(--paper-2)}}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (hover:hover){.btn.primary:hover{background:color-mix(in oklab, var(--accent) 88%, black)}}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.loading{position:relative;padding-right:40px}
.btn.loading:not(.primary){color:var(--ink)}
.btn.loading::after{content:"";position:absolute;right:14px;top:calc(50% - 8px);width:16px;height:16px;
  border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite}
.btn.ghost.loading::after{border-color:var(--line-2);border-top-color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}

.receipt{margin-top:var(--space-3);padding:var(--space-3);border-radius:var(--radius-s);
  background:var(--sim-soft);font-size:13px;color:var(--sim);line-height:1.6}
.receipt b{font-weight:600}

.negotiation{margin-top:var(--space-3);border-top:1px solid var(--line);padding-top:var(--space-3)}
details summary{cursor:pointer;font-size:14px;min-height:44px;color:var(--ink-2);list-style:none;
  display:flex;align-items:center;gap:6px;padding:4px 0}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"›";font-size:14px;color:var(--ink-3);
  transition:transform var(--dur) var(--ease-out)}
details[open] summary::before{transform:rotate(90deg)}
.nlog{margin-top:var(--space-2);display:flex;flex-direction:column;gap:var(--space-2)}
.nlog .row{font-size:14px;line-height:1.65;padding:6px 0;border:0;color:var(--ink-2)}
.nlog .row b{font-weight:600}
.nlog .row.you b{color:var(--accent)}
.nlog .row.them b{color:var(--ink)}
.nlog .row.sys b{color:var(--wait)}

/* ---------- 底部输入 ---------- */
/* 对话输入区的附件入口（t61）：「+」挂在输入框下边缘，麦克风在发送箭头左边。
   都不挤占打字宽度——「+」是小圆钮压在边框上，麦克风只比箭头宽一点。 */
/* 「+」挂在输入框的下边缘、靠左，压在边框上：它是「挂在这个输入框上的附加动作」，
   不占打字宽度。绝对定位到 composer（sticky 本身就是定位祖先），
   文本框相应留出左侧内边距，字不会钻到按钮底下。 */
.composer .attach{
  position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  z-index:5;width:32px;height:32px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  font-size:19px;line-height:1;cursor:pointer;padding:0}
.composer .mic{
  flex:0 0 auto;width:38px;height:38px;margin-bottom:4px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  font-size:15px;line-height:1;cursor:pointer;padding:0}
.composer .attach[aria-expanded="true"]{background:var(--accent-soft);
  border-color:var(--accent);color:var(--ink)}
/* 预留设备占位（t67/t68）：虚线框 + 「建设中／未接入」标，无可点按钮。
   做成能点的样子会让人以为硬件已打通——问卷提交后不能改，所以一眼就要看出是预告。 */
.reserved-tag{font-size:11.5px;color:var(--ink-3);border:1px solid var(--line-2);
  border-radius:999px;padding:2px 8px;margin-left:8px;white-space:nowrap}
.reserved-item{display:block;padding:10px 12px;border:1px dashed var(--line-2);
  border-radius:10px;margin-top:8px;background:var(--paper-2)}
.reserved-item b{display:block;font-size:14px;color:var(--ink);margin-bottom:3px}
.reserved-item span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.55}
/* 附件面板：绝对定位在「+」上方，避免把输入框顶下去；
   max-height + overflow 保证窄屏也不溢出。 */
.attach-panel{position:absolute;left:var(--space-4);bottom:calc(100% + 8px);
  z-index:30;display:flex;flex-direction:column;gap:6px;min-width:220px;
  max-width:calc(100vw - 2 * var(--space-4));max-height:60vh;overflow:auto;
  padding:8px;border:1px solid var(--line-2);border-radius:12px;
  background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.attach-panel[hidden]{display:none}
.attach-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  width:100%;padding:8px 10px;border:1px solid transparent;border-radius:8px;
  background:transparent;cursor:pointer;text-align:left;font-family:inherit}
.attach-item b{font-size:14px;color:var(--ink)}
.attach-item span{font-size:12px;color:var(--ink-3)}
.attach-item:hover{background:var(--paper-2)}
.chat-drafts{display:flex;gap:var(--space-2);flex-wrap:wrap;
  padding:var(--space-2) var(--space-4) 0}
.chat-drafts:empty{display:none}
.chat-draft{position:relative;border:1px solid var(--line-2);border-radius:10px;
  padding:4px;background:var(--surface);max-width:120px}
.chat-draft img,.chat-draft video{width:104px;height:104px;object-fit:cover;
  border-radius:6px;display:block}
.chat-draft .rm{position:absolute;top:-8px;right:-8px;width:24px;height:24px;
  border-radius:999px;border:1px solid var(--line-2);background:var(--surface);
  cursor:pointer;font-size:13px;line-height:1;padding:0}
.chat-draft .tag{display:block;font-size:11px;color:var(--ink-3);
  text-align:center;margin-top:2px;max-width:104px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.chat-hint{padding:var(--space-1) var(--space-4) 0;min-height:18px}
.chat-hint:empty{min-height:0}
.chat-pick{padding:0 var(--space-4)}
.chat-pick:empty{display:none}
.composer{
  position:sticky;bottom:0;z-index:20;
  padding:var(--space-2) var(--space-4) calc(env(safe-area-inset-bottom,0px) + var(--space-2));
  background:var(--paper);
  border-top:1px solid var(--line);
  display:flex;gap:var(--space-2);align-items:flex-end;
}
.composer textarea{
  flex:1;min-width:0;resize:none;border:1px solid var(--field-line);border-radius:12px;
  /* 左下角压着「+」，留出左侧内边距免得字钻到按钮底下。 */
  padding:11px 14px 11px 46px;font:inherit;font-size:16px;line-height:1.5;background:var(--surface);
  max-height:132px;min-height:44px;
}
.composer textarea::placeholder{color:var(--ink-3)}
.send{
  width:44px;height:44px;flex:none;border:none;border-radius:50%;
  background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;
  font-size:17px;transition:opacity var(--dur) var(--ease-out);
}
.send[disabled]{opacity:.4;cursor:not-allowed}
.send:not([disabled]):active{transform:scale(.94)}
.quick{display:flex;gap:var(--space-2);padding:0 var(--space-4) var(--space-2);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.quick::-webkit-scrollbar{display:none}
.quick button{
  flex:none;padding:6px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--surface);font-size:12.5px;color:var(--ink-2);cursor:pointer;
  white-space:nowrap;min-height:44px;
}
@media (hover:hover){.quick button:hover{background:var(--paper-2)}}

/* ---------- 覆盖层：人物详情 / 演示菜单 ---------- */
.sheet{
  /* z-index 必须高于侧栏（手机上 .side 是 50），否则从侧栏点开人物时，
     详情被侧栏压在下面，肉眼只看到侧栏。 */
  position:fixed;inset:0;z-index:60;display:none;
  background:var(--overlay);
}
.sheet.open{display:block;animation:fade var(--dur) var(--ease-out)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow-y:auto;
  background:var(--surface);border-radius:16px 16px 0 0;
  padding:var(--space-4) var(--space-4) calc(env(safe-area-inset-bottom,0px) + var(--space-5));
  animation:slideup 220ms var(--ease-out);
  max-width:520px;margin:0 auto;
}
@keyframes slideup{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line-2);
  margin:0 auto var(--space-3)}
.sheet h2{margin:0 0 8px;font-size:20px;font-weight:600;font-style:normal}
.sheet .sub{font-size:13px;color:var(--ink-2);margin-bottom:var(--space-4)}
.sheet section{margin-bottom:var(--space-5)}
.sheet section h4{margin:0 0 var(--space-2);font-size:14px;font-weight:600;
  color:var(--ink-3);letter-spacing:.04em;font-style:normal}
.kv{display:flex;flex-direction:column;gap:var(--space-2)}
.kv .item{font-size:15px;line-height:1.65;padding:var(--space-2) 0;
  background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0}
.kv .item .k{font-size:11.5px;color:var(--ink-3);display:block;margin-bottom:1px}
.kv .item .v{overflow-wrap:anywhere}
.kv .item .prov{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.kv .item.old{opacity:.62}
.kv .item.old .v{text-decoration:line-through}
.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;
  background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);margin:0 6px 6px 0}
.chip.btn-chip{cursor:pointer}
@media (hover:hover){.chip.btn-chip:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}}
/* 裁剪预览。四角的把手要大：手机上手指点不中小块，
   用户反复点不中就会以为这个功能没做。 */
.crop{position:relative;background:var(--ink);border-radius:var(--radius-s);
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.crop img{display:block;width:100%;height:auto;pointer-events:none}
.crop .mask{position:absolute;background:rgba(20,18,15,.55)}
.crop .box{position:absolute;border:1.5px solid #fff;box-sizing:border-box}
.crop .h{position:absolute;width:26px;height:26px;border:2.5px solid #fff;
  background:rgba(20,18,15,.18)}
.crop .h.tl{left:-3px;top:-3px;border-right:0;border-bottom:0}
.crop .h.tr{right:-3px;top:-3px;border-left:0;border-bottom:0}
.crop .h.bl{left:-3px;bottom:-3px;border-right:0;border-top:0}
.crop .h.br{right:-3px;bottom:-3px;border-left:0;border-top:0}
.crumb{margin-bottom:var(--space-3)}
.crumb .btn{width:100%}
.wait-item{font-size:13px;line-height:1.6;padding:var(--space-3);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);
  margin-bottom:var(--space-2);cursor:pointer;text-align:left;width:100%;display:block}
@media (hover:hover){.wait-item:hover{border-color:var(--accent)}}
.wait-item .w-k{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:5px}
.wait-item .w-since{font-size:11.5px;color:var(--ink-3)}
.wait-item .w-q{font-size:12.5px;color:var(--ink-2)}
/* 事项角标：类型(单人/几家)与状态(待确认/已约定待开始/已完成)分两枚，
   一眼看出是不是多人参与、现在卡在哪，不用读完整句话。 */
.m-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.m-badge{font-size:11.5px;line-height:1.6;padding:1px 8px;border-radius:999px;
  border:1px solid var(--line-2);color:var(--ink-3);background:var(--surface);white-space:nowrap}
.m-badge.multi{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.m-badge.st-wait{color:var(--ink-2)}
.m-badge.st-done{color:var(--ink-3)}
.m-badge.st-live{border-color:var(--accent);color:var(--accent)}
.m-sub{margin-top:5px;font-size:12px;color:var(--ink-3)}
/* 事项和共同事项的条目。和 .wait-item 同一套写法，且必须放在媒体查询之外：
   之前它只写在桌面端的 @media(min-width:900px) 里，手机宽度下整条规则
   不生效，button 退回浏览器默认样式——灰底 #EFEFEF、2px 黑边，
   在一片浅色界面里格外突出，看着就像「这些条目被单独标了出来」。
   现在两个宽度下都是同一副样子：无底色、细边框、文字用正文色。 */
.matter-item{font-size:13px;line-height:1.6;padding:var(--space-3);
  background:transparent;border:1px solid var(--line);border-radius:var(--radius-s);
  margin-bottom:var(--space-2);cursor:pointer;text-align:left;width:100%;
  display:block;color:var(--ink)}
@media (hover:hover){.matter-item:hover{border-color:var(--accent)}}
.matter-item .st{margin-top:4px}

.demo-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-3) 0;border-bottom:1px solid var(--line);font-size:14px}
.demo-row:last-child{border-bottom:none}
.demo-row .lbl{color:var(--ink-2)}
.demo-row select,.demo-row input{
  font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--field-line);
  border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%;min-height:44px;
}

<script>
const $ = (id) => document.getElementById(id);
const stream = $("stream");

let currentTask = null;      // 当前打开的事项
let busy = false;
// 身份只来自服务端会话：打开页面时问一次 /api/me，之后所有请求都由服务端
// 决定我是谁。这里不存身份，也不提供「切换成家长/朋友」的入口——
// 产品里只有本人一个身份，选送礼对象只是选事项对象，不是换登录人。
let ownerId = "";            // 本人身份，由 /api/me 填入
let meName = "我";           // 本人的称呼，界面上用
let personStack = [];        // 关系链点开的路径，用来「返回上一层」
let lastPersons = [];        // 最近一次侧栏拿到的人物，拍照选主体时直接用
let lastPlans = [];          // 最近一次拿到的共同事项，首屏「需要你处理」用同一份

const STAGE_TEXT = {
  created:        {t: "已记下", cls: "neutral"},
  negotiating:    {t: "正在核实", cls: "wait"},
  agreed:         {t: "方案已约定，等你确认", cls: "ok"},
  counter_pending:{t: "对方提了新方案，需要你定", cls: "wait"},
  purchased:      {t: "模拟订单已登记", cls: "sim"},
  conflict:       {t: "暂时没办成", cls: "bad"},
  failed:         {t: "暂时没办成", cls: "bad"},
  blocked:        {t: "需要你补充一句", cls: "wait"},
  // 记录刚被更正，旧方案已作废：给出重新协商的入口，不要让用户另开一件事。
  needs_renegotiation: {t: "记录已更正，重新协商", cls: "wait"},
  model_failed:   {t: "刚才没连上，可以重试", cls: "bad"},
};
const stageText = (s) => STAGE_TEXT[s] || {t: s, cls: "neutral"};

/* 关系代码翻成中文，界面不出现 friend 这类英文键。 */
const RELATION_TEXT = {
  self: "我", friend: "朋友", friend_child: "朋友的孩子",
  friend_spouse: "朋友的配偶", spouse: "配偶", own_child: "我的孩子",
  family: "亲属", colleague: "同事", former_colleague: "前同事",
  classmate: "同学", neighbor: "邻居", teacher: "老师", other: "其他",
};
const relationText = (r) => RELATION_TEXT[r] || r || "我记录的人";

/* 把任何错误原因收成一句能给人看的话。

服务端返回的错误原因不一定都是字符串：detail 可能是数组、可能是对象，
插件那边的 error.message 也可能不是字符串。直接 new Error(它) 的话，
err.message 就是 "[object Object]"，用户看到的是乱码而不是
「配对码已过期，请重新生成」。这里统一收成字符串，宁可不具体，
也不能把内部结构摊给用户。
*/
function errText(raw){
  if(raw == null) return "";
  if(typeof raw === "string") return raw.trim();
  if(typeof raw === "number" || typeof raw === "boolean") return String(raw);
  if(Array.isArray(raw)){
    const parts = raw.map((d) => {
      if(d == null) return "";
      if(typeof d === "string") return d.trim();
      if(typeof d === "object"){
        const where = d.loc ? d.loc[d.loc.length - 1] : "";
        const body = d.msg || d.message || "";
        if(typeof body === "string" && body.trim()){
          return where ? where + "：" + body.trim() : body.trim();
        }
      }
      return "";
    }).filter(Boolean);
    return parts.join("；");
  }
  if(typeof raw === "object"){
    const body = raw.msg || raw.message || raw.detail;
    if(typeof body === "string" && body.trim()) return body.trim();
    // 递归一层：detail 里再套对象时还能取出人话。
    if(body && typeof body === "object") return errText(body);
    return "";
  }
  return "";
}

async function api(path, opts){
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if(!r.ok){
    // 普通接口用 detail，插件接口用 {error:{code,message}}。
    // 只读 detail 的话，插件那边返回的错误对象会被拼成 [object Object]，
    // 用户看到的是乱码而不是「配对码过期了，请重新生成」。
    // 两处都取，谁有内容用谁。
    // detail 还可能是数组：FastAPI 的 422 校验错误就是 [{type,loc,msg}]，
    // 直接拼进字符串同样得到 [object Object]。按 msg 字段拼成人话，
    // 并说清是哪个字段，用户才知道该改什么。
    // 形态全部交给 errText 收：detail 可能是数组、对象或字符串，
    // 插件那边是 {error:{code,message}}。不在这里预先 JSON.stringify——
    // 那会把 {"code":...} 这样的内部结构直接摊给用户看。
    const fromError = data && data.error && data.error.message;
    const msg = errText(fromError) || errText(data && data.detail)
      || ("HTTP " + r.status);
    const err = new Error(msg);
    err.status = r.status;
    err.code = (data && data.error && data.error.code) || "";
    throw err;
  }
  return data;
}
const post = (path, body) => api(path, {
  method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify(body),
});
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- 渲染消息流 ---------- */
function bubble(role, text, meta){
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = '<div class="bubble">' + esc(text) + '</div>'
    + (meta ? '<div class="meta">' + esc(meta) + '</div>' : "");
  return el;
}

function factItem(f){
  const stale = f.status !== "active";
  return '<li class="' + (stale ? "stale-wrap" : "") + '">'
    + '<span class="' + (stale ? "stale" : "") + '">'
    + esc(f.attribute) + '：' + esc(f.value) + '</span>'
    + '<span class="src"> · ' + esc(f.provider) + ' · ' + esc(f.observed_on)
    + (stale ? ' · 已被更正' : '') + '</span></li>';
}

// 订单走到哪一步，以及下一步能点什么。
// 用户只需要付一次钱。发货、物流、送达由系统在支付后自己接着更新，
// 不给按钮：让用户去点「发货」「确认送达」是让用户伺候系统，
// 真实电商里这两步本来就是平台和物流自己走的。
// 全程本地模拟，界面上一直挂着这句说明，不让人误以为真买了、真送了。
const ORDER_STEPS = [
  {state: "purchased", label: "已登记"},
  {state: "paid",      label: "已支付（模拟）"},
  {state: "shipped",   label: "已发货（模拟）"},
  {state: "delivered", label: "已送达（模拟）"},
];

function orderBlock(m, o){
  let h = '<div class="receipt">';
  h += esc(o.state === "purchased" ? "模拟订单已登记" : "订单 · " + orderLabel(o.state))
     + '<br>单号 <b>' + esc(o.order_id) + '</b>'
     + ' · ' + esc(o.product_name) + (o.spec ? ' · ' + esc(o.spec) : '')
     + ' · ' + esc(o.amount_cny) + ' 元';
  if(o.ship_no) h += '<br>物流单号 ' + esc(o.ship_no);
  if(o.paid_at) h += '<br>支付时间 ' + esc(o.paid_at.slice(0, 16).replace("T", " "));
  if(o.shipped_at) h += '<br>发货时间 ' + esc(o.shipped_at.slice(0, 16).replace("T", " "));
  if(o.delivered_at) h += '<br>送达时间 ' + esc(o.delivered_at.slice(0, 16).replace("T", " "));
  // 说清物流状态是谁更新的：系统跟着支付记录自动往下走，
  // 不是用户点的，也不声称接了真实电商平台。
  if(o.state !== "purchased"){
    h += '<br><span style="opacity:.8">物流状态由系统跟着支付记录自动更新，'
       + '本地模拟登记，未连接真实电商平台。</span>';
  }
  h += '<br><span style="opacity:.8">本地模拟登记，未发生真实购买或配送。</span></div>';
  const next = orderNext(o.state);
  if(next) h += '<button class="btn primary" data-act="order-' + next.act + '" data-task="'
     + esc(m.task_id) + '" data-order="' + esc(o.order_id) + '">' + esc(next.label) + '</button>';
  return h;
}

// 商品详情：演示数据里没有商品图片，所以不摆占位图。
// 摊开真正会改变决策的属性：价格、适龄、要不要尺码、是否发声、是否便于收纳，
// 以及这一件在当前事项下逐项过不过得了硬条件。这些比一张图有用。
/* 代填回执弹层：把插件实际填进页面的值和服务端复核结果逐字段列出来。

   页面读回值（observed_fields）是本人判断「这个 verified 是不是真的」的
   唯一依据，所以每个字段都同时显示期望值和实际读回值；不一致的地方
   明确标出来，不用一个总体状态含糊过去。
*/
// 协议键翻成中文给本人看，内部 ID 原样保留在标题行里便于核对。
// 直接把 sku / filled 摊给用户，等于让他自己猜「filled 是不是填好了」。
const RECEIPT_FIELD_LABELS = {
  // sku 的值是演示商店里的商品编码（如 pr_draw_set），不是能读懂的商品名。
  // 标签写成「商品编码」，用户才知道这是编码而不是漏显示名称。
  sku: "商品编码", quantity: "数量", size: "尺码", color: "颜色",
  recipient_name: "收货人", recipient_phone: "收货电话",
  delivery_address: "收货地址",
};
const RECEIPT_CLIENT_LABELS = {
  filled: "已代填", partial: "部分完成", failed: "失败",
};

function openReceiptSheet(taskId, receipts){
  let h = '<h2 id="sheet-title">代填回执</h2>';
  if(!receipts.length){
    h += '<div class="notice">这件事还没有代填回执。</div>';
  }
  const stateText = {
    // partial 不能说成「有字段不一致」：它也可能是页面自己判定库存不足、
    // 拒绝开放提交，那时字段其实对得上。文案要和卡片上的表述对齐，
    // 不一致会让本人以为两处说的是两件事。
    // verified 也一样要说清它证明的是「那一趟核对通过」，不是当前还能提交：
    // 授权或方案后来变过，旧 receipt 的 status 不会被改写。
    verified: "最近一次已完成代填，请核对当前方案与页面",
    partial: "部分完成，请核对页面提示",
    failed: "代填失败", stale: "已失效",
  };
  for(const r of receipts){
    const label = stateText[r.status] || r.status;
    h += '<div class="receipt" style="margin-top:10px">'
       + '<b>' + esc(label) + '</b>'
       + ' · ' + esc(RECEIPT_CLIENT_LABELS[r.client_status] || "插件未报告结果")
       + (r.created_at ? ' · ' + esc(r.created_at.slice(0, 16).replace("T", " ")) : '')
       + '</div>';
    // 页面实际读回值：逐字段列，和参数包期望值一一对应。
    const obs = r.observed_fields || {};
    const keys = Object.keys(obs);
    if(keys.length){
      h += '<div class="kv" style="margin-top:8px">';
      for(const k of keys){
        h += '<div class="item"><span class="k">'
           + esc(RECEIPT_FIELD_LABELS[k] || k) + '</span>'
           + '<span class="v">' + esc(obs[k]) + '</span></div>';
      }
      h += '</div>';
    }
    // 不一致分两种，不能按一种渲染：
    // 1) 参数包本身失效（field 为空，label 是整句原因，如「参数包已过期」）；
    // 2) 页面字段和参数包对不上（有 field、有期望值和实际读回值）。
    // 混成一种就会出现「undefined：页面读回空」这种看不懂的提示。
    if(r.mismatches && r.mismatches.length){
      const reasons = r.mismatches.filter((m) => !m || !m.field);
      const fields = r.mismatches.filter((m) => m && m.field);
      if(reasons.length){
        h += '<div style="margin-top:8px;font-size:13px;color:var(--ink-2)">这份回执为什么没算通过：</div>';
        for(const m of reasons){
          const text = (m && (m.label || m.reason)) || (typeof m === "string" ? m : "");
          if(text) h += '<div class="notice" style="margin-top:6px">' + esc(text) + '</div>';
        }
      }
      if(fields.length){
        h += '<div style="margin-top:8px;font-size:13px;color:var(--ink-2)">对不上的字段：</div>';
        for(const m of fields){
          h += '<div class="notice" style="margin-top:6px">'
             + esc(m.label || RECEIPT_FIELD_LABELS[m.field] || m.field)
             + '：页面读回「' + esc(m.observed || "空")
             + '」，参数包里是「' + esc(m.expected || "空") + '」</div>';
        }
      }
    }
    // 这句话说的是这份记录的性质：回执记录的是页面被填了什么，
    // 不代表已经下单或付款。写成「本地模拟登记」容易被读成
    // 「这次代填是假的」，所以只说它证明了什么、没证明什么。
    h += '<div class="sub" style="margin-top:6px">填到 ' + esc(r.target_origin || "")
       + '。这份回执只说明页面被填了这些值，不代表已下单或已付款。</div>';
  }
  h += '<button class="btn ghost" data-close-sheet style="margin-top:12px">返回</button>';
  $("sheet-body").innerHTML = h;
  $("sheet").classList.add("open");
}

function openProductSheet(d, taskId){
  let h = '<h2 id="sheet-title">' + esc(d.name) + '</h2>';
  h += '<div class="sub">' + esc(d.category_label) + ' · ' + esc(d.price_cny) + ' 元'
     + (d.current ? ' · 就是当前这件' : '') + '</div>';

  h += '<section><h4>这一件怎么样</h4><div class="kv">';
  h += '<div class="item"><span class="k">适龄</span><span class="v">'
     + esc(d.age_hint || "没写") + '</span></div>';
  h += '<div class="item"><span class="k">尺码</span><span class="v">'
     + (d.has_size ? "要选尺码：" + esc(d.size_options.join("、"))
        : "不需要选尺码") + '</span></div>';
  h += '<div class="item"><span class="k">会不会响</span><span class="v">'
     + (d.makes_noise ? "会发声" : "不发声") + '</span></div>';
  h += '<div class="item"><span class="k">好不好收</span><span class="v">'
     + (d.easy_to_store ? "便于收纳" : "不太好收纳") + '</span></div>';
  if(d.note) h += '<div class="item"><span class="k">说明</span><span class="v">'
     + esc(d.note) + '</span></div>';
  h += '</div></section>';

  // 逐项检查：只说「不合格」的话，看不出是查过了还是没查。
  if(d.checks && d.checks.length){
    h += '<section><h4>这个事项查下来</h4><div class="kv">';
    for(const c of d.checks){
      h += '<div class="item"><span class="k">' + esc(c.item) + '</span>'
         + '<span class="v" style="color:' + (c.ok ? "inherit" : "#b3261e") + '">'
         + esc(c.text) + '</span></div>';
    }
    h += '</div></section>';
  }
  if(!d.checks_ok){
    h += '<div class="notice" style="margin-top:12px">这件现在换不过去：'
       + esc((d.problems || []).join("；")) + '</div>';
  }

  // 没有商品图片这件事要说清楚，不摆占位图冒充有图。
  h += '<div class="notice" style="margin-top:12px">' + esc(d.image_note || "") + '</div>';

  // 专门放提示的位置。之前失败时是找第一个 .notice 改它的文字，
  // 那会覆盖掉下面「演示数据没有商品图片」那句说明，用户看不出原因出自哪里。
  h += '<div id="product-sheet-msg" class="notice" style="margin-top:12px;display:none"></div>';
  if(!d.current && d.checks_ok){
    h += '<button class="btn primary" data-act="choose" data-task="' + esc(taskId)
       + '" data-product="' + esc(d.product_id) + '" style="margin-top:12px">'
       + '换成这件</button>';
  }
  h += '<button class="btn ghost" data-close-sheet style="margin-top:12px">返回</button>';
  $("sheet-body").innerHTML = h;
  $("sheet").classList.add("open");
}

function orderLabel(state){
  const s = ORDER_STEPS.find((x) => x.state === state);
  return s ? s.label : state;
}

function orderNext(state){
  // 只剩支付这一个动作。发货、物流、送达由系统在支付后自动更新。
  if(state === "purchased") return {act: "pay", label: "支付（模拟）"};
  return null;
}

// opts.inSheet 表示这张卡正渲染在协商详情弹层里。
// 弹层里不能再放「查看协商详情」：那就是详情本身，放一个进去只会多点一次、
// 而且弹层的监听器认不出这个动作，用户点了完全没有反应。
function matterCard(m, detail, opts){
  opts = opts || {};
  const st = stageText(m.stage);
  let h = '<div class="matter" data-task="' + esc(m.task_id) + '">';
  h += '<h3>' + esc(m.utterance.length > 22 ? m.utterance.slice(0, 22) + "…" : m.utterance)
     + '<span class="state ' + st.cls + '">'
     + (m.stage === "negotiating" ? '<span class="dot pulse"></span>' : '<span class="dot"></span>')
     + esc(st.t) + '</span></h3>';
  h += '<div class="subject">给 ' + esc(m.subject_name || "还没确定的人")
     + (m.budget_max != null ? ' · 预算 ' + esc(m.budget_max) + ' 元' : '') + '</div>';

  if(detail && detail.facts && detail.facts.length){
    h += '<ul class="factlist">' + detail.facts.slice(0, 4).map(factItem).join("") + '</ul>';
  }

  // 这次用了哪些资料。本人点过「用于这件事」才会出现在这里。
  // 列的是来源、日期和正文，不含图片本体：图按 event_id 单独取，
  // 服务端在那里按身份校验，列表里直接塞图等于绕过那道校验。
  // 没有就不渲染这一段——空标题只会让用户以为资料丢了。
  const notes = (detail && detail.linked_notes) || [];
  if(notes.length){
    h += '<dl style="margin-top:12px"><dt>这次用的资料</dt><dd>';
    for(const n of notes){
      const fields = n.fields || {};
      const body = fields["正文"] || "";
      h += '<div style="margin-bottom:8px">'
         + '<div style="font-size:12.5px;color:var(--ink-3)">'
         + esc(n.provider || n.source_label || "资料")
         + (n.happened_on ? ' · ' + esc(n.happened_on) : '')
         + '</div>'
         + (body ? '<div>' + esc(body) + '</div>' : '')
         + (n.attachments && n.attachments.length
            ? '<div style="font-size:12.5px;color:var(--ink-3)">含 '
              + n.attachments.length + ' 张配图</div>' : '')
         + '</div>';
    }
    h += '</dd></dl>';
  }

  const p = m.latest_proposal;
  if(p && (m.stage === "agreed" || m.stage === "counter_pending")){
    h += '<dl style="margin-top:12px">';
    h += '<dt>方案</dt><dd>' + esc(p.reason || "已选定商品") + '</dd>';
    h += '</dl>';
  }
  if(m.stage === "needs_renegotiation"){
    h += '<dl style="margin-top:12px"><dt>为什么变了</dt><dd>'
       + esc(m.outcome || "记录刚被更正，之前的方案依据已变。")
       + '</dd></dl>';
  }
  if(m.stage === "redirected"){
    // 这件事已经按家庭活动重新记下。旧事项不删：原话和当时系统的错误回应
    // 都是历史。这里给一个能点回去的入口，不再提示选送礼对象。
    h += '<dl style="margin-top:12px"><dt>已经改成家庭活动</dt><dd>'
       + esc(m.outcome || "这件事按家庭活动重新记下，原话保留。") + '</dd></dl>';
    if(m.plan_id){
      h += '<div style="margin-top:12px"><button class="btn primary"'
         + ' data-act="open-plan" data-plan="' + esc(m.plan_id) + '">'
         + '打开这件家庭活动</button></div>';
    }
  }
  if(m.stage === "blocked"){
    if(m.group_activity){
      // 这句话是一场多家庭活动，被误当成送礼卡在「选一个对象」。
      // 正确做法是给它一条改成家庭活动的路，而不是摆几个人名让它点一个——
      // 点任何一个都是把「三家一起出游」按成「给某一个孩子准备礼物」。
      h += '<dl style="margin-top:12px"><dt>这件事不是给某一个孩子准备礼物</dt><dd>'
         + '按多家庭活动记更合适：各家自己给条件，不用点一个孩子。</dd></dl>';
      h += '<div style="margin-top:12px"><button class="btn primary"'
         + ' data-act="to-group-activity" data-task="' + esc(m.task_id) + '">'
         + '改成家庭活动</button></div>';
    }else{
      h += '<dl style="margin-top:12px"><dt>要补什么</dt><dd>'
         + esc(m.outcome || "送礼对象") + '</dd></dl>';
      if(m.candidates && m.candidates.length){
        h += '<div style="margin-top:12px"><div style="font-size:12.5px;color:var(--ink-3);'
           + 'margin-bottom:6px">点一个就行</div><div id="cand-' + esc(m.task_id) + '">';
        for(const c of m.candidates){
          h += '<button class="chip btn-chip" data-act="pick-subject" data-task="'
             + esc(m.task_id) + '" data-person="' + esc(c.person_id) + '">'
             + esc(c.name) + (c.relation ? " · " + esc(c.relation) : "") + '</button>';
        }
        h += '</div></div>';
      }
    }
  }
  if(m.outcome && ["conflict","failed","model_failed"].indexOf(m.stage) >= 0){
    h += '<dl style="margin-top:12px"><dt>情况</dt><dd>' + esc(m.outcome) + '</dd></dl>';
  }

  if(m.orders && m.orders.length){
    const o = m.orders[m.orders.length - 1];
    h += orderBlock(m, o);
  }

  // 代填回执入口必须放在订单条件之外：插件代填之后，事项通常还停在
  // 「对方已接受，等你确认」，那时并没有模拟订单。把按钮嵌在 orders 里，
  // 恰好是最需要看回执的那一刻它不出现。
  if(m.receipts && m.receipts.length){
    // 只看最新一条回执，不能 some()：历史上有过 verified、最新已经 partial
    // 或 stale 时，some 仍判「已代填，等你核对后提交」，本人按这句话去提交，
    // 提交的是上一次的参数包，服务端会挡回来，而提示完全指错了方向。
    // receipts 由服务端按 created_at 倒序给，第一条就是最新。
    const latest = m.receipts[0];
    // 每种状态说清它自己的情况，不把 partial 一律说成字段不一致：
    // 页面自己判定库存不足、拒绝开放提交时，字段其实是对得上的。
    const receiptText = {
      // verified 说的是「那一趟核对通过」，不等于当前参数包还能提交。
      // 授权或方案后来变过，旧 receipt 的 status 不会被改写（那是历史事实），
      // 可此时照「等你核对后提交」去提交，服务端会挡回来，提示却指错方向。
      // 所以文案说清它证明的是最近一次已完成代填，当前方案要另外核对。
      verified:  "最近一次已完成代填，请核对当前方案与页面",
      partial:   "部分完成，请核对页面提示",
      failed:    "代填失败，需要重来",
      stale:     "参数包已失效，这份回执不能用来提交",
    };
    h += '<div class="receipt" style="margin-top:10px">'
       + (receiptText[latest.status] || "有代填回执，请查看")
       + '</div>'
       + '<button class="btn ghost" data-act="view-receipts" data-task="'
       + esc(m.task_id) + '" style="margin-top:8px">查看代填回执</button>';
  }

  // 候选商品：模型给的备选，和当前这件并列摆出来。
  // 不摆的话用户看不到「还有什么可选」，换一件也无从下手。
  if(m.product_candidates && m.product_candidates.length > 1){
    h += '<div style="margin-top:12px"><div style="font-size:12.5px;color:var(--ink-3);'
       + 'margin-bottom:6px">还有这些可选：点开看这一件的详情，'
       + '换一件会重新检查预算、重复和品类</div>';
    for(const c of m.product_candidates){
      const mine = m.orders && m.orders.length
        && m.orders[m.orders.length - 1].product_id === c.product_id;
      // 点开是看详情，不再直接换。先看清这件怎么样，再决定换不换，
      // 误点一下就换掉正在买的东西，用户根本来不及反应。
      h += '<button class="chip btn-chip" data-act="view-product" data-task="'
         + esc(m.task_id) + '" data-product="' + esc(c.product_id) + '"'
         + '>'
         + esc(c.product_name) + ' · ' + esc(c.price_cny) + ' 元'
         + (mine ? ' · 就是这件' : '') + ' · 详情</button>';
    }
    h += '</div></div>';
  }

  h += '<div class="acts">';
  if(m.stage === "agreed"){
    h += '<button class="btn primary" data-act="confirm" data-task="' + esc(m.task_id)
       + '" data-prop="' + esc(p ? p.proposal_id : "") + '">确认购买（模拟）</button>';
  }
  if(m.stage === "counter_pending"){
    h += '<button class="btn primary" data-act="accept-confirm" data-task="' + esc(m.task_id)
       + '" data-prop="' + esc(p ? p.proposal_id : "") + '">接受这个方案并确认（模拟）</button>';
    h += '<button class="btn ghost" data-act="retry" data-task="' + esc(m.task_id)
       + '">我再想想</button>';
  }
  if(m.stage === "model_failed" || m.stage === "failed" || m.stage === "conflict"){
    h += '<button class="btn ghost" data-act="retry" data-task="' + esc(m.task_id)
       + '">再试一次</button>';
  }
  if(m.stage === "blocked"){
    h += '<button class="btn ghost" data-act="focus-input">我自己说名字</button>';
  }
  if(m.stage === "needs_renegotiation"){
    // 旧方案已作废。重新协商会接着同一事项办，版本号往后排，不开新任务。
    h += '<button class="btn primary" data-act="renegotiate" data-task="'
       + esc(m.task_id) + '">按新记录重新协商</button>';
  }
  // 从消息流里点已有事项卡，必须能真正打开协商详情：双方实际交换了什么、
  // 现在是谁在等谁。之前这里没有入口，卡片只是状态摘要，用户想看过程只能靠猜。
  // 弹层里不放这个按钮：里面已经是详情，再放一个既重复又点不动。
  if(!opts.inSheet){
    h += '<button class="btn ghost" data-act="view-detail" data-task="'
       + esc(m.task_id) + '">查看协商详情</button>';
  }
  h += '</div>';

  if(detail && detail.messages && detail.messages.length){
    // 弹层里这条沟通记录直接摊开展示，不再收进折叠：用户专门点进来
    // 就是要看过程，再让他多点一次展开等于把入口当成负担。
    h += opts.inSheet
      ? '<div class="negotiation"><div class="nlog">'
      : '<div class="negotiation"><details><summary>查看和对方助理的沟通</summary><div class="nlog">';
    for(const msg of detail.messages){
      const payload = msg.payload || {};
      if(msg.kind === "propose"){
        h += '<div class="row you"><b>我提出</b>：' + esc(payload.proposal ? payload.proposal.reason : "")
           + '</div>';
        if(payload.program_check && !payload.program_check.ok){
          h += '<div class="row sys"><b>没通过</b>：'
             + esc((payload.program_check.problems || []).join("；")) + '</div>';
        }
      }else if(["accept","reject","counter","ask_clarify"].indexOf(msg.kind) >= 0){
        const label = {accept:"对方接受", reject:"对方说不行",
          counter:"对方提了新方案", ask_clarify:"对方想再确认"}[msg.kind];
        h += '<div class="row them"><b>' + label + '</b>：'
           + esc(payload.review ? payload.review.reason : "") + '</div>';
      }
    }
    h += opts.inSheet ? '</div></div>' : '</div></details></div>';
  }
  h += '</div>';
  return h;
}

async function renderStream(){
  // 读不到就说读不到，不要把界面留在旧身份的内容上。
  // 之前这里没有 try/catch：任何一个接口失败，后面的渲染全部不执行，
  // 页面看着「切换没反应」，其实旧内容还挂在屏幕上，比报错更糟。
  let data, mattersData;
  try{
    data = await api("/api/conversation");
    mattersData = await api("/api/matters");
  }catch(err){
    stream.innerHTML = "";
    const el = document.createElement("div");
    el.className = "msg pa";
    el.innerHTML = '<div class="bubble">这个身份的内容没取到：' + esc(err.message)
      + '<br>可以再切一次试试。</div>';
    stream.appendChild(el);
    return;
  }
  const mattersById = {};
  for(const m of mattersData.matters) mattersById[m.task_id] = m;

  stream.innerHTML = "";
  let lastDay = "";
  // 同一件事只挂一张事项卡。这件事可能有好几轮系统回复
  // （补对象、重新协商、确认），每轮都挂卡就会在手机上叠出一模一样的好几张。
  const cardShown = {};
  for(const turn of data.turns){
    const day = (turn.created_at || "").slice(0, 10);
    if(day && day !== lastDay){
      lastDay = day;
      const mark = document.createElement("div");
      mark.className = "daymark";
      mark.textContent = day;
      stream.appendChild(mark);
    }
    if(turn.role === "user"){
      stream.appendChild(bubble("me", turn.text));
    }else{
      stream.appendChild(bubble("pa", turn.text));
      if(turn.task_id && mattersById[turn.task_id] && !cardShown[turn.task_id]){
        cardShown[turn.task_id] = true;
        const wrap = document.createElement("div");
        wrap.className = "msg pa";
        wrap.style.maxWidth = "100%";
        wrap.innerHTML = matterCard(mattersById[turn.task_id], null);
        stream.appendChild(wrap);
      }
      if(turn.plan_id && !cardShown['plan:' + turn.plan_id]){
        cardShown['plan:' + turn.plan_id] = true;
        const wrap = document.createElement("div");
        wrap.className = "msg pa";
        wrap.innerHTML = '<button class="btn ghost" data-act="open-plan" data-plan="'
          + esc(turn.plan_id) + '">打开这件事</button>';
        stream.appendChild(wrap);
      }
    }
  }
  if(!data.turns.length){
    const el = document.createElement("div");
    el.className = "msg pa";
    el.innerHTML = '<div class="bubble">你好，我是你的小助手。我记得你关心的人和往来，'
      + '你交代的事我会去和对方商量。<br><br>试试下面这句，或者直接跟我说。</div>';
    stream.appendChild(el);
  }
  stream.scrollTop = stream.scrollHeight;
}

/* ---------- 首屏「需要你处理」 ----------
   数据全部来自 /api/matters 与 /api/plans 的真实状态，不自己造待办。
   挑出来的只有两类：还没办完的事，以及正等本人动手的那一件。
   已经登记模拟订单、已经谈崩的事不进来——它们不是「要处理」，
   摆在首屏会让用户以为还得再做一次。

   一件事怎么显示，看它当前真实状态：
   blocked 说要补什么，agreed 说等本人确认，counter_pending 说对方提了新方案，
   needs_renegotiation 说哪条记录变了。未回应不等于同意，所以文案说「还在等谁」，
   不写成已约好。 */
const TODO_STAGES = ["blocked", "agreed", "counter_pending", "needs_renegotiation",
                     "negotiating", "created"];

function todoWhy(m){
  // 每条都说清「为什么现在轮到你看」，不是重复一遍状态名。
  if(m.stage === "blocked"){
    return "要补一句：" + (m.outcome || "送礼对象");
  }
  if(m.stage === "agreed"){
    return "对方接受了，等你确认";
  }
  if(m.stage === "counter_pending"){
    return "对方提了个新方案，要你定";
  }
  if(m.stage === "needs_renegotiation"){
    return m.outcome || "有条记录刚被更正，方案要重排";
  }
  if(m.stage === "negotiating"){
    return "正在和对方核实";
  }
  return "刚记下，还没开始办";
}

function todoAction(m){
  // 点进去之后落到哪一步，按状态给一句准话。用「打开」这种笼统说法，
  // 用户不知道点完会看到什么。
  if(m.stage === "blocked") return "点一个对象就能接着办";
  if(m.stage === "agreed") return "点开确认登记";
  if(m.stage === "counter_pending") return "点开看看对方提的方案";
  if(m.stage === "needs_renegotiation") return "点开按新记录重新协商";
  return "点开接着办";
}

function renderTodo(matters, plans){
  const box = $("todo");
  if(!box) return;
  const open = (matters || []).filter((m) => TODO_STAGES.indexOf(m.stage) >= 0);
  const openPlans = (plans || []).filter((p) => !p.agreed);
  if(!open.length && !openPlans.length){
    box.innerHTML = "";
    box.classList.remove("has");
    return;
  }
  let h = '<div class="todo-head"><b>需要你处理</b>'
    + '<span class="n">' + (open.length + openPlans.length) + ' 件未完</span></div>';
  // 等本人动手的排前面：blocked / agreed / counter_pending / needs_renegotiation
  // 都在等人，negotiating 和 created 是系统在办，用户看一眼就行。
  const mine = ["blocked", "agreed", "counter_pending", "needs_renegotiation"];
  const rank = (m) => (mine.indexOf(m.stage) >= 0 ? 0 : 1);
  const sorted = open.slice().sort((a, b) => rank(a) - rank(b));
  for(const m of sorted){
    const st = stageText(m.stage);
    h += '<button class="todo-item" data-open-task="' + esc(m.task_id) + '">'
      + '<div class="t">' + esc(m.utterance.length > 24
          ? m.utterance.slice(0, 24) + "…" : m.utterance) + '</div>'
      + '<div class="why">' + esc(todoWhy(m)) + '</div>'
      + '<div class="st state ' + st.cls + '"><span class="dot"></span>'
      + esc(todoAction(m)) + '</div></button>';
  }
  for(const p of openPlans){
    const tag = p.needs_replan ? "有条件变了，要重排"
      : "还在等：" + (p.waiting_on || []).join("、");
    h += '<button class="todo-item" data-open-plan="' + esc(p.plan_id) + '">'
      + '<div class="t">' + esc(p.title.length > 24
          ? p.title.slice(0, 24) + "…" : p.title) + '</div>'
      + '<div class="why">' + esc(tag) + '</div>'
      + '<div class="st state wait"><span class="dot"></span>'
      + '点开看各家进度</div></button>';
  }
  box.innerHTML = h;
  box.classList.add("has");
}

/* 一条事项的角标。类型和状态分成两枚，不混成一句话：
   多人参与是一枚，当前走到哪是另一枚。 */
function matterBadges(m){
  let h = '<div class="m-badges">';
  if(m.kind === "plan"){
    h += '<span class="m-badge multi">' + esc((m.families || 0) + " 家") + "</span>";
  }else{
    h += '<span class="m-badge">单人</span>';
  }
  let st, cls;
  if(m.kind === "plan"){
    if(m.needs_replan){ st = "条件变了，待重排"; cls = "st-wait"; }
    else if(m.agreed){ st = "已约定，待开始"; cls = "st-live"; }
    else { st = "待确认"; cls = "st-wait"; }
  }else{
    const t = stageText(m.stage);
    st = t.t;
    cls = t.cls === "ok" ? "st-live" : (t.cls === "wait" ? "st-wait" : "st-done");
  }
  h += '<span class="m-badge ' + cls + '">' + esc(st) + "</span></div>";
  return h;
}

function matterItem(m){
  const title = m.title && m.title.length > 22 ? m.title.slice(0, 22) + "…" : (m.title || "");
  const attr = m.kind === "plan"
    ? ' data-open-plan="' + esc(m.id) + '"'
    : ' data-open-task="' + esc(m.id) + '"';
  let sub = "";
  if(m.kind === "plan" && !m.agreed && (m.waiting_on || []).length){
    sub = '<div class="m-sub">还在等：' + esc(m.waiting_on.join("、")) + "</div>";
  }else if(m.outcome){
    sub = '<div class="m-sub">' + esc(m.outcome) + "</div>";
  }
  return '<button class="matter-item"' + attr + "><div>" + esc(title) + "</div>"
    + matterBadges(m) + sub + "</button>";
}

function waitItem(w){
  const who = w.kind === "awaiting_person" ? "等对方本人"
    : w.kind === "awaiting_model" ? "等模型调通"
    : w.kind === "awaiting_my_decision" ? "等你定" : "等对方回复";
  const since = (w.since || "").slice(0, 16).replace("T", " ");
  return '<div class="wait-item" data-open-task="' + esc(w.task_id) + '">'
    + '<div class="w-k"><span class="state wait"><span class="dot"></span>'
    + esc(who) + '</span><span class="w-since">' + esc(since) + ' 起</span></div>'

    + '<div class="w-q">' + esc(w.question) + "</div></div>";
}

async function renderSide(){
  // 和 renderStream 一样：取不到要给一句人话，不能整块静默不动。
  let mattersData, ov;
  try{
    [mattersData, ov] = await Promise.all([
      api("/api/matters"),
      api("/api/overview"),
    ]);
  }catch(err){
    const mh = $("side-matters");
    if(mh) mh.innerHTML = '<div class="notice">这个身份的内容没取到：'
      + esc(err.message) + '</div>';
    const wh = $("side-waiting");
    if(wh) wh.innerHTML = "";
    return;
  }
  const mh = $("side-matters");
  /* 送礼事项和共同事项合成一段。它们本来就是同一种东西：一件要办的事，
     区别只在于几个人参与、走到哪。原来分成「事项」和「共同事项」两块，
     同一件家庭活动只在其中一块出现，另一块像没有这事。
     角标写清类型和状态，比分成三块各说一半话更好找。 */
  // 在等条目先取出来再用：原来 const waiting 声明在两次使用之后，
  // 一进 renderSide 就抛 "Cannot access 'waiting' before initialization"，
  // 侧栏整块渲染不出来（页面看着像没有事项）。
  const waiting = mattersData.waiting || [];
  const tasks = (mattersData.matters || []).map((m) => ({
    id: m.task_id, kind: "task", title: m.utterance, stage: m.stage,
    outcome: m.outcome, waiting: waiting.filter((w) => w.task_id === m.task_id),
  }));
  const plans = (lastPlans || []).map((p) => ({
    id: p.plan_id, kind: "plan", title: p.title, stage: p.stage,
    outcome: p.outcome, agreed: p.agreed, needs_replan: p.needs_replan,
    families: (p.participants || []).length, waiting_on: p.waiting_on || [],
  }));
  // 挂不上具体事项的在等条目(例如等模型调通)也列出来，不丢。
  const orphans = waiting.filter((w) => !tasks.some((t) => t.id === w.task_id));
  const all = tasks.concat(plans);
  mh.innerHTML = all.length
    ? all.map(matterItem).join("") + (orphans.length ? orphans.map(waitItem).join("") : "")
    : '<div class="notice">还没有事项。跟我说一句话就行。</div>';

  // 在等的事单独一块。未回应不是同意，也不能显示成已经约好，
  // 所以这里只说清「在等谁、等什么、从什么时候开始等、现在能做什么」。
  const wh = $("side-waiting");
  wh.innerHTML = waiting.length
    ? waiting.map((w) => {
        const who = w.kind === "awaiting_person" ? "等对方本人"
          : w.kind === "awaiting_model" ? "等模型调通"
          : w.kind === "awaiting_my_decision" ? "等你定" : "等对方回复";
        const since = (w.since || "").slice(0, 16).replace("T", " ");
        return '<div class="wait-item" data-open-task="' + esc(w.task_id) + '">'
          + '<div class="w-k"><span class="state wait"><span class="dot"></span>'
          + esc(who) + '</span><span class="w-since">' + esc(since) + ' 起</span></div>'
          + '<div class="w-q">' + esc(w.question) + '</div></div>';
      }).join("")
    : '<div class="notice">没有在等的事。</div>';

  // 找人：先给一个搜索框，再按分组列出。分组可以重叠，
  // 同一个人出现在多个组里是同一个记录，不是多份档案。
  lastPersons = ov.persons || [];
  const mine = lastPersons.filter((p) => p.owner_id === ownerId && p.name !== "我");
  let h = '<input type="search" id="person-search" placeholder="搜姓名、别名、关系或职业"'
        + ' style="width:100%;box-sizing:border-box;padding:8px 10px;margin-bottom:10px;'
        + 'border:1px solid var(--line);border-radius:var(--radius-s);'
        + 'background:var(--surface);font-size:13px">';
  if(!mine.length){
    h += '<div class="notice">还没有记录人物。</div>';
  }else{
    h += '<div id="person-chips">'
        + mine.map(personChip).join("")
        + '</div><div id="person-groups"></div>';
  }
  $("side-persons").innerHTML = h;
  const box = $("person-search");
  if(box){
    box.addEventListener("input", () => renderPersonSearch(box.value, mine));
  }
  renderPersonGroups(mine);
  // 共同事项和送礼事项并列展示：一个家庭要一起定的事，
  // 状态口径和送礼一致——未回复不是同意，也不能显示成已约好。
  // 必须 await：renderSidePlans 里面才发 /api/plans 并把结果写进 lastPlans。
  // 不 await 时 renderTodo 拿到的还是上一次的空数组，首屏那一块永远只有
  // 送礼事项——「两个家庭周末去公园」这类共同事项就这么不见了，
  // 而侧栏里它是有的，两处不一致。
  await renderSidePlans();
  // 首屏那一块和侧栏读同一份 matters，不另外发请求：
  // 两份数据必须一致，各取一次只会有先后差。
  renderTodo(mattersData.matters, lastPlans);
}

/* ---------- 共同事项：多个家庭一起定一次活动 ---------- */
const PLAN_STAGE_TEXT = {
  draft:   {t: "还没开始", cls: "neutral"},
  awaiting:{t: "还在等各家确认", cls: "wait"},
  agreed:  {t: "各方已约定", cls: "ok"},
};
const PLAN_DECISION_TEXT = {
  accept: "已接受", reject: "不接受", counter: "提了修改意见",
  pending: "还没回复", stale: "接受的是旧版本，已失效",
};
const planDecisionText = (d) => PLAN_DECISION_TEXT[d] || d || "还没回复";
// 表态来源和结论分开写：本人点的和这一方代表审阅出来的都只代表这一方，
// 但「代表说可以」不能显示成本人已确认。
const planDecisionSourceText = (dec) =>
   dec && dec.decided_by === "representative" ? "代表审阅" : "本人确认";

async function renderSidePlans(){
  let data;
  try{
    data = await api("/api/plans");
  }catch(e){
    $("side-plans").innerHTML = '<div class="notice">共同事项暂时没取到。</div>';
    return;
  }
  const plans = data.plans || [];
  // 首屏那一块和侧栏共用这份数据：各取一次会有先后差，
  // 侧栏刚刷新、首屏还是旧列表，用户会看到两处不一致。
  lastPlans = plans;
  // 共同事项不再单独渲染：数据已经并进「事项」那一段(见 renderSide)，
  // 这里再渲染一次同一件事会出现两遍。lastPlans 仍要更新，首屏共用。
}

/* ---------- 人物搜索与分组 ---------- */
function personChip(p){
  return '<button class="chip btn-chip" data-person="' + esc(p.person_id) + '"'
    + ' title="' + esc(p.note || "") + '">' + esc(p.name) + '</button>';
}

// 按输入过滤。搜不到就说搜不到，不猜相似的人。
function renderPersonSearch(query, mine){
  const box = $("person-chips");
  if(!box) return;
  const q = (query || "").trim();
  const hit = q
    ? mine.filter((p) => {
        const hay = [p.name, p.relation, p.note]
          .concat(p.aliases || [])
          .concat(Object.keys(p.attributes || {}).map((k) => k + p.attributes[k]))
          .join(" ");
        return hay.indexOf(q) >= 0;
      })
    : mine;
  box.innerHTML = hit.length
    ? hit.map(personChip).join("")
    : '<div class="notice">没找到叫「' + esc(q) + '」的人。'
      + '可以换个说法，或者直接在对话里告诉我这个人是谁。</div>';
  renderPersonGroups(hit);
}

// 按分组列出。一个人可以同时在多个组里，各组人数会重叠，
// 所以这里不做「共 N 人」这种会把重叠人数加错的统计。
const GROUP_ORDER = ["家人与亲属", "朋友与同学", "工作与业务", "社区与兴趣",
                     "生活服务", "未分组"];
function renderPersonGroups(persons){
  const box = $("person-groups");
  if(!box) return;
  const buckets = {};
  for(const p of persons){
    const gs = (p.groups && p.groups.length) ? p.groups : ["未分组"];
    for(const g of gs){
      (buckets[g] = buckets[g] || []).push(p);
    }
  }
  const named = GROUP_ORDER.filter((g) => buckets[g] && buckets[g].length);
  box.innerHTML = named.map((g) =>
    '<div style="margin-top:12px"><div style="font-size:12px;color:var(--ink-3);'
    + 'margin-bottom:6px">' + esc(g) + '</div>'
    + buckets[g].map(personChip).join("") + '</div>').join("");
}

/* ---------- 发送 ---------- */

$("composer").addEventListener("submit", async (e) => {
