<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-title" content="小应用">
<title>小应用 · 记录与下一步</title>
<style>
:root{
  --paper: oklch(97.5% 0.008 85);
  --paper-2: oklch(99% 0.004 90);
  --surface: oklch(100% 0 0);
  --ink: oklch(24% 0.012 75);
  --ink-2: oklch(42% 0.014 75);
  --ink-3: oklch(58% 0.012 75);
  --line: oklch(90% 0.008 85);
  --line-2: oklch(86% 0.01 82);
  --accent: oklch(46% 0.075 155);
  --accent-soft: oklch(94% 0.03 155);
  --bad: oklch(48% 0.13 25);
  --bad-soft: oklch(95% 0.04 25);
  --radius: 14px; --radius-s: 10px;
  --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 28px;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:var(--space-5) var(--space-4) 56px}
header{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
header h1{font-size:19px;margin:0;font-weight:600}
header .back{margin-left:auto;font-size:13px;color:var(--ink-2);text-decoration:none}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 var(--space-5)}
.tabs{display:flex;gap:8px;margin-bottom:var(--space-5);flex-wrap:wrap}
.tab{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;
  padding:7px 14px;font-size:13.5px;color:var(--ink-2);cursor:pointer;font-family:inherit}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);
  color:var(--ink);font-weight:500}
/* 页签分两组：上面是具体小应用，下面是来源与管理。数据接入和关系分类
   不是「又一个小应用」，平铺一行会让人以为它们和学习软件同级。 */
.tab-groups{display:flex;flex-direction:column;gap:10px;margin-bottom:var(--space-5)}
.tab-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab-group-label{font-size:12px;color:var(--ink-3);min-width:3.2em}
.tab-group.sub .tab{padding:5px 11px;font-size:12.5px;color:var(--ink-3)}
.tab-group.sub .tab[aria-selected="true"]{color:var(--ink)}
@media (max-width:600px){
  .tab-group-label{min-width:100%;margin-bottom:-4px}
  .tab-group.sub{padding-left:10px;border-left:2px solid var(--line)}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:var(--space-4);margin-bottom:var(--space-3)}
.card h3{margin:0 0 2px;font-size:15px;font-weight:600}
.card .meta{color:var(--ink-3);font-size:12.5px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--ink);margin-right:6px}
.pill.device{background:oklch(94% 0.03 250)}
.pill.private{background:var(--bad-soft);color:var(--bad)}
.pill.old{background:oklch(93% 0.01 80);color:var(--ink-3)}
.notice{margin-top:10px;padding:10px 12px;border-radius:var(--radius-s);
  background:var(--paper-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.notice.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--radius-s);
  padding:8px 14px;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;
  padding:6px 13px;font-size:13px;color:var(--ink-2);cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
textarea,input[type=text]{width:100%;border:1px solid var(--line-2);border-radius:var(--radius-s);
  padding:8px 10px;font-family:inherit;font-size:13.5px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:12.5px;color:var(--ink-3);margin:10px 0 4px}
.state{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.empty{color:var(--ink-3);font-size:13.5px;padding:18px 0}
.sources{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.sources h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.sources .s{font-size:12.5px;color:var(--ink-2);margin-bottom:3px}
.big{font-size:14.5px;margin:6px 0 0}
input,textarea,select{max-width:100%;min-width:0}.mapping-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.consent{display:inline-flex;align-items:center;gap:6px;margin-right:12px}.notice{overflow-wrap:anywhere}details summary{cursor:pointer}.btn{min-height:44px}.sim-list{display:flex;flex-direction:column;gap:8px}.sim-row{display:grid;grid-template-columns:1fr auto;grid-template-areas:'head btn' 'desc desc';gap:2px 10px;align-items:center}.sim-head{grid-area:head;min-width:0}.sim-desc{grid-area:desc;font-size:12px}.sim-row .btn{grid-area:btn;min-height:38px;padding:0 14px} @media(max-width:400px){.mapping-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>小应用</h1>
    <a class="back" href="/">返回对话</a>
  </header>
  <p class="sub">学习软件负责记进度，数据接入连接应用来源。周末安排根据已授权的进度
    给下一步建议，并说明依据来自哪一条。</p>

  <div class="tab-groups">
    <div class="tab-group" role="tablist" aria-label="小应用">
      <span class="tab-group-label">小应用</span>
      <button class="tab" role="tab" data-view="study" aria-selected="true">学习软件</button>
      <button class="tab" role="tab" data-view="plan" aria-selected="false">周末安排</button>
      <button class="tab" role="tab" data-view="gift" aria-selected="false">送礼管家</button>
    </div>
    <div class="tab-group sub" role="tablist" aria-label="来源与管理">
      <span class="tab-group-label">来源与管理</span>
      <button class="tab" role="tab" data-view="connectors" aria-selected="false">数据接入</button>
      <button class="tab" role="tab" data-view="relclass" aria-selected="false">关系分类（建设中）</button>
    </div>
  </div>

  <div id="flash" class="state" role="status" aria-live="polite"
       style="min-height:20px;margin-bottom:12px"></div>
  <div id="out"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

/* 按钮执行包装：禁用→执行→失败给可见原因→恢复。
   原来是 renderConnectors / renderGift 各自定义的局部函数，renderRelClass
   直接调用却漏了定义，一进那个视图就抛 ReferenceError，onclick 赋值被跳过，
   「保存分类」看起来能点、实际什么都没发生。提到模块作用域，只留一份。 */
async function action(button, fn){
  if(!button) return;
  button.disabled = true;
  try{ await fn(); }
  catch(e){ flash('没有完成：' + (e && e.message ? e.message : e), true); }
  finally{ if(button.isConnected) button.disabled = false; }
}
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let view = "study";
let myPersons = [];
let picked = "";

/* 反馈写在 #out 外面的固定元素里。写在列表内部的话，
   一重渲染就连同反馈一起被替换掉，用户刚点完保存就什么也看不到。 */
function flash(text, bad){
  const el = $("flash");
  if(!el) return;
  el.textContent = text || "";
  el.style.color = bad ? "var(--bad)" : "var(--ink-3)";
}

async function api(path, opts){
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if(!r.ok){
    // 普通接口用 detail，插件接口用 {error:{...}}。两处都取，谁有内容用谁，
    // 否则服务端给的具体原因会被显示成 [object Object]。
    const fromError = data && data.error && data.error.message;
    const detail = data.detail;
    const text = typeof detail === "string" ? detail : Array.isArray(detail) ? detail.map(x=>x.msg||JSON.stringify(x)).join("；") : detail ? JSON.stringify(detail) : "HTTP "+r.status;
    throw new Error(fromError || text);
  }
  return data;
}
const post = (p, b) => api(p, {method:"POST", headers:{"Content-Type":"application/json"},
  body: JSON.stringify(b)});

/* 可选对象直接取服务端按本人过滤后的列表。这里不再按 owner_id 二次过滤：
   那个字段 /api/persons 并不返回，按它筛会得到空列表；
   归属本来就该由服务端决定，前端再筛一遍只会两头维护。 */
async function loadPersons(){
  const d = await api("/api/persons");
  myPersons = d.persons || [];
  if(!picked && myPersons.length) picked = myPersons[0].person_id;
}

// 把页面里的脚本错误暴露出来。没有这个捕获器时，验收脚本读到的
// window.__paErr 永远是空串，看起来「没有错误」，其实从没在听。
window.__paErr = "";
window.addEventListener("error", (e) => {
  window.__paErr += "[error] " + (e.message || "") + " @"
    + (e.filename || "") + ":" + (e.lineno || 0) + "\n";
});
window.addEventListener("unhandledrejection", (e) => {
  const r = e.reason;
  window.__paErr += "[unhandled] " + ((r && r.message) ? r.message : String(r)) + "\n";
});

async function boot(){
  await loadPersons();
  await render();
}
boot();

// 模型给的把握度是 high/medium/low。普通用户看到英文没有意义，
// 只显示中文；原值留在服务端日志和接口返回值里，需要核对时查那里。
const CONF_TEXT = {high: "依据充分", medium: "依据一般", low: "依据不足"};
function confText(c){
  return CONF_TEXT[c] || "";
}

// 来源标识翻成人话。source 是内部 ID（study_app、photo_一串字符），
// event_type 也是内部类型名。普通人看到这些看不出这条记录是谁记的、
// 在什么情况下记的。provider 缺失时才退回这里翻一层，翻不出就给中性说法，
// 不把内部编号直接摊给用户看。
const SOURCE_TEXT = {
  study_app: "学习软件里记的",
  mom_diary: "家长日记里记的",
  watch_sync: "手表同步的",
};
const EVENT_TEXT = {
  study_progress: "学习进度",
  photo_record: "拍照记录",
  note: "近况记录",
};
function sourceText(source, eventType){
  if(SOURCE_TEXT[source]) return SOURCE_TEXT[source];
  // photo_ 开头是拍照来的，带上事件类型说清是什么记录。
  if(String(source || "").indexOf("photo_") === 0) return "拍照记录";
  return EVENT_TEXT[eventType] || "已授权的记录";
}

/* 按给定名单渲染人选。默认就是看全部，点某个孩子是收窄，不是进门门槛。 */
function personChipsFor(list){
  if(!list || !list.length){
    return '<div class="notice">还没有可记录的人物。</div>';
  }
  let h = '<div class="row">';
  h += '<button class="chip" data-pick="" aria-pressed="' + (!picked) + '">全部</button>';
  for(const p of list){
    h += '<button class="chip" data-pick="' + esc(p.person_id) + '" aria-pressed="'
       + (p.person_id === picked) + '">' + esc(p.name) + '</button>';
  }
  h += '</div>';
  return h;
}

/* 由 person_id 取显示名；取不到就退回 id，不显示空白。 */
function personName(pid){
  const p = (myPersons || []).find(x => x.person_id === pid);
  return p ? p.name : String(pid || "").slice(0, 8);
}

function personChips(){
  if(!myPersons.length){
    return '<div class="notice">还没有可记录的人物。</div>';
  }
  let h = '<div class="row">';
  // 「全部」放最前：默认就是看全部，点某个孩子是收窄，不是进门门槛。
  h += '<button class="chip" data-pick="" aria-pressed="' + (!picked) + '">全部</button>';
  for(const p of myPersons){
    h += '<button class="chip" data-pick="' + esc(p.person_id) + '" aria-pressed="'
       + (p.person_id === picked) + '">' + esc(p.name) + '</button>';
  }
  h += '</div>';
  return h;
}

/* ---------- 建议被「两个值对不上」挡下时的处理 ---------- */
// 服务端在 status=needs_confirm 时返回 conflicts：每一项是哪条记录、
// 哪个字段和本人后来写的正文对不上。这里要把它说成具体的一件事，
// 再给一条真的能走通的路，不是只摆一句「数据有冲突」。
//
// 纠正走已有的 /correct：它把旧记录标成被替代，写入新内容，
// 授权跟着新记录走。前端只需要把那个字段的新值发过去。
// 只有本人记的记录才能更正（服务端按 owner_id 校验），
// 别人记的这里不摆按钮，改成说清去哪看。
function renderConflict(box, d){
  const items = d.conflicts || [];
  let h = '<div class="notice bad">' + esc(d.note || "记录里有两个对不上的值，先定用哪个。") + '</div>';
  if(items.length){
    h += '<div class="sources"><h4>对不上的地方</h4>';
    for(const c of items){
      const who = c.source || "一条记录";
      const when = c.happened_on ? " · " + esc(c.happened_on) : "";
      h += '<div class="s">' + esc(who) + when + " 的「" + esc(c.field || "内容")
         + "」和你后来写的正文不是一个数。</div>";
    }
    h += '</div>';
  }
  // 就地定一个数。输入框预填当前字段值，用户改完保存即可，
  // 不用先看懂「哪个字段」这种内部说法。
  // 只对本人记的记录摆这个表单：服务端按 owner_id 校验，
  // 别人记的记录这里摆出去只会点出 404，不如说清去哪看。
  const fixable = items.filter((c) => c.event_id);
  if(fixable.length){
    const c = fixable[0];
    // 预填当前字段值：用户是来改一个数的，不是来重打整句话的。
    // 值从 sources 里按 event_id 找——那是本人能看到的那一条记录。
    const src = (d.sources || []).find((s) => s.event_id === c.event_id);
    const old = (src && src.fields && src.fields[c.field]) || "";
    h += '<label for="ta-fix">把「' + esc(c.field || "内容") + "」改成</label>"
       + '<textarea id="ta-fix" placeholder="写定下来的那个数，例如：四十分钟">'
       + esc(old) + '</textarea>'
       + '<div class="row"><button class="btn primary" id="btn-fix">定这个，再给建议</button>'
       + '</div>';
  }else{
    h += '<div class="state">这条不是你记的，改不了。可以在「学习软件」页'
       + '找到记这条的人，让对方改。</div>';
  }
  // 说清改完会怎样：旧的那条标为已更正，下次读到的是新值。
  h += '<div class="state">定一个数，我用它来给建议。改的是记录里的那个字段，'
     + '改完旧的那条标为已更正，下次读到的是新值。</div>';
  box.innerHTML = h;
  const btn = $("btn-fix");
  if(btn){
    btn.addEventListener("click", async () => {
      const text = ($("ta-fix").value || "").trim();
      if(!text){ flash("先写定下来的那个数。", true); return; }
      const c = fixable[0];
      flash("正在保存…");
      try{
        // correct 的 payload 是整份替换，不是合并：只想改一个字段时，
        // 也要把这条记录其余要保留的字段一起写进来，否则会被抹掉。
        const keep = {};
        const src = (d.sources || []).find((s) => s.event_id === c.event_id);
        if(src && src.fields){
          for(const k in src.fields){
            if(k !== c.field) keep[k] = src.fields[k];
          }
        }
        keep[c.field] = text;
        await post("/api/life-events/" + encodeURIComponent(c.event_id) + "/correct",
                   {payload: keep});
        flash("已定。旧记录标为已更正，正在按新值给建议…");
        // 改完立刻重取一次建议，不让用户自己再点一次「给一条建议」。
        const again = await post("/api/suggestion", {subject_id: picked});
        if(again.status === "needs_confirm"){
          renderConflict(box, again);
          flash("还有一处对不上，接着定。", true);
          return;
        }
        box.innerHTML = '<div class="big">' + esc(again.suggestion) + '</div>';
      }catch(err){
        flash("没改成：" + err.message, true);
      }
    });
  }
}

/* ---------- 视图一：学习软件 ---------- */
async function renderStudy(){
  const out = $("out");
  /* 不设「先选一个对象」这道门。一般家庭就一两个孩子，为了看记录专门去点
     一下人选是多出来的一步；老师带一个班时人也照样分组列着，不会糊成一片。
     选人在这里只是筛选：点某个孩子只看他，再点一次取消筛选回到全部。 */
  // 人物只列自己的孩子。原来把朋友家的孩子、配偶、长辈一起列出来，
  // 一个家庭主人打开「学习软件」看到的是别人家孩子，不像在记自己家的进度。
  // 一个自己的孩子都没有时，退回所有孩子；再没有才退回全部人物，
  // 并且把为什么退回落进界面，不悄悄换一批人。
  const OWN_CHILD = ["own_child", "child", "son", "daughter"];
  let persons = myPersons.filter((p) => OWN_CHILD.includes(p.relation));
  let personNote = "";
  if(!persons.length){
    persons = myPersons.filter((p) => p.relation && p.relation.indexOf("child") >= 0);
    if(persons.length) personNote = "你还没有把自己的孩子记在名下，先按所有孩子列。";
  }
  if(!persons.length){
    persons = myPersons;
    if(persons.length) personNote = "还没有孩子记录，先按所有人物列。";
  }
  const few = persons.length > 0;
  if(!few){
    out.innerHTML = '<div class="empty">还没有可记录的人物。</div>';
    return;
  }
  out.innerHTML = '<div class="empty">正在读…</div>';
  let evs = [];
  try{
    const d = await api("/api/source/study_app");
    const all = d.events || [];
    evs = few ? all.slice() : all.filter((e) => e.subject_id === picked);
    if(few){
      const order = {};
      persons.forEach((p, i) => { order[p.person_id] = i; });
      evs.sort((a, b) => (order[a.subject_id] - order[b.subject_id])
        || String(b.happened_on || "").localeCompare(String(a.happened_on || "")));
    }
  }catch(err){
    out.innerHTML = '<div class="empty">没读到记录：' + esc(err.message) + '</div>';
    return;
  }
  let h = '<div class="card"><h3>记一条进度</h3>'
    + '<div class="meta">默认记在第一个孩子名下；要记给别人，先点上面的人名。保存前你可以改。</div>'
    + (personNote ? '<div class="notice">' + esc(personNote) + '</div>' : '')
    + personChipsFor(persons)
    + '<label for="ta-dim">哪条线（学习维度）</label><select id="ta-dim">'
    + STUDY_DIMS.map(d => '<option value="' + d + '">' + d + '</option>').join('')
    + '</select>'
    + '<label for="ta-new">这次做了什么（中文，一句话）</label>'
    + '<textarea id="ta-new" placeholder="例如：自己读完了两本绘本"></textarea>'
    + '<div class="row"><button class="btn primary" id="btn-save">记下</button></div>'
    + '</div>';

  h += '<div class="card"><h3>各条线的进度</h3>'
    + '<p class="meta">按学习维度归。一条线很久没记，这里会直接说，不用你自己翻。</p>';
  // 维度小结：每条线记了几次、最近一次是什么时候、说的是什么。
  const dimStat = {};
  for(const ev of evs){
    const dim = (ev.payload && ev.payload["科目"]) || "未分类";
    const cur = dimStat[dim] || (dimStat[dim] = {n: 0, last: "", lastText: ""});
    cur.n += 1;
    const day = String(ev.happened_on || "");
    if(day >= cur.last){ cur.last = day; cur.lastText = ev.payload["进度"] || ""; }
  }
  const dimNames = STUDY_DIMS.filter(d => dimStat[d]).concat(
    Object.keys(dimStat).filter(d => !STUDY_DIMS.includes(d)));
  if(dimNames.length){
    h += '<div class="meta" style="margin-bottom:8px">';
    for(const d of dimNames){
      const st = dimStat[d];
      h += '<span class="pill" style="margin-right:6px">' + esc(d) + ' ' + st.n + ' 次'
         + (st.last ? ' · 最近 ' + esc(st.last) : '') + '</span>';
    }
    h += '</div>';
    // 一直没碰的线也说一句，别让人以为漏看了。
    const idle = STUDY_DIMS.filter(d => !dimStat[d]);
    if(idle.length){
      h += '<div class="meta" style="margin-bottom:8px">还没记过的线：'
         + esc(idle.join("、")) + '。</div>';
    }
  }
  h += '<div class="meta" style="margin-bottom:6px">全部记录：</div>';
  if(!evs.length){
    h += '<div class="empty">' + (picked ? '这个人还没有记录。' : '还没有记录。') + '</div>';
  }
  const nameOf = (id) => {
    const hit = persons.find((p) => p.person_id === id);
    return hit ? hit.name : "";
  };
  for(const ev of evs){
    const text = (ev.payload && (ev.payload["进度"] || ev.payload["已完成项目"])) || "";
    const dim = (ev.payload && ev.payload["科目"]) || "未分类";
    h += '<div class="meta" style="margin-top:12px">'
       + '<span class="pill" style="margin-right:6px">' + esc(dim) + '</span>'
       + (few && nameOf(ev.subject_id) ? esc(nameOf(ev.subject_id)) + ' · ' : '')
       + esc(ev.happened_on) + ' · '
       + esc(ev.provider) + (ev.status === "superseded" ? ' · 已被更正' : '') + '</div>';
    h += '<div class="big">' + esc(text) + '</div>';
    h += '<div class="row"><button class="btn" data-fix="' + esc(ev.event_id) + '">更正</button>'
       + '<button class="btn" data-revoke="' + esc(ev.event_id) + '">撤回</button></div>';
    h += '<div id="fix-' + esc(ev.event_id) + '"></div>';
  }
  h += '</div>';
  out.innerHTML = h;

  // 学习页也要响应选人：之前只有 renderPlan 绑了 [data-pick]，
  // 这里点另一个孩子，写入的仍是默认那一个。
  out.querySelectorAll("[data-pick]").forEach((b) => {
    b.addEventListener("click", () => { picked = b.dataset.pick; renderStudy(); });
  });

  $("btn-save").addEventListener("click", async () => {
    const text = $("ta-new").value.trim();
    if(!text){ flash("先写一句今天做了什么。", true); return; }
    flash("正在记…");
    try{
      const res = await post("/api/life-events", {
        source_id: "study_app", subject_id: picked, event_type: "study_progress",
        payload: {"进度": text, "科目": (($("ta-dim") || {}).value || "其它")}, happened_on: "",
        provider: "我在这台设备上记的", source_kind: "app",
        grants: [],
      });
      // 按服务端的 created 说话：同一天同一来源的重复导入不会新建记录，
      // 这时说「记下了」会让人以为存进了一条，实际是命中了已有那条。
      // 反馈写在外面的 #flash：写在列表内部会被下面的 renderStudy() 替换掉，
      // 用户刚点完保存就什么也看不到。
      if(res.created){
        $("ta-new").value = "";
        flash("记下了。别人要看到它，需要你授权之后才会给出去。");
      }else{
        flash("今天这个人已经有一条学习记录了，这次没有新建。"
          + "要改内容请用下面的「更正」，不要重复记一条。");
      }
      await renderStudy();
      // renderStudy 之后还要再说一次：它重渲染时不会动 #flash，
      // 但列表内容变了，这句结论要留在用户眼前。
      flash(res.created
        ? "记下了。别人要看到它，需要你授权之后才会给出去。"
        : "今天这个人已经有一条学习记录了，这次没有新建。"
          + "要改内容请用下面的「更正」，不要重复记一条。");
    }catch(err){
      flash("没记上：" + err.message, true);
    }
  });
  out.querySelectorAll("[data-fix]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const box = $("fix-" + btn.dataset.fix);
      if(!box) return;
      if(box.innerHTML){ box.innerHTML = ""; return; }
      const cur = evs.find((e) => e.event_id === btn.dataset.fix);
      const old = (cur && cur.payload && (cur.payload["进度"] || cur.payload["已完成项目"])) || "";
      box.innerHTML = '<label>更正成</label>'
        + '<textarea id="ta-' + esc(btn.dataset.fix) + '">' + esc(old) + '</textarea>'
        + '<div class="row"><button class="btn primary" data-do-fix="'
        + esc(btn.dataset.fix) + '">保存更正</button></div>'
        ;
      box.querySelector("[data-do-fix]").addEventListener("click", async () => {
        const text = $("ta-" + btn.dataset.fix).value.trim();
        if(!text){ flash("写一句更正后的内容。", true); return; }
        flash("正在保存…");
        try{
          // 只发这一个键：服务端按新 payload 整份替换旧内容，
          // 想保留别的字段要一起写进来，这里明说，不偷偷合并。
          await post("/api/life-events/" + encodeURIComponent(btn.dataset.fix) + "/correct",
                     {payload: {"进度": text}});
          flash("已更正。旧记录标为被替代，别人下次读到的是新内容。");
          // 不在这里整页重渲染：重新渲染会把这句话连同表单一起替换掉，
          // 用户刚点完保存就看不到任何反馈。列表在下次进入这一页时再读。
          box.innerHTML = "";
          const cur = evs.find((e) => e.event_id === btn.dataset.fix);
          if(cur){
            cur.payload = {"进度": text};
            cur.status = "superseded";
            // 服务端建更正记录时已经在 provider 上加了「（已更正）」，
            // 这里不能再加一次：界面上会出现「（已更正）（已更正）」。
            // 本地这条只是即时把旧记录标成被替代，来源文字按原样留着。
          }
        }catch(err){
          flash("没能更正：" + err.message, true);
        }
      });
    });
  });
  out.querySelectorAll("[data-revoke]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if(!confirm("撤回后，别人新查就看不到这条。确定吗？")) return;
      try{
        await post("/api/life-events/" + encodeURIComponent(btn.dataset.revoke) + "/revoke", {});
        await renderStudy();
      }catch(err){
        alert("没能撤回：" + err.message);
      }
    });
  });
}

/* ---------- 视图二：周末安排（第二个应用自己的产出） ---------- */
async function renderPlan(){
  const out = $("out");
  if(!myPersons.length){
    out.innerHTML = '<div class="empty">还没有可给出建议的对象。</div>';
    return;
  }
  /* 先看这周末和谁有关、各自到什么程度，再谈建议。
     原来一进来就是「下一步建议 + 选人 + 给一条建议」，像在要答案；
     实际上要先回答三件事：谁周末有空、谁的日程已经定了、我邀请了谁/谁邀请了我。
     这三件事有数据支撑（plan 的参与方状态、条件、在等谁），
     没有支撑的（比如对方具体哪个小时有空）就明说还没记，不猜。 */
  let plans = [];
  try{ plans = (await api('/api/plans')) || []; }catch(err){ plans = []; }
  let h = '';
  if(plans.length){
    h += '<div class="card"><h3>这周末和谁有关</h3>'
      + '<p class="meta">按当前版本看。谁给了条件、谁还没给，谁表了态、在等谁，都列在这里。</p>';
    for(const p of plans){
      h += '<section class="notice"><strong>' + esc(p.title || '共同事项') + '</strong>';
      if(p.needs_replan) h += ' <span class="pill">待重排</span>';
      else if(p.agreed) h += ' <span class="pill">已约定</span>';
      else h += ' <span class="pill">还没约定</span>';
      h += '<div class="meta">当前第 ' + esc(p.current_version || 0) + ' 版'
        + (p.utterance ? ' · 原话：' + esc(p.utterance) : '') + '</div>';
      // 每家一行：状态 + 他给的时间条件。没给条件就说没给，不拿别人的顶。
      for(const s of (p.participants || [])){
        const stateText = {pending: '还没给条件', invited: '已邀请未接',
          claimed: '已自称未认可', approved: '已认可未表态',
          reviewed: '代表已审阅', accepted: '本人已接受',
          rejected: '本人不接受', retired: '已退出'}[s.state] || s.state;
        h += '<div class="meta" style="margin-top:6px">'
          + '<span class="pill" style="margin-right:6px">' + esc(s.label || '') + '</span>'
          + esc(stateText)
          + (s.required ? '' : '（非必到）') + '</div>';
      }
      if(p.waiting_on && p.waiting_on.length){
        h += '<div class="meta" style="margin-top:6px">还在等：'
          + esc(p.waiting_on.join('、')) + '。</div>';
      }else if(!p.agreed){
        h += '<div class="meta" style="margin-top:6px">条件都齐了，还没到全员约定。</div>';
      }
      h += '<div class="row"><button class="btn" data-open-plan="' + esc(p.plan_id) + '">打开这件事</button></div>';
      h += '</section>';
    }
    h += '</div>';
  }else{
    h += '<div class="card"><h3>这周末和谁有关</h3>'
      + '<div class="empty">还没有共同事项。说一句「周末三家一起带孩子出去玩，我出100以内」就能开一件。</div></div>';
  }
  // 建议降成次要动作：它只依据已授权给你的近况，不是这里的主角。
  // 两张卡必须先拼进同一个 h、再一次性赋值。原来先赋一次状态卡、
  // 之后又 out.innerHTML += h，等于把已经渲染过的状态卡又追加一遍，
  // 用户看到两张一模一样的「这周末和谁有关」。
  h += '<div class="card"><h3>下一步建议</h3>'
    + '<div class="meta">只依据已授权给你的近况，不重填人物背景。</div>'
    + personChips()
    // 选中谁要说出来：原先点了人名只有 chip 自己高亮，页面上别处一点变化都没有，
    // 用户无从判断这个选择影响了什么。这里把当前范围写成一行可见文字，
    // 「给一条建议」按钮上也带上，点的结果和选的人对得上。
    + '<div class="meta" id="pick-scope" style="margin-top:6px">'
    + (picked ? '正在看：' + esc(personName(picked))
              + '，下面的建议只按他的近况给。'
              : '正在看全部人，下面的建议按每个人的近况分别给。')
    + '</div>'
    + '<div class="row"><button class="btn" id="btn-ask">'
    + (picked ? '给' + esc(personName(picked)) + '一条建议' : '给一条建议')
    + '</button></div>'
    + '<div id="plan-result"></div></div>';
  out.innerHTML = h;
  out.querySelectorAll('[data-open-plan]').forEach((b) => {
    b.addEventListener("click", () => { if(window.openPlan) openPlan(b.dataset.openPlan); });
  });
  out.querySelectorAll("[data-pick]").forEach((b) => {
    b.addEventListener("click", () => { picked = b.dataset.pick; renderPlan(); });
  });
  $("btn-ask").addEventListener("click", async () => {
    const box = $("plan-result");
    box.innerHTML = '<div class="state">正在想…</div>';
    try{
      const d = await post("/api/suggestion", {subject_id: picked});
      if(d.status === "no_data"){
        box.innerHTML = '<div class="notice">' + esc(d.note) + '</div>';
        return;
      }
      if(d.status === "model_failed"){
        box.innerHTML = '<div class="notice bad">' + esc(d.note) + '</div>';
        return;
      }
      // 记录里的同一个值给了两个数（字段还是旧的，本人核对时改过正文）。
      // 这时候给建议只能二选一，用户不知道最后信了哪个，所以服务端直接停下。
      // 这里必须单独接住：漏了它，状态会掉进下面的成功分支，
      // suggestion 是空串，用户看到的是「这条建议依据了（没有可用依据）」——
      // 一个说不通的死胡同，也没有告诉他下一步该干什么。
      if(d.status === "needs_confirm"){
        renderConflict(box, d);
        return;
      }
      let h = '<div class="big">' + esc(d.suggestion) + '</div>';
      if(d.confidence){
        h += '<div class="state">依据充分程度：'
           + esc(confText(d.confidence)) + '</div>';
      }
      // 依据只列真正送进模型的那些（used_sources），不列全部授权近况。
      // 列全部的话，标题写「这条建议依据了」，但有些近况根本没参与推理，
      // 用户核对时会发现依据比实际多——那是拿没用的信息冒充依据。
      // 服务端把 sources（全部授权近况）和 used_sources（实际送模型的）
      // 分开返回，界面上要能看出这个差别。
      h += '<div class="sources"><h4>这条建议依据了</h4>';
      const srcs = d.used_sources || [];
      if(!srcs.length) h += '<div class="s">（没有可用依据）</div>';
      for(const s of srcs){
        // 发生日期读不清时是空串，留空会显示成一条悬空的分隔点。
        const when = s.happened_on ? esc(s.happened_on) : "发生日期未读到";
        // source 是内部来源 ID（study_app、photo_xxx），普通人看不出是什么。
        // 优先用 provider：那是给人看的一句话，写清了是谁在什么情况下记的。
        const who = s.provider || sourceText(s.source, s.event_type);
        h += '<div class="s">' + esc(who) + ' · ' + when
           + (s.is_device ? ' · 设备数据，不是本人自述' : '') + '</div>';
      }
      h += '</div>';
      box.innerHTML = h;
    }catch(err){
      box.innerHTML = '<div class="notice bad">没拿到建议：' + esc(err.message) + '</div>';
    }
  });
}

}

    out.innerHTML=h+'</div>';
    $('connector-test').onclick=()=>action($('connector-test'),async()=>{
      const field_map={};for(const el of out.querySelectorAll('[data-map]')){const key=el.value.trim();if(key){if(field_map[key])throw new Error('一个外部键不能映射到多个本地字段');field_map[key]=el.dataset.map;}}
      connectorDraft={kind:'self_app',name:$('connector-name').value.trim(),base_url:$('connector-base').value.trim(),path:$('connector-path').value.trim(),field_map};
      const r=await connectorPost('/api/connectors',connectorDraft);draftConnector=r.connector_id;
      const p=await connectorPost('/api/connectors/'+draftConnector+'/test');$('connector-preview').innerHTML=previewHtml(p);
      $('connector-confirm').disabled=p.total===0||p.preview.some(r=>!r.importable);flash('试运行完成，尚未导入资料。');
    });
    out.querySelectorAll('#connector-name,#connector-base,#connector-path,[data-map]').forEach(el=>el.oninput=()=>{$('connector-confirm').disabled=true;draftConnector='';});
    $('connector-confirm').onclick=()=>action($('connector-confirm'),async()=>{await connectorPost('/api/connectors/'+draftConnector+'/sync');connectorDraft=null;draftConnector='';await renderConnectors();flash('已导入资料库，尚未授权用于建议。');});
    out.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>action(b,async()=>{const c=d.catalog.find(x=>x.key===b.dataset.sim);const r=await connectorPost('/api/connectors',{kind:'third_party',name:c.name,path:c.key});await connectorPost('/api/connectors/'+r.connector_id+'/sync');await renderConnectors();flash('已同步模拟数据，未发起外部请求，尚未授权用于建议。');}));
    out.querySelectorAll('[data-sync]').forEach(b=>b.onclick=()=>action(b,async()=>{await connectorPost('/api/connectors/'+b.dataset.sync+'/sync');await renderConnectors();flash('同步完成；重复外部 id 不新增，也不覆盖本人更正。');}));
    out.querySelectorAll('[data-revoke-connector]').forEach(b=>b.onclick=()=>action(b,async()=>{if(!confirm('撤回此连接器及导入记录？历史保留，但不再用于建议。'))return;await connectorPost('/api/connectors/'+b.dataset.revokeConnector+'/revoke');await renderConnectors();flash('已撤回，历史仍保留。');}));
    for(const key of ['authorize','ungrant','recordRevoke','correct']){
      const attr=key.replace(/[A-Z]/g,m=>'-'+m.toLowerCase());out.querySelectorAll('[data-'+attr+']').forEach(b=>b.onclick=()=>action(b,async()=>{
        const eid=b.dataset[key],base='/api/connectors/'+b.dataset.cid+'/records/'+eid;
        if(key==='correct'){const payload={};out.querySelectorAll('[data-edit="'+eid+'"]').forEach(e=>payload[e.dataset.field]=e.value);await connectorPost(base+'/correct',{payload});}
        else if(key==='recordRevoke')await connectorPost(base+'/revoke');
        else{const fields=key==='ungrant'?[]:[...out.querySelectorAll('[data-grant="'+eid+'"]:checked')].map(e=>e.value);await connectorPost(base+'/authorize',{fields});}
        await renderConnectors();flash(key==='correct'?'已更正，旧记录保留，新记录需重新授权。':'已保存本人的选择。');
      }));
    }
  }catch(err){out.innerHTML='<div class="notice bad">没读到连接器：'+esc(err.message)+'</div>';}
}

/* ---------- 视图四：送礼管家（私有档案：选品/偏好/常用信息/上次送过什么） ---------- */
const GIFT_RELATIONSHIPS = ["长辈", "晚辈", "同龄人", "朋友", "同事"];
/* 学习进度的常见维度。一个孩子可以同时在很多条线上往前走，按人分只是第一层；
   按维度看才知道哪条线在推进、哪条线很久没碰。 */
const STUDY_DIMS = ["数学", "语文", "英语", "阅读", "练琴", "运动", "绘画", "其它"];
const STUDY_DIM_LABEL = {};
const GIFT_CATS = [["preference", "偏好"], ["size", "尺寸"], ["avoid", "忌讳"], ["last_gift", "上次送过什么"]];
const GIFT_CAT_LABEL = {preference: "偏好", size: "尺寸", avoid: "忌讳", last_gift: "上次送过什么"};
async function renderGift(){
  const out0 = $('out');
  if(out0) out0.innerHTML = '<div class="notice"><b>送礼管家</b>：帮你核对选品、核对偏好、记录常用信息（联系方式、身材信息、兴趣偏好等），也记『上次送过什么』。这些是你的私有档案——不会自动给别人，也不会自动算成已授权用途；要不要用于某一件事、公开哪些字段，始终由你本人逐步确认。</div>';

  const out = $('out');
  let d;
  try{ d = await api('/api/gift-targets'); }
  catch(err){ out.innerHTML = '<div class="notice bad">没读到送礼管家：' + esc(err.message) + '</div>'; return; }
  const groups = d.groups || {};
  let h = '<div class="notice">这些是<b>私有档案</b>，记在你名下，<b>不会自动给别人</b>；只有你明确授权的字段，才可能在送礼协商中带给对方。带进对话时会说明依据来自哪几条、还缺什么，缺的据实问、不编造。</div>';
  h += '<div class="card"><h3>新增到送礼管家</h3>'
    + '<label for="gift-new-name">称呼（填已有姓名即关联该人物，填新姓名则新建）</label>'
    + '<input type="text" id="gift-new-name" placeholder="如 爸爸、大姨、老王">'
    + '<label for="gift-new-rel">关系分类</label><select id="gift-new-rel">'
    + GIFT_RELATIONSHIPS.map(r => '<option value="' + r + '">' + r + '</option>').join('')
    + '</select><div class="row"><button class="btn primary" id="gift-create">加入送礼管家</button></div></div>';
  const order = GIFT_RELATIONSHIPS.concat(Object.keys(groups).filter(k => !GIFT_RELATIONSHIPS.includes(k)));
  let any = false;
  for(const rel of order){
    const list = groups[rel];
    if(!list || !list.length) continue;
    any = true;
    h += '<div class="card"><h3>' + esc(rel) + '</h3>';
    for(const t of list){
      const lg = t.last_gift;
      const cnt = Object.entries(t.entry_counts || {}).filter(([, n]) => n)
        .map(([c, n]) => (GIFT_CAT_LABEL[c] || c) + ' ' + n).join(' · ');
      h += '<section class="notice"><strong>' + esc(t.name) + '</strong> <span class="pill">' + esc(rel) + '</span>'
        + '<div class="meta">档案 ' + esc(t.entry_total) + ' 条' + (cnt ? '（' + esc(cnt) + '）' : '')
        + '<br>上次送过：' + (lg ? esc(lg.value) + (lg.happened_on ? '（' + esc(lg.happened_on) + '）' : '') : '还没记') + '</div>'
        + '<div class="row"><select data-entry-cat="' + t.person_id + '">'
        + GIFT_CATS.map(([c, lab]) => '<option value="' + c + '">' + lab + '</option>').join('')
        + '</select><input type="text" data-entry-val="' + t.person_id + '" placeholder="内容，如 42 码 / 喜欢软底 / 忌讳送烟酒">'
        + '<button class="btn" data-add="' + t.person_id + '">加档案</button></div>'
        + '<div class="row"><button class="btn" data-detail="' + t.person_id + '">查看 / 管理档案条目</button></div>'
        + '<div id="gift-detail-' + t.person_id + '"></div>'
        // 三段式信息：已经送过什么 / 快到节点的关键事件 / 商量过什么。
        // 后两段现在没有数据支撑，就明说在建，不摆空壳假装有。
        + '<div class="meta" style="margin-top:8px"><b>送礼记录</b>：'
        + (lg ? esc(lg.value) + (lg.happened_on ? '（' + esc(lg.happened_on) + '）' : '')
              + '；更早的记录在「查看 / 管理档案条目」里，按时间倒序。'
            : '还没记。送过之后在这里留一条，下次就不会重复。') + '</div>'
        + '<div class="meta" style="margin-top:4px"><b>关键事件</b>（生日、节日、庆典等）：'
        + '<span class="pill">建设中</span> 现在还不会自己记住这些节点，'
        + '也不会在临近时提醒。要记就写进上面的档案条目，例如「生日 6 月 1 日」。</div>'
        + '<div class="meta" style="margin-top:4px"><b>讨论候选的概要</b>：'
        + '<span class="pill">建设中</span> 你和对方商量过哪些候选、各自到什么程度，'
        + '这里还不会汇总。协商过程在对应的事项里看。</div>'
        + '</section>';
    }
    h += '</div>';
  }
  if(!any) h += '<p class="empty">送礼管家还是空的，先在上面加入一个人。</p>';
  out.innerHTML = h;
  $('gift-create').onclick = () => action($('gift-create'), async() => {
    const name = $('gift-new-name').value.trim();
    const rel = $('gift-new-rel').value;
    if(!name){ flash('先填一个称呼', true); return; }
    await post('/api/gift-targets', {name, relationship: rel});
    flash('已加入送礼管家（私有档案，不会自动给别人）。');
    await renderGift();
  });
  out.querySelectorAll('[data-add]').forEach(b => b.onclick = () => action(b, async() => {
    const pid = b.dataset.add;
    const cat = out.querySelector('[data-entry-cat="' + pid + '"]').value;
    const val = out.querySelector('[data-entry-val="' + pid + '"]').value.trim();
    if(!val){ flash('档案内容不能为空', true); return; }
    await post('/api/gift-targets/' + pid + '/entries', {category: cat, value: val});
    flash('已加档案（私有）。');
    await renderGift();
  }));
  out.querySelectorAll('[data-detail]').forEach(b => b.onclick = () => action(b, async() => {
    const pid = b.dataset.detail;
    const box = $('gift-detail-' + pid);
    const det = await api('/api/gift-targets/' + pid);
    let h2 = '<div class="sources"><h4>' + esc(det.name) + ' 的档案条目（更正后旧值仅作来源保留，可查）</h4>';
    if(!det.entries.length) h2 += '<div class="s">（还没有有效档案）</div>';
    for(const e of det.entries){
      h2 += '<div class="s">' + esc(GIFT_CAT_LABEL[e.category] || e.category) + '：' + esc(e.value)
        + '<br><span class="meta">提供者 ' + esc(e.provider || '未标注') + ' · '
        + esc(e.happened_on || '日期未标注') + '</span></div>'
        + '<div class="row"><input type="text" data-fix-val="' + e.event_id + '" value="' + esc(e.value) + '">'
        + '<button class="btn" data-fix="' + e.event_id + '">更正</button>'
        + '<button class="btn" data-revoke="' + e.event_id + '">撤回</button></div>';
    }
    h2 += '</div>';
    box.innerHTML = h2;
    box.querySelectorAll('[data-fix]').forEach(btn => btn.onclick = () => action(btn, async() => {
      const eid = btn.dataset.fix;
      const v = box.querySelector('[data-fix-val="' + eid + '"]').value.trim();
      if(!v){ flash('更正内容不能为空', true); return; }
      await post('/api/gift-targets/entries/' + eid + '/correct', {value: v});
      flash('已更正，旧值仅作来源保留。');
      await renderGift();
    }));
    box.querySelectorAll('[data-revoke]').forEach(btn => btn.onclick = () => action(btn, async() => {
      if(!confirm('撤回这条档案？历史仍保留、可查，但不再作为当前值。')) return;
      await post('/api/gift-targets/entries/' + btn.dataset.revoke + '/revoke', {});
      flash('已撤回，历史仍保留。');
      await renderGift();
    }));
  }));
}

/* ---------- 视图五：关系分类（t53 壳体，建设中） ----------
   只是分类本身：能存、能改。不按它检索、不推荐、不进任何协商提示词，
   也不影响家庭结构判断。界面必须让人一眼看出这是在建能力。 */
const REL_CLASS_VALUES = ["亲人", "长辈", "晚辈", "同龄人", "朋友", "工作伙伴", "其他"];
async function renderRelClass(){
  const out = $('out');
  let d;
  try{ d = await api('/api/social-classes'); }
  catch(err){ out.innerHTML = '<div class="notice bad">没读到关系分类：' + esc(err.message) + '</div>'; return; }
  let h = '<div class="notice"><b>建设中</b>：这只是人际关系分类本身，能存能改。'
    + '它还不驱动检索、推荐或任何协商，也不要据此推断家庭结构。'
    + '现在还不能按它找人，也没有按它的推荐。</div>';
  h += '<div class="card"><h3>给人物标分类</h3>'
    + '<p class="sub">一个人可以有多个分类（既是亲戚又是朋友），也可以不分类。'
    + '分类只存在你自己的记录里。</p>';
  const persons = d.persons || [];
  if(!persons.length){ h += '<p class="empty">还没有可分类的人物。</p>'; }
  for(const p of persons){
    const mine = p.classes || [];
    h += '<div class="row" style="align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0">'
      + '<span style="min-width:96px">' + esc(p.name) + '</span>';
    for(const c of REL_CLASS_VALUES){
      h += '<label style="font-size:12.5px"><input type="checkbox" data-rc-person="' + esc(p.person_id)
        + '" value="' + c + '"' + (mine.includes(c) ? ' checked' : '') + '> ' + c + '</label> ';
    }
    h += '</div>';
  }
  h += '<div class="row"><button class="btn primary" id="relclass-save">保存分类</button></div></div>';
  out.innerHTML = h;
  $('relclass-save').onclick = () => action($('relclass-save'), async () => {
    const byPerson = {};
    out.querySelectorAll('input[data-rc-person]').forEach(cb => {
      const pid = cb.dataset.rcPerson;
      if(!byPerson[pid]) byPerson[pid] = [];
      if(cb.checked) byPerson[pid].push(cb.value);
    });
    let n = 0;
    for(const pid of Object.keys(byPerson)){
      await post('/api/persons/' + encodeURIComponent(pid) + '/social-class', {classes: byPerson[pid]});
      n += 1;
    }
    flash('已保存 ' + n + ' 人的分类（建设中，暂不驱动任何能力）。');
    await renderRelClass();
  });
}

async function render(){
  if(view === "study") await renderStudy();
  else if(view === "connectors") await renderConnectors();
  else if(view === "gift") await renderGift();
  else if(view === "relclass") await renderRelClass();
  else await renderPlan();
}

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) =>
      t.setAttribute("aria-selected", String(t === tab)));
    view = tab.dataset.view;
    render();
  });
});

if("serviceWorker" in navigator && window.isSecureContext !== false){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/static/sw.js").catch(() => {});
  });
}
</script>
