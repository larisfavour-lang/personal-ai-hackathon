<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f7f6f3"><title>参与这一件事</title>
<style>
:root{--paper:#f7f6f3;--ink:#302d29;--muted:#625e57;--accent:#34463f;--line:#918b82;--bad:#a5362c;--focus:#376a53}*{box-sizing:border-box}html,body{margin:0;overflow-x:clip}body{font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink)}main{max-width:620px;margin:auto;padding:24px 18px calc(32px + env(safe-area-inset-bottom,0px));min-height:100dvh}h1{font-size:24px;line-height:1.35;margin:0 0 12px;overflow-wrap:anywhere}h2{font-size:18px;margin:26px 0 10px}p{margin:8px 0}section{padding:8px 0 20px;border-bottom:1px solid #dedbd4}label{display:block;margin:12px 0 4px}input,textarea,select{display:block;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fffefa;color:var(--ink);font:inherit}textarea{min-height:96px;resize:vertical}button{min-width:44px;min-height:44px;margin:8px 8px 0 0;padding:10px 16px;border:1px solid var(--accent);border-radius:10px;font:inherit;font-weight:500;white-space:nowrap;background:var(--accent);color:var(--paper);cursor:pointer}button.ghost{background:transparent;color:var(--accent)}button:disabled{opacity:.55;cursor:wait}button:active{transform:translateY(1px)}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}@media(hover:hover){button:hover{filter:brightness(.95)}}.sub,.notice{color:var(--muted);font-size:14px}.notice{padding:12px;background:#eceee8;border-radius:10px}.error{color:var(--bad)}.row{padding:8px 0;overflow-wrap:anywhere}.row b{display:block}.status{padding:12px 0;min-height:44px;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:4px}.state{font-weight:600;color:var(--accent)}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main>
<h1>参与这一件事</h1><p class="notice">本地演示：你以自称家庭参与，仅可访问这件事。邀请不验证实名，不代表既有联系人，也不继承他人的条件、孩子或资料。使用虚构数据；局域网 HTTP 不防网络窃听。</p>
<div id="status" class="status" role="status" aria-live="polite">正在查看参与入口…</div><div id="content"></div>
</main><script>
(()=>{"use strict";
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Fragment is never a server URL, persisted storage, DOM field or console message.
let token=new URLSearchParams(location.hash.slice(1)).get('token')||'', csrf='', view=null;
if(location.hash) history.replaceState(null,'',location.pathname);
const decisionText={accept:'接受',reject:'不接受',counter:'有修改意见',pending:'待回应',reviewed:'代表已审阅，本人待确认',stale:'旧版已失效'};
const keys=['时间','地点','活动总预算','本人出资上限','活动内容','孩子安排','交通','备注'];
function status(t,bad=false){$('status').textContent=t;$('status').classList.toggle('error',bad);$('status').setAttribute('role',bad?'alert':'status');}
function invalid(t){view=null;csrf='';$('content').innerHTML='<p class="notice">这个参与入口已失效或无法验证。请发起人重新邀请；不会跳回普通首页或切换为其他人。</p>';status(t,true);}
async function request(path,body){const opts={credentials:'same-origin',cache:'no-store',referrerPolicy:'no-referrer'};if(body!==undefined){opts.method='POST';opts.headers={'Content-Type':'application/json'};if(csrf)opts.headers['X-CSRF-Token']=csrf;opts.body=JSON.stringify(body);}const r=await fetch('/api/participation/'+path,opts),d=await r.json().catch(()=>({}));if(!r.ok){let m=d.detail||d.error?.message||'请求未完成';if(Array.isArray(m))m=m.map(x=>x.msg||'字段不正确').join('；');const err=new Error(typeof m==='string'?m:'请求未完成');err.status=r.status;if(path!=='accept'&&(r.status===401||r.status===403))invalid(err.message);throw err;}return d;}
function claim(){status('先明确接受邀请，再由发起人认可自称家庭，最后对当前方案表态。');$('content').innerHTML='<section><h2>第一步：接受邀请</h2><label for="guest-name">你自称的家庭称呼</label><input id="guest-name" maxlength="40" autocomplete="off" aria-describedby="name-help"><p id="name-help" class="sub">例如「来宾一家」。称呼未核验，不是登录成小周或小林。</p><button id="claim">接受这次邀请</button></section>';$('claim').onclick=async()=>{const name=$('guest-name').value.trim();if(!name){status('请填自称家庭称呼；它不验证实名。',true);$('guest-name').focus();return;}const b=$('claim');b.disabled=true;b.textContent='正在接收…';try{const d=await request('accept',{token,display_name:name});token='';csrf=d.csrf_token||'';await load();}catch(e){status(e.message,true);if($('claim')){b.disabled=false;b.textContent='接受这次邀请';}}};}
async function load(){try{const d=await request('plan');csrf=d.csrf_token||csrf;view=d;render();status('已读到当前事项；只操作自己这一方。');return true;}catch(e){if(!view)invalid(e.message);else status(e.message,true);return false;}}
function render(){const d=view,p=d.plan||d,me=d.me||p.me||{},approved=d.approved??me.approved??false;const ver=p.current_version||0;
let h='<section><h2>'+esc(p.title||'共同活动')+'</h2><div class="row state">'+(p.needs_replan?'条件或来源变了，待发起人重排':p.agreed?'当前第 '+esc(ver)+' 版已约定':'当前还是候选，未回应或出席仍待确认')+'</div><p class="sub">'+esc(d.identity_note||'邀请参与者自称，未核验账号身份')+'</p><p>你的称呼：'+esc(me.label||'自称参与者')+'</p><p id="approval" class="notice">第二步：'+(approved?'发起人已认可你占一个自称家庭槽。这不是实名核验，也不是接受方案。':'等待发起人认可自称家庭；接邀请不算已入场，不算同意方案。')+'</p>';
const gaps=p.confirmation_gaps||p.plan_status?.confirmation_gaps||[];if(gaps.length)h+='<p class="notice">仍待确认：'+gaps.map(x=>esc(typeof x==='string'?x:x.reason||x.label||'参与或出席')).join('；')+'</p>';
if(p.proposal){h+='<h2>第 '+esc(ver)+' 版方案</h2>';Object.entries(p.proposal).forEach(([k,v])=>h+='<div class="row"><b>'+esc(k)+'</b>'+esc(typeof v==='object'?JSON.stringify(v):v)+'</div>');if(p.proposal_reason)h+='<p class="sub">'+esc(p.proposal_reason)+'</p>';}else h+='<p>暂时没有方案版本，由发起人排第一版。</p>';
const participants=p.participants||[];if(participants.length){h+='<h2>公开的各方条件</h2>';for(const party of participants){h+='<div class="row"><b>'+esc(party.label)+'</b>';Object.entries(party.conditions||{}).forEach(([k,v])=>h+=esc(k)+'：'+esc(v)+'<br>');const pd=(p.decisions||[]).filter(x=>x.participant_id===party.participant_id&&x.version===ver).at(-1);h+='状态：'+esc(decisionText[party.state]||'待回应')+(pd?.decided_by==='representative'?'（代表建议，不是本人确认）':'')+'</div>';}}
h+='</section><section><h2>只补自己这一方</h2><p class="sub">以下条件和你主动填写的孩子信息在本事项对其他参与者可见。总预算与本人出资上限不同；留空就是未知，不替别人填。</p>';
for(const k of keys)h+='<label>'+esc(k)+'<input data-condition="'+esc(k)+'" value="'+esc(me.conditions?.[k]||'')+'" maxlength="500"></label>';
h+='<label for="child-count">本人提供的孩子名单数</label><input id="child-count" type="number" min="0" max="20" value="'+esc(me.children_count??'')+'"><p class="sub">与下面名单条数一致；每个孩子的出席分别确认。留空表示名单人数未知，0 表示没有孩子。</p><label for="children">本人的孩子名单与出席</label><textarea id="children" maxlength="2000" placeholder="孩子称呼|来\n另一个称呼|不来"></textarea><p class="sub">每行「称呼|来／不来／待定」，最多 20 行；没有名单不从联系人资料补。</p><button id="save-condition">保存本方条件</button></section>';
const currentDecisions=(p.decisions||[]).filter(x=>x.participant_id===me.participant_id&&x.version===ver);const personal=currentDecisions.filter(x=>x.decided_by!=='representative').at(-1),representative=currentDecisions.filter(x=>x.decided_by==='representative').at(-1);const personalLabel=personal?decisionText[personal.decision]||'待回应':'尚未本人确认';const can=approved&&ver>0&&!p.needs_replan;h+='<section><h2>第三步：对当前方案表态</h2><p class="sub">代表审阅是模型按你公开的条件先看，不是你本人同意。接受只针对这一个版本，改条件后需重排再确认。</p><p id="my-decision">本人状态：'+esc(p.needs_replan?'旧版失效，等重排':personalLabel)+'</p>'+(representative?'<p>代表审阅：'+esc(decisionText[representative.decision]||'待回应')+'（不是本人确认）</p>':'')+'<div class="actions"><button class="ghost" id="review" '+(!can?'disabled':'')+'>请代表先审阅</button><button id="accept-version" '+(!can?'disabled':'')+'>接受当前版</button><button class="ghost" id="reject-version" '+(!can?'disabled':'')+'>不接受</button></div>'+(!can?'<p class="notice">先等发起人认可、生成当前版并完成重排，才能审阅或表态。</p>':'')+'</section><button class="ghost" id="refresh">刷新当前事项</button>';
$('content').innerHTML=h;$('children').value=(me.children||[]).map(c=>c.name+'|'+({coming:'来',not_coming:'不来',unknown:'待定'}[c.attendance]||'待定')).join('\n');
async function action(id,path,body,success){const b=$(id);if(b.disabled)return;b.disabled=true;const label=b.textContent;b.textContent='正在处理…';status('正在处理，尚未完成…');try{await request(path,body);if(await load())status(success);else if($(id)){b.disabled=false;b.textContent=label;}}catch(e){status(e.message,true);if($(id)){b.disabled=false;b.textContent=label;}}}
$('save-condition').onclick=()=>{const conditions={};document.querySelectorAll('[data-condition]').forEach(e=>{if(e.value.trim())conditions[e.dataset.condition]=e.value.trim();});const raw=$('children').value.trim(),children=[];if(raw){for(const line of raw.split('\n')){const [name,state]=line.split('|').map(s=>s.trim());if(!name||!['来','不来','待定'].includes(state)||name.length>40){status('名单请每行写「称呼|来／不来／待定」，称呼最多 40 字。',true);return;}children.push({name,attendance:{'来':'coming','不来':'not_coming','待定':'unknown'}[state]});}}const count=$('child-count').value===''?null:Number($('child-count').value);if(children.length>20||(count!==null&&(!Number.isInteger(count)||count<0||count>20))){status('孩子数应为 0–20 的整数；名单最多 20 行。',true);return;}action('save-condition','condition',{conditions,children,children_count:count},'本方条件已保存；不等于接受方案，等待重排。');};
$('review').onclick=()=>action('review','review',{version:ver},'代表审阅已记录，不是本人的确认。');$('accept-version').onclick=()=>action('accept-version','decide',{version:ver,decision:'accept',reason:'本人在受邀页确认当前版本'},'已记录本人对第 '+ver+' 版的接受；其他家庭或出席缺口仍分别确认。');$('reject-version').onclick=()=>action('reject-version','decide',{version:ver,decision:'reject',reason:'本人不接受当前版本'},'已记录本人的不接受。');$('refresh').onclick=load;
}
if(token)claim();else load();
})();
</script></body></html>
